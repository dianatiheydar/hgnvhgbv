function addNumberLine(a, b, n){
  if(a === b) b = a + 10;
  if(a > b){ const t = a; a = b; b = t; }
  n = Math.max(1, Math.round(n));
  const step = (b - a) / n;
  const dec = Number.isInteger(step) ? 0 : Math.min(2, Math.max(1, (String(step).split('.')[1]||'').length));
  const px = clamp(620 / (b - a), 8, 40);
  const W = (b - a) * px;
  const col = S.color;
  const items = [new fabric.Line([-W/2, 0, W/2, 0], { stroke:col, strokeWidth:3 })];
  items.push(new fabric.Triangle({ left:-W/2-8, top:0, width:14, height:12, angle:-90, fill:col, originX:'center', originY:'center' }));
  items.push(new fabric.Triangle({ left: W/2+8, top:0, width:14, height:12, angle: 90, fill:col, originX:'center', originY:'center' }));
  const spacing = W / n;
  const labelEvery = Math.max(1, Math.ceil(36 / spacing));
  for(let i=0; i<=n; i++){
    const x = -W/2 + i * spacing;
    items.push(new fabric.Line([x, -9, x, 9], { stroke:col, strokeWidth:2 }));
    if(i % labelEvery === 0){
      items.push(new fabric.Text(faNum(a + i*step, dec), { left:x, top:16, fontSize:16, originX:'center', fill:col }));
    }
  }
  const g = new fabric.Group(items, { originX:'center', originY:'center' });
  const c = viewCenter();
  g.set({ left:c.x, top:c.y });
  addAndSelect(g);
}
const PLACE_LEVELS = ['یکان','دهگان','صدگان','هزارگان','ده‌هزارگان','صدهزارگان','میلیون‌گان','ده‌میلیون‌گان','صد میلیون‌گان','میلیاردگان','ده‌میلیاردگان','صد میلیاردگان'];
const PLACE_TIERS  = ['واحدها','هزارها','میلیون‌ها','میلیاردها','تریلیون‌ها','کوادریلیون‌ها'];
const PLACE_DECIMALS = ['دهم','صدم','هزارم','ده‌هزارم','صدهزارم','میلیونیم'];
// جدول ارزش مکانی: nInt رقم صحیح (یکان در راست بخش صحیح) و در صورت نیاز nDec رقم اعشار بعد از ممیز
function addPlaceValue(nInt, nDec){
  nInt = clamp(Math.round(nInt), 1, 12);
  nDec = clamp(Math.round(nDec || 0), 0, 6);
  const col = S.color;
  const cw = 84, ch = 64, headH = 30, pw = nDec ? 30 : 0;
  const W = (nInt + nDec)*cw + pw, H = headH + ch;
  const x0 = -W/2, y0 = -H/2;
  const intRight = x0 + nInt*cw;        // لبه‌ی راستِ ستون یکان
  const items = [];
  const header = (left, cols, label)=>{
    items.push(new fabric.Rect({
      left:left + 3, top:y0, width:cols*cw - 6, height:headH - 4,
      fill:hexToRgba(col, .13), stroke:col, strokeWidth:2, rx:8
    }));
    items.push(new fabric.Text(label, {
      left:left + cols*cw/2, top:y0 + (headH - 4)/2 - 10,
      fontSize:cols === 1 ? 14 : 16, fontWeight:'bold', fill:col, originX:'center'
    }));
  };
  const cell = (left, label)=>{
    items.push(new fabric.Rect({
      left:left + 2, top:y0 + headH, width:cw - 4, height:ch,
      fill:S.dark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.45)', stroke:col, strokeWidth:2, rx:6
    }));
    items.push(new fabric.Text(label, {
      left:left + cw/2, top:y0 + headH + ch - 20, fontSize:14, fill:col, originX:'center'
    }));
  };
  // بخش صحیح: هر سه رقم زیر یک رتبه (واحدها، هزارها، …)
  const nTiers = Math.ceil(nInt/3);
  for(let t=0; t<nTiers; t++){
    const cols = Math.min(3, nInt - 3*t);
    header(intRight - 3*t*cw - cols*cw, cols, PLACE_TIERS[t] || ('رتبه ' + (t+1)));
  }
  for(let i=0; i<nInt; i++) cell(intRight - (i + 1)*cw, PLACE_LEVELS[i] || String(i+1));
  // بخش اعشاری: ممیز و سپس دهم، صدم، …
  if(nDec){
    const dl = intRight + pw;
    header(dl, nDec, nDec === 1 ? 'اعشار' : 'قسمت اعشاری');
    items.push(new fabric.Circle({
      left:intRight + pw/2, top:y0 + headH + ch*0.55, radius:5.5,
      fill:col, originX:'center', originY:'center'
    }));
    items.push(new fabric.Text('ممیز', {
      left:intRight + pw/2, top:y0 + headH + ch - 18, fontSize:10, fill:col, originX:'center'
    }));
    for(let j=0; j<nDec; j++) cell(dl + j*cw, PLACE_DECIMALS[j]);
  }
  const g = new fabric.Group(items, { originX:'center', originY:'center' });
  const c = viewCenter();
  g.set({ left:c.x, top:c.y });
  addAndSelect(g);
}
function addAxes(n){
  n = clamp(Math.round(n), 1, 12);
  const col = S.color;
  const px = clamp(340 / (2*n), 12, 26);
  const half = n * px;
  const items = [
    new fabric.Line([-half, 0, half, 0], { stroke:col, strokeWidth:2 }),
    new fabric.Line([0, -half, 0, half], { stroke:col, strokeWidth:2 })
  ];
  for(let i=-n; i<=n; i++){
    if(i) items.push(
      new fabric.Line([i*px, -5, i*px, 5], { stroke:col }),
      new fabric.Line([-5, i*px, 5, i*px], { stroke:col })
    );
  }
  const g = new fabric.Group(items, { originX:'center', originY:'center' });
  const c = viewCenter();
  g.set({ left:c.x, top:c.y });
  addAndSelect(g);
}
/* ---- گسترده‌ی اشکال: ساختن، باز و بسته کردنِ نمایشی، چرخاندن ---- */
function openNetDialog(){

  promptDialog('📦 گسترده‌ی اشکال', [
    { key:'kind', type:'choice', label:'شکل', value:'cube',
      options:[{ v:'cube', t:'مکعب' }, { v:'prism', t:'منشور' }, { v:'pyramid', t:'هرم' }, { v:'cylinder', t:'استوانه' }, { v:'cone', t:'مخروط' }],
      onPick:(v, inp)=>{ const i = inp.n; if(i && i.previousSibling) i.previousSibling.textContent = nLabel(v); } },
    { key:'variant', type:'pick', label:'کدام گسترده‌ی مکعب؟ (۱۱ حالت)', value:0, showIf:c => c.kind === 'cube',
      options:CUBE_NETS.map((c, i)=> ({ v:i, title:'گسترده‌ی ' + faNum(i + 1, 0), html:cubeNetSvg(c) + '<span>' + faNum(i + 1, 0) + '</span>' }))
        .concat([{ v:'all', title:'هر ۱۱ گسترده کنار هم', html:'<b>همه</b><span>۱۱ حالت</span>' }]) },
    { key:'n', label:nLabel('prism'), min:3, max:12, int:true, value:4, showIf:c => c.kind === 'prism' || c.kind === 'pyramid' }
  ]).then(v=>{
    if(!v) return;
    if(v.kind === 'cube' && v.variant === 'all') addAllCubeNets();
    else addNet(v.kind, v.n || 4, v.variant || 0);
  });
}
// بخشی از بوم که زیر نوار ابزار، نوار تنظیمات و منوی پایینِ سایت نیست (مختصات صفحه)
function freeArea(){
  const W = canvas.getWidth(), H = canvas.getHeight(), mobile = W <= 700;
  const tr = document.getElementById('toolbar').getBoundingClientRect();
  const l = tr.width && tr.right - wrapRect.left < W/2 ? tr.right - wrapRect.left + 8 : 0;
  const sb = parseFloat(getComputedStyle(document.body).getPropertyValue('--safe-b')) || 0;
  const t = mobile ? 100 : 12, b = mobile ? H - sb - 8 : H - 110;
  return { l, t, w:Math.max(80, W - l - 8), h:Math.max(80, b - t) };
}
function addNet(kind, n, variant){
  const z = canvas.getZoom(), fa = freeArea();
  const c = toWorld({ x:fa.l + fa.w/2, y:fa.t + fa.h/2 });
  const o = new fabric.WbNet({
    kind, n, variant, stroke:S.color, strokeWidth:clamp(S.width, 2, 5), opacity:S.opacity, left:c.x, top:c.y
  });
  // گسترده در صفحه جا شود (مخصوصاً در موبایل)
  const fit = Math.min(1, fa.w*0.92/(o.width + 30), fa.h*0.92/(o.height + 30));
  o.set({ scaleX:fit/z, scaleY:fit/z });
  o.setCoords();
  addAndSelect(o);
  status('📦 «بستن» را بزنید تا ' + o.netName() + ' ساخته شود — دوبار زدن روی شکل = باز/بسته، دایره‌ی بالای کادر = چرخاندن');
}
// هر ۱۱ گسترده‌ی مکعب در یک جدول، همه با هم انتخاب‌شده تا با یک دکمه بسته شوند
function addAllCubeNets(){
  flushHistory();
  if(S.tool !== 'select') setTool('select');
  const z = canvas.getZoom(), fa = freeArea(), N = CUBE_NETS.length;
  const cols = fa.w >= fa.h ? 4 : 3, rows = Math.ceil(N/cols), cw = fa.w/cols, ch = fa.h/rows;
  const list = CUBE_NETS.map((_, v)=> new fabric.WbNet({ kind:'cube', variant:v, stroke:S.color, opacity:S.opacity }));
  const sc = Math.min(1, ...list.map(o=> Math.min(cw*0.86/(o.width + 10), ch*0.8/(o.height + 10))));
  list.forEach((o, i)=>{
    // از راست به چپ (مثل ترتیبِ جدولِ انتخاب): گسترده‌ی ۱ بالا-راست
    const c = toWorld({ x:fa.l + cw*(cols - 1 - i % cols + 0.5), y:fa.t + ch*(Math.floor(i/cols) + 0.5) });
    o.set({ left:c.x, top:c.y, scaleX:sc/z, scaleY:sc/z, strokeWidth:clamp(S.width, 2, 5)/Math.max(sc, 0.55) });
    o.setCoords();
    canvas.add(o);
  });
  canvas.setActiveObject(new fabric.ActiveSelection(list, { canvas }));
  canvas.requestRenderAll();
  saveHistory();
  status('🧊 هر ۱۱ گسترده‌ی مکعب — «بستن همه» را بزنید؛ برای یکی، اول بیرون و بعد روی همان گسترده بزنید');
}
// گسترده(های) انتخاب‌شده — یکی، یا چندتا وقتی همه‌ی انتخاب گسترده باشد
function netList(){
  const o = canvas.getActiveObject();
  if(!o) return [];
  if(o.type === 'wbNet') return [o];
  if(o.type === 'activeSelection'){
    const l = o.getObjects();
    if(l.length && l.every(x=> x.type === 'wbNet')) return l;
  }
  return [];
}
// کادرِ انتخابِ چندتایی بعد از تغییر اندازه‌ی گسترده‌ها به‌روز شود
function netSelRefresh(){
  const a = canvas.getActiveObject();
  if(a && a.type === 'activeSelection') a.addWithUpdate();
  else if(a) a.setCoords();
}
// رنگ‌کردنِ وجه با سطل (برای سطحِ خمیده، کلِ آن سطح)؛ همان رنگ دوباره = برگشت به رنگِ پیش‌فرض
function paintNetFace(o, gi){
  flushHistory();
  const arr = (o.faceColors || []).slice();
  const same = arr[gi] && toHex(arr[gi]) === toHex(S.color);
  arr[gi] = same ? null : S.color;
  o.set('faceColors', arr.some(Boolean) ? arr : null);
  canvas.requestRenderAll();
  saveHistory();
  updateCtxBar();
}
// پویانمایی: هر ویژگی (fold, yaw, elev) مسیر جدای خودش را دارد تا هم‌زمان کار کنند
const netAnims = new Map();
function netAnimate(o, props, ms, ease){
  let a = netAnims.get(o);
  if(!a){ a = { tracks:{}, raf:0 }; netAnims.set(o, a); }
  const now = performance.now();
  for(const k in props){
    if(Math.abs(props[k] - o[k]) < 1e-4) delete a.tracks[k];
    else a.tracks[k] = { from:o[k], to:props[k], t0:now, ms:Math.max(1, ms), ease };
  }
  if(!Object.keys(a.tracks).length){ netStop(o); return; }
  if(!a.raf) a.raf = requestAnimationFrame(t=> netStep(o, t));
}
function netStep(o, now){
  const a = netAnims.get(o);
  if(!a) return;
  a.raf = 0;
  if(!o.canvas){ netAnims.delete(o); return; }          // حذف شد یا تاریخچه برگشت
  const p = {};
  let foldDone = false;
  for(const k in a.tracks){
    const tr = a.tracks[k], u = clamp((now - tr.t0)/tr.ms, 0, 1);
    p[k] = tr.from + (tr.to - tr.from)*(tr.ease ? easeInOut(u) : u);
    if(u >= 1){ delete a.tracks[k]; if(k === 'fold') foldDone = true; }
  }
  o.setNetState(p);
  canvas.requestRenderAll();
  if(foldDone) status(o.fold > 0.5 ? '📦 ' + o.netName() + ' بسته شد' : '📂 گسترده‌ی ' + o.netName() + ' باز شد');
  const act = canvas.getActiveObject(), inSel = !!act && (act === o || o.group === act);
  if(Object.keys(a.tracks).length) a.raf = requestAnimationFrame(t=> netStep(o, t));
  else {
    netAnims.delete(o);
    if(inSel) netSelRefresh();
    saveHistoryDebounced();       // چند گسترده با هم = یک مرحله در تاریخچه
  }
  if(inSel) fillCtx();
}
function netStop(o, keys){
  const a = netAnims.get(o);
  if(!a) return;
  if(keys){ keys.forEach(k=> delete a.tracks[k]); if(Object.keys(a.tracks).length) return; }
  if(a.raf) cancelAnimationFrame(a.raf);
  netAnims.delete(o);
}
function netGoal(o, k){
  const a = netAnims.get(o), tr = a && a.tracks[k];
  return tr ? tr.to : o[k];
}
function netToggle(list){
  if(!Array.isArray(list)) list = [list];
  if(!list.length) return;
  const closing = netGoal(list[0], 'fold') < 0.5, to = closing ? 1 : 0;
  list.forEach(o=> netAnimate(o, { fold:to }, 2600*Math.abs(to - o.fold), false));
  const nm = list.length > 1 ? 'گسترده‌ها' : list[0].netName();
  status(closing ? '📦 در حال بسته شدنِ ' + nm + '…' : '📂 در حال باز شدنِ ' + nm + '…');
  fillCtx();
}
// نمای خودکار خاموش می‌شود ولی نمای فعلی دقیقاً حفظ می‌شود
function netFreezeCam(o){
  if(!o.autoCam) return;
  const c = o.camera();
  o.setNetState({ autoCam:false, elev:c.E, yaw:c.Y });
}
function netRotate(o, deg){
  netFreezeCam(o);
  netAnimate(o, { yaw:netGoal(o, 'yaw') + deg }, 650, true);
}

function onlyRotateControls(o){
  o.setControlsVisibility({ ml:false, mr:false, mt:false, mb:false, tl:false, tr:false, bl:false, br:false, mtr:true });
  return o;
}

/* ============================================================
   شکل‌های کسری و مدل‌های اعشاری
   هر شکل یک گروه است: قسمت‌ها (فقط رنگ) + خطوط (روی رنگ‌ها) + برچسب
============================================================ */
function openFracShapeDialog(){
  promptDialog('🍕 کسر با شکل', [
    { key:'kind', type:'choice', label:'شکل', value:'circle',
      options:[{ v:'circle', t:'دایره' }, { v:'bar', t:'نوار' }, { v:'triangle', t:'مثلث' }, { v:'grid', t:'شبکه' }] },
    { key:'n', label:'تعداد قسمت‌ها', min:1, max:36, int:true, value:8, showIf:c => c.kind !== 'grid' },
    { key:'rows', label:'تعداد سطرها', min:1, max:12, int:true, value:3, showIf:c => c.kind === 'grid' },
    { key:'cols', label:'تعداد ستون‌ها', min:1, max:12, int:true, value:4, showIf:c => c.kind === 'grid' },
    { key:'label', type:'choice', label:'نمایش کسر', value:'no', options:[{ v:'no', t:'خیر' }, { v:'yes', t:'بله' }] }
  ]).then(v=>{
    if(!v) return;
    addFracShape(v.kind, { n:v.n, rows:v.rows, cols:v.cols, label:v.label === 'yes' });
  });
}
function openDecShapeDialog(){
  promptDialog('🔟 مدل اعشاری', [
    { key:'kind', type:'choice', label:'مدل', value:'100', options:[{ v:'10', t:'دهم (۱۰ قسمت)' }, { v:'100', t:'صدم (۱۰۰ قسمت)' }] },
    { key:'label', type:'choice', label:'نمایش عدد', value:'no', options:[{ v:'no', t:'خیر' }, { v:'yes', t:'بله' }] }
  ]).then(v=>{
    if(!v) return;
    if(v.kind === '10') addFracShape('bar', { n:10, w:300, h:300, dec:1, label:v.label === 'yes' });
    else addFracShape('grid', { rows:10, cols:10, cell:30, dec:2, label:v.label === 'yes' });
  });
}
function addFracShape(kind, opts){
  const col = S.color, sw = clamp(S.width, 2, 6);
  const lineOpt = { stroke:col, strokeWidth:sw, fill:null, strokeLineCap:'round', strokeLineJoin:'round', objectCaching:false };
  const partOpt = i => ({ fill:null, stroke:null, strokeWidth:0, wbRole:'part', wbIdx:i, objectCaching:false });
  const parts = [], lines = [];
  let meta, halfH;
  if(kind === 'circle'){
    const r = 120, n = clamp(opts.n || 1, 1, 36);
    meta = { kind, n, r };
    if(n === 1){
      parts.push(new fabric.Circle({ ...partOpt(0), radius:r, left:0, top:0, originX:'center', originY:'center' }));
    } else {
      for(let i=0; i<n; i++){
        const a0 = (-90 + i*360/n)*D2R, a1 = (-90 + (i + 1)*360/n)*D2R;
        const large = 360/n > 180 ? 1 : 0;
        const f = v => Math.round(v*1000)/1000;
        parts.push(new fabric.Path(`M 0 0 L ${f(r*Math.cos(a0))} ${f(r*Math.sin(a0))} A ${r} ${r} 0 ${large} 1 ${f(r*Math.cos(a1))} ${f(r*Math.sin(a1))} Z`, partOpt(i)));
        lines.push(new fabric.Line([0, 0, r*Math.cos(a0), r*Math.sin(a0)], lineOpt));
      }
    }
    lines.push(new fabric.Circle({ ...lineOpt, radius:r, left:0, top:0, originX:'center', originY:'center', wbRole:'outline' }));
    halfH = r;
  } else if(kind === 'bar'){
    const n = clamp(opts.n || 1, 1, 36), w = opts.w || Math.min(420, Math.max(240, n*36)), h = opts.h || 80;
    meta = { kind, n, w, h };
    const thin = n > 12 ? Math.max(1.2, sw*0.6) : sw;
    for(let i=0; i<n; i++) parts.push(new fabric.Rect({ ...partOpt(i), left:-w/2 + i*w/n, top:-h/2, width:w/n, height:h }));
    for(let i=1; i<n; i++) lines.push(new fabric.Line([-w/2 + i*w/n, -h/2, -w/2 + i*w/n, h/2], { ...lineOpt, strokeWidth:thin }));
    lines.push(new fabric.Rect({ ...lineOpt, left:0, top:0, width:w, height:h, originX:'center', originY:'center', wbRole:'outline' }));
    halfH = h/2;
  } else if(kind === 'triangle'){
    const n = clamp(opts.n || 1, 1, 24), w = 280, h = 240;
    meta = { kind, n, w, h };
    const A = { x:0, y:-h/2 };
    for(let i=0; i<n; i++){
      const x0 = -w/2 + i*w/n, x1 = x0 + w/n;
      parts.push(new fabric.Polygon([A, { x:x0, y:h/2 }, { x:x1, y:h/2 }], partOpt(i)));
    }
    for(let i=1; i<n; i++) lines.push(new fabric.Line([0, -h/2, -w/2 + i*w/n, h/2], lineOpt));
    lines.push(new fabric.Polygon([A, { x:w/2, y:h/2 }, { x:-w/2, y:h/2 }], { ...lineOpt, wbRole:'outline' }));
    halfH = h/2;
  } else {
    const rows = clamp(opts.rows || 1, 1, 12), cols = clamp(opts.cols || 1, 1, 12);
    const cell = opts.cell || Math.min(300/cols, 300/rows, 70), w = cols*cell, h = rows*cell;
    meta = { kind:'grid', rows, cols, n:rows*cols, w, h };
    const thin = rows*cols > 30 ? Math.max(1.2, sw*0.5) : sw;
    for(let r=0; r<rows; r++) for(let c=0; c<cols; c++)
      parts.push(new fabric.Rect({ ...partOpt(r*cols + c), left:-w/2 + c*cell, top:-h/2 + r*cell, width:cell, height:cell }));
    for(let c=1; c<cols; c++) lines.push(new fabric.Line([-w/2 + c*cell, -h/2, -w/2 + c*cell, h/2], { ...lineOpt, strokeWidth:thin }));
    for(let r=1; r<rows; r++) lines.push(new fabric.Line([-w/2, -h/2 + r*cell, w/2, -h/2 + r*cell], { ...lineOpt, strokeWidth:thin }));
    lines.push(new fabric.Rect({ ...lineOpt, left:0, top:0, width:w, height:h, originX:'center', originY:'center', wbRole:'outline' }));
    halfH = h/2;
  }
  meta.dec = opts.dec || 0;
  // کسرِ واقعی (صورت، خط کسری، مخرج) زیر شکل؛ جای بزرگ‌ترین عدد از اول رزرو می‌شود
  const label = new fabric.WbFracLabel({
    num:0, den:meta.n, maxN:meta.n, dec:meta.dec, fill:col, visible:!!opts.label, wbRole:'fracLabel', left:0, top:0
  });
  label.set('top', halfH + 14 + label.height/2);
  const g = new fabric.Group(parts.concat(lines, [label]), { originX:'center', originY:'center', wbFrac:meta });
  const c = viewCenter(), z = canvas.getZoom();
  g.set({ left:c.x, top:c.y, scaleX:1/z, scaleY:1/z, opacity:S.opacity });
  updateFracLabel(g);
  addAndSelect(g);
  status('🪣 سطل رنگ را بزنید و روی هر قسمت کلیک کنید تا رنگی شود؛ دوباره بزنید تا پاک شود');
}
function fracParts(g){ return g.getObjects().filter(o=> o.wbRole === 'part'); }
function fracStats(g){
  const parts = fracParts(g);
  const k = parts.filter(o=> typeof o.fill === 'string' && o.fill && colorAlpha(o.fill) > 0).length;
  return { k, n:parts.length };
}
function updateFracLabel(g){
  const lab = g.getObjects().find(o=> o.wbRole === 'fracLabel');
  if(!lab) return;
  const { k, n } = fracStats(g), dec = g.wbFrac && g.wbFrac.dec;
  if(lab.type === 'wbFracLabel') lab.set({ num:k, den:n });
  else lab.set('text', dec ? faNum(k/n, dec) : faNum(k, 0) + '/' + faNum(n, 0));
  g.dirty = true;
}
// پروژه‌های قبلی: برچسبِ «۳/۸» (که با اعشار اشتباه گرفته می‌شد) به کسرِ واقعی تبدیل می‌شود
function upgradeFracLabel(g){
  const objs = g._objects || [], i = objs.findIndex(o=> o.wbRole === 'fracLabel');
  if(i < 0 || objs[i].type === 'wbFracLabel') return;
  const old = objs[i], f = g.wbFrac || {};
  const lab = new fabric.WbFracLabel({
    den:f.n || 1, maxN:f.n || 1, dec:f.dec || 0, fill:old.fill, visible:old.visible, wbRole:'fracLabel', left:old.left, top:0
  });
  lab.set('top', old.top - 38 + 14 + lab.height/2);   // برچسبِ قبلی ۳۸ واحد زیرِ شکل بود
  lab.group = g;
  lab.canvas = g.canvas;
  objs[i] = lab;
  // اگر کسر از کادرِ گروه بیرون می‌زند، کادر بزرگ‌تر شود (جای بقیه‌ی اجزا تغییر نمی‌کند)
  g.height = Math.max(g.height, 2*(Math.abs(lab.top) + lab.height/2 + 2));
  g.width = Math.max(g.width, 2*(Math.abs(lab.left) + lab.width/2 + 2));
  updateFracLabel(g);
  g.setCoords();
}
// شماره‌ی قسمتی از شکل کسری که نقطه‌ی (جهانی) w داخل آن است؛ -1 یعنی بیرون
function fracPartAt(g, w){
  const f = g.wbFrac;
  const ol = g.getObjects().find(o=> o.wbRole === 'outline');
  if(!f || !ol) return -1;
  const L = fabric.util.transformPoint(new fabric.Point(w.x, w.y), fabric.util.invertTransform(g.calcTransformMatrix()));
  const oc = ol.getCenterPoint();
  const x = L.x - oc.x, y = L.y - oc.y;
  if(f.kind === 'circle'){
    if(Math.hypot(x, y) > f.r) return -1;
    if(f.n === 1) return 0;
    const t = normDeg(Math.atan2(y, x)*R2D + 90);
    return Math.min(f.n - 1, Math.floor(t/(360/f.n)));
  }
  if(Math.abs(y) > f.h/2) return -1;
  if(f.kind === 'bar'){
    if(Math.abs(x) > f.w/2) return -1;
    return clamp(Math.floor((x + f.w/2)/(f.w/f.n)), 0, f.n - 1);
  }
  if(f.kind === 'triangle'){
    const t = (y + f.h/2)/f.h;                     // ۰ در رأس، ۱ در قاعده
    if(Math.abs(x) > t*f.w/2) return -1;
    const xb = t > 1e-6 ? x/t : 0;
    return clamp(Math.floor((xb + f.w/2)/(f.w/f.n)), 0, f.n - 1);
  }
  if(Math.abs(x) > f.w/2) return -1;
  const cc = clamp(Math.floor((x + f.w/2)/(f.w/f.cols)), 0, f.cols - 1);
  const rr = clamp(Math.floor((y + f.h/2)/(f.h/f.rows)), 0, f.rows - 1);
  return rr*f.cols + cc;
}
function paintFracPart(g, idx){
  const part = fracParts(g).find(o=> o.wbIdx === idx);
  if(!part) return;
  flushHistory();
  const same = typeof part.fill === 'string' && part.fill && toHex(part.fill) === toHex(S.color);
  part.set('fill', same ? null : S.color);
  updateFracLabel(g);
  canvas.requestRenderAll();
  saveHistory();
  updateCtxBar();
}

/* ============================================================
   سطل رنگ
   ۱) روی قسمت‌های شکل کسری: رنگ برداری و دقیق
   ۲) هر ناحیه‌ی بسته‌ی دیگر (قلم، اشکال، پرگار، تصویر): پرکردن ناحیه
============================================================ */
function bucketAt(p){
  const w = toWorld(p);
  const objs = canvas.getObjects();
  for(let i=objs.length - 1; i>=0; i--){
    const o = objs[i];
    if(!o.visible) continue;
    if(o.type === 'wbNet'){
      const gi = o.faceAt(w);
      if(gi >= 0){ paintNetFace(o, gi); return; }
      continue;
    }
    if(!o.wbFrac) continue;
    const idx = fracPartAt(o, w);
    if(idx >= 0){ paintFracPart(o, idx); return; }
  }
  flushHistory();
  const old = fillAt(w);
  if(old){
    const same = old.wbFillColor && toHex(old.wbFillColor) === toHex(S.color);
    canvas.remove(old);
    if(same){ canvas.requestRenderAll(); saveHistory(); toast('رنگ این ناحیه برداشته شد'); return; }
  }
  const res = floodRegion(p);
  if(!res.ok){
    if(old) canvas.add(old);
    canvas.requestRenderAll();
    toast(res.msg, 2600);
    return;
  }
  const img = new fabric.Image(res.canvas, {
    left:res.left, top:res.top, scaleX:res.scale, scaleY:res.scale, originX:'left', originY:'top',
    opacity:S.opacity, wbRole:'fill', wbFillColor:S.color, perPixelTargetFind:true
  });
  // زیر خطوط قرار می‌گیرد (مثل رنگ‌آمیزی داخل خطوط)، ولی روی تصویرهایی که زیرش هستند
  const bb = { l:res.left, t:res.top, r:res.left + res.canvas.width*res.scale, b:res.top + res.canvas.height*res.scale };
  let idx = 0;
  canvas.getObjects().forEach((o, i)=>{
    if(o.type !== 'image' || o.wbRole === 'fill') return;
    const r = o.getBoundingRect(true, true);
    if(r.left < bb.r && r.left + r.width > bb.l && r.top < bb.b && r.top + r.height > bb.t) idx = i + 1;
  });
  canvas.insertAt(img, idx);
  canvas.requestRenderAll();
  saveHistory();
}
// رنگِ قبلیِ زیر نقطه (برای تعویض یا برداشتن رنگ)
let pixProbe = null;
function fillAt(w){
  const objs = canvas.getObjects();
  for(let i=objs.length - 1; i>=0; i--){
    const o = objs[i];
    if(o.wbRole !== 'fill' || !o.visible) continue;
    const L = fabric.util.transformPoint(new fabric.Point(w.x, w.y), fabric.util.invertTransform(o.calcTransformMatrix()));
    const px = Math.floor(L.x + o.width/2), py = Math.floor(L.y + o.height/2);
    if(px < 0 || py < 0 || px >= o.width || py >= o.height) continue;
    if(!pixProbe){ pixProbe = document.createElement('canvas'); pixProbe.width = pixProbe.height = 1; }
    const g = pixProbe.getContext('2d');
    g.clearRect(0, 0, 1, 1);
    g.drawImage(o.getElement(), px, py, 1, 1, 0, 0, 1, 1);
    if(g.getImageData(0, 0, 1, 1).data[3] > 20) return o;
  }
  return null;
}
function dilateMask(m, w, h, r){
  if(r <= 0) return;
  const tmp = new Uint8Array(w*h);
  for(let y=0; y<h; y++){
    const row = y*w;
    let last = -1e9;
    for(let x=0; x<w; x++){ if(m[row + x]) last = x; if(x - last <= r) tmp[row + x] = 1; }
    last = 1e9;
    for(let x=w-1; x>=0; x--){ if(m[row + x]) last = x; if(last - x <= r) tmp[row + x] = 1; }
  }
  for(let x=0; x<w; x++){
    let last = -1e9;
    for(let y=0; y<h; y++){ const i = y*w + x; if(tmp[i]) last = y; m[i] = (y - last <= r) ? 1 : 0; }
    last = 1e9;
    for(let y=h-1; y>=0; y--){ const i = y*w + x; if(tmp[i]) last = y; if(last - y <= r) m[i] = 1; }
  }
}
// راستری از کل محتوای بوم (نه فقط نمای فعلی) تا سطل رنگ در هر بزرگ‌نمایی/جابجایی
// هم درست کار کند و به لبه‌ی نمای فعلی گیر نکند
function fillRasterInfo(clickWorld){
  let bb = contentBounds();
  if(!bb) bb = { x:clickWorld.x - 300, y:clickWorld.y - 300, w:600, h:600 };
  const MARGIN = 80;                 // حاشیه‌ی جهانی حول محتوا
  const totalW = bb.w + 2*MARGIN, totalH = bb.h + 2*MARGIN;
  let scale = clamp(2600/Math.max(totalW, totalH, 1), 0.55, 3);
  let cw = Math.max(1, Math.round(totalW*scale)), ch = Math.max(1, Math.round(totalH*scale));
  if(cw*ch > 4e7){ const f = Math.sqrt(4e7/(cw*ch)); scale *= f; cw = Math.round(cw*f); ch = Math.round(ch*f); }
  return { ox:bb.x - MARGIN, oy:bb.y - MARGIN, scale, cw, ch };
}
function floodRegion(p){
  const clickWorld = toWorld(p);
  const info = fillRasterInfo(clickWorld);
  const { ox, oy, scale, cw, ch } = info, N = cw*ch;
  const sx = Math.floor((clickWorld.x - ox)*scale), sy = Math.floor((clickWorld.y - oy)*scale);
  if(sx < 0 || sy < 0 || sx >= cw || sy >= ch) return { ok:false, msg:'' };
  const all = canvas.getObjects();
  const lineObjs = all.filter(o=> o.visible && o.wbRole !== 'fill' && o.type !== 'image');
  const imgObjs = all.filter(o=> o.visible && o.wbRole !== 'fill' && o.type === 'image');
  const savedVT = canvas.viewportTransform;
  canvas.viewportTransform = [scale, 0, 0, scale, -ox*scale, -oy*scale];
  let elA, elB;
  try{
    const render = list=>{
      const hide = all.filter(o=> o.visible && !list.includes(o));
      hide.forEach(o=>{ o.visible = false; });
      try{ return canvas.toCanvasElement(1, { left:0, top:0, width:cw, height:ch }); }
      finally{ hide.forEach(o=>{ o.visible = true; }); }
    };
    elA = render(lineObjs);
    if(imgObjs.length) elB = render(imgObjs);
  } finally { canvas.viewportTransform = savedVT; }

  const wall = new Uint8Array(N);
  const dA = elA.getContext('2d').getImageData(0, 0, cw, ch).data;
  // آستانه‌ی نسبتاً پایین: خطوط روی تخته‌ی گچی بافت دانه‌دانه (نیمه‌شفاف) دارند
  for(let i=0; i<N; i++) if(dA[i*4 + 3] > 80) wall[i] = 1;
  if(elB){
    // روی تصویرها، خطوط تیره مرز حساب می‌شوند
    const dB = elB.getContext('2d').getImageData(0, 0, cw, ch).data;
    for(let i=0; i<N; i++){
      const j = i*4;
      if(dB[j + 3] > 50 && (0.3*dB[j] + 0.59*dB[j + 1] + 0.11*dB[j + 2]) < 150) wall[i] = 1;
    }
  }
  // بستن فاصله‌های کوچک بین خطوط (شکافِ محل شروع/پایانِ رسمِ دستی، یا حفره‌های بافت گچ)
  const R = Math.max(2, Math.round(7*scale));
  dilateMask(wall, cw, ch, R);
  if(wall[sy*cw + sx]) return { ok:false, msg:'داخلِ یک ناحیه‌ی خالی بزنید، نه روی خط' };

  const reg = new Uint8Array(N), stack = [sx, sy];
  let edge = false, minX = sx, maxX = sx, minY = sy, maxY = sy;
  while(stack.length && !edge){
    const y = stack.pop(), x0 = stack.pop();
    let x = x0, i = y*cw + x;
    if(reg[i] || wall[i]) continue;
    while(x > 0 && !wall[i - 1] && !reg[i - 1]){ x--; i--; }
    let up = false, dn = false;
    for(; x < cw && !wall[i] && !reg[i]; x++, i++){
      reg[i] = 1;
      if(x === 0 || x === cw - 1 || y === 0 || y === ch - 1){ edge = true; break; }
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
      const u = i - cw, d = i + cw;
      if(!wall[u] && !reg[u]){ if(!up){ stack.push(x, y - 1); up = true; } } else up = false;
      if(!wall[d] && !reg[d]){ if(!dn){ stack.push(x, y + 1); dn = true; } } else dn = false;
    }
  }
  if(edge) return { ok:false, msg:'این ناحیه بسته نیست — جای خطی که باز مانده را کامل کنید' };

  // رنگ کمی زیر خطوط می‌رود تا بین رنگ و خط فاصله‌ی سفید نماند
  const pad = R + 1;
  const bx0 = Math.max(0, minX - pad), by0 = Math.max(0, minY - pad);
  const bw = Math.min(cw - 1, maxX + pad) - bx0 + 1, bh = Math.min(ch - 1, maxY + pad) - by0 + 1;
  const sub = new Uint8Array(bw*bh);
  for(let y=0; y<bh; y++){
    const src = (y + by0)*cw + bx0, dst = y*bw;
    for(let x=0; x<bw; x++) sub[dst + x] = reg[src + x];
  }
  dilateMask(sub, bw, bh, pad);
  const out = document.createElement('canvas');
  out.width = bw; out.height = bh;
  const og = out.getContext('2d'), img = og.createImageData(bw, bh), d = img.data;
  const src = new fabric.Color(S.color).getSource();
  if(S.chalk && !chalkMask) chalkMask = buildChalkMask();
  for(let y=0; y<bh; y++) for(let x=0; x<bw; x++){
    const i = y*bw + x;
    if(!sub[i]) continue;
    const j = i*4;
    d[j] = src[0]; d[j + 1] = src[1]; d[j + 2] = src[2];
    if(S.chalk){
      const wx = Math.floor(ox + (x + bx0)/scale), wy = Math.floor(oy + (y + by0)/scale);
      const m = chalkMask[((wy % CHALK_N + CHALK_N) % CHALK_N)*CHALK_N + ((wx % CHALK_N + CHALK_N) % CHALK_N)];
      d[j + 3] = Math.round(255*(0.22 + 0.6*m));
    } else d[j + 3] = 255;
  }
  og.putImageData(img, 0, 0);
  return { ok:true, canvas:out, left:ox + bx0/scale, top:oy + by0/scale, scale:1/scale };
}

/* ============================================================
   تصویر در آینه (قرینه نسبت به خط عمودی) و تصویر در آب (نسبت به خط افقی)
============================================================ */
function reflectObject(c, o, mirror){
  if(c.type === 'wbAngle'){
    const a1 = o.a1, a2 = o.a2;
    c.set(mirror ? { a1:normDeg(180 - a2), a2:normDeg(180 - a1) } : { a1:normDeg(-a2), a2:normDeg(-a1) });
    c.set({ len1:o.len2, len2:o.len1 });
  } else if(c.type === 'wbArc'){
    if(!o.isFull()) c.set('startAngle', normDeg(mirror ? 180 - o.endAngle() : -o.endAngle()));
  } else {
    c.set(mirror ? { flipX:!o.flipX } : { flipY:!o.flipY });
    c.set('angle', normDeg(-(o.angle || 0)));
  }
}
// کادر واقعیِ شکل (کادر انتخابِ زاویه و کمان بزرگ‌تر از خودِ شکل است)
function tightBounds(o){
  let pts = null;
  if(o.type === 'wbAngle'){
    const c = o.getCenterPoint(), sp = o.span(), fs = o.labelSize();
    const q1 = polar(o.a1, o.len1), q2 = polar(o.a2, o.len2), ql = polar(sp.start + sp.sweep/2, o.markerR() + fs*1.6);
    pts = [c, { x:c.x + q1.x, y:c.y + q1.y }, { x:c.x + q2.x, y:c.y + q2.y }, { x:c.x + ql.x, y:c.y + ql.y }];
  } else if(o.type === 'wbArc' && !o.isFull()){
    const c = o.getCenterPoint();
    pts = [c];
    for(let i=0; i<=24; i++){ const q = polar(o.startAngle + o.sweep*i/24, o.radius); pts.push({ x:c.x + q.x, y:c.y + q.y }); }
  }
  if(!pts){ const r = o.getBoundingRect(true, true); return { l:r.left, t:r.top, r:r.left + r.width, b:r.top + r.height }; }
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y), pad = (o.strokeWidth || 2)/2;
  return { l:Math.min(...xs) - pad, t:Math.min(...ys) - pad, r:Math.max(...xs) + pad, b:Math.max(...ys) + pad };
}
function reflectSelection(kind){
  const sel = canvas.getActiveObject();
  if(!sel || sel.isEditing) return;
  const list = selectedList();
  flushHistory();
  canvas.discardActiveObject();
  const tb = list.map(tightBounds).reduce((a, b)=>({ l:Math.min(a.l, b.l), t:Math.min(a.t, b.t), r:Math.max(a.r, b.r), b:Math.max(a.b, b.b) }));
  const bb = { left:tb.l, top:tb.t, width:tb.r - tb.l, height:tb.b - tb.t };
  const mirror = kind === 'mirror', z = canvas.getZoom(), gap = 30/z, over = 24/z;
  const ax = bb.left + bb.width + gap/2, ay = bb.top + bb.height + gap/2;
  const axisCol = mirror ? (S.dark ? 'rgba(255,255,255,.8)' : '#64748b') : (S.dark ? '#7dd3fc' : '#0284c7');
  const axis = new fabric.Line(
    mirror ? [ax, bb.top - over, ax, bb.top + bb.height + over] : [bb.left - over, ay, bb.left + bb.width + over, ay],
    { stroke:axisCol, strokeWidth:Math.max(2, 3/z), strokeDashArray:mirror ? [12/z, 8/z] : [16/z, 6/z, 4/z, 6/z], strokeLineCap:'round', wbRole:'axis' });
  Promise.all(list.map(o=> new Promise(res=> o.clone(res, INCLUDE_PROPS)))).then(copies=>{
    canvas.add(axis);
    copies.forEach((c, i)=>{
      const o = list[i], ctr = o.getCenterPoint();
      reflectObject(c, o, mirror);
      c.setPositionByOrigin(new fabric.Point(mirror ? 2*ax - ctr.x : ctr.x, mirror ? ctr.y : 2*ay - ctr.y), 'center', 'center');
      c.setCoords();
      canvas.add(c);
    });
    if(copies.length === 1) canvas.setActiveObject(copies[0]);
    else canvas.setActiveObject(new fabric.ActiveSelection(copies, { canvas }));
    canvas.requestRenderAll();
    saveHistory();
    toast(mirror ? '🪞 تصویر در آینه ساخته شد' : '🌊 تصویر در آب ساخته شد');
  });
}

/* ============================================================
   OBJECT OPS
============================================================ */
function selectedList(){
  const o = canvas.getActiveObject();
  if(!o) return [];
  return o.type === 'activeSelection' ? o.getObjects().slice() : [o];
}
function deleteSelected(){
  const o = canvas.getActiveObject();
  if(!o || o.isEditing) return;
  const list = selectedList();
  flushHistory();
  canvas.discardActiveObject();
  list.forEach(x=> canvas.remove(x));
  canvas.requestRenderAll();
  saveHistory();
}
function duplicateSelected(){
  const o = canvas.getActiveObject();
  if(!o || o.isEditing) return;
  flushHistory();
  o.clone(cl=>{
    canvas.discardActiveObject();
    cl.set({ left:(cl.left || 0) + 24, top:(cl.top || 0) + 24, evented:true });
    if(cl.type === 'activeSelection'){
      cl.canvas = canvas;
      cl.forEachObject(x=> canvas.add(x));
      cl.setCoords();
    } else {
      canvas.add(cl);
    }
    canvas.setActiveObject(cl);
    canvas.requestRenderAll();
    saveHistory();
  }, INCLUDE_PROPS);
}
function toggleLock(){
  const list = selectedList();
  if(!list.length) return;
  flushHistory();
  const locked = !!list[0].lockMovementX;
  list.forEach(o=> o.set({
    lockMovementX:!locked, lockMovementY:!locked,
    lockScalingX:!locked, lockScalingY:!locked,
    lockRotation:!locked, hasControls:locked
  }));
  const a = canvas.getActiveObject();
  if(a && a.type === 'activeSelection') a.set({ lockMovementX:!locked, lockMovementY:!locked, hasControls:locked });
  canvas.requestRenderAll();
  saveHistory();
  toast(locked ? '🔓 قفل باز شد' : '🔒 قفل شد (پاک‌کن هم به آن دست نمی‌زند)');
}

/* ============================================================
   HISTORY — ثبت لحظه‌ی خطوط با تأخیر، تا نوشتن هیچ‌وقت کُند نشود
============================================================ */
const hist = { dirty:false, timer:0 };
const saveHistoryDebounced = debounce(()=>saveHistory(), 400);
const autoSaveDebounced = debounce(()=>{
  if(window.requestIdleCallback) requestIdleCallback(()=>autoSave(), { timeout:4000 });
  else autoSave();
}, 2500);

function markHistoryDirty(){
  hist.dirty = true;
  clearTimeout(hist.timer);
  hist.timer = setTimeout(flushHistory, 1200);
  updateUndo();
}
function flushHistory(){
  if(!hist.dirty) return;
  hist.dirty = false;
  clearTimeout(hist.timer);
  saveHistory();
}
function bindHistoryGuards(){
  // هر تعامل دیگری (به جز شروع یک خط جدید) اول تاریخچه را کامل می‌کند
  document.addEventListener('pointerdown', e=>{
    const inkStartHere = DRAW_TOOLS.has(S.tool) && els.canvasWrap.contains(e.target) &&
      !S.spaceDown && e.button !== 1 && !(e.pointerType === 'touch' && S.penSeen);
    if(!inkStartHere) flushHistory();
  }, true);
  document.addEventListener('keydown', ()=> flushHistory(), true);
  document.addEventListener('drop', ()=> flushHistory(), true);
  window.addEventListener('pagehide', ()=>{ flushHistory(); if(canvas && !S.restoring) autoSave(true); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ flushHistory(); autoSave(true); } });
}

function serialize(){
  const json = canvas.toJSON(INCLUDE_PROPS);
  json.__bg = S.bg;
  return JSON.stringify(json);
}
function saveHistory(){
  if(S.restoring || !canvas) return;
  if(hist.dirty){ hist.dirty = false; clearTimeout(hist.timer); }
  let s;
  try{ s = serialize(); }catch(e){ console.warn('serialize failed', e); return; }
  if(S.hIndex >= 0 && s === S.history[S.hIndex]){ updateUndo(); return; }
  const mb = s.length / 1048576;
  const cap = mb > 8 ? 10 : mb > 3 ? 20 : 60;
  S.history = S.history.slice(0, S.hIndex + 1);
  S.history.push(s);
  while(S.history.length > cap) S.history.shift();
  S.hIndex = S.history.length - 1;
  updateUndo();
  autoSaveDebounced();
}
function resetHistory(){
  hist.dirty = false; clearTimeout(hist.timer);
  try{ S.history = [serialize()]; }catch(e){ S.history = []; }
  S.hIndex = S.history.length - 1;
  updateUndo();
}
function restoreHistory(i){
  if(S.restoring || i < 0 || i >= S.history.length) return;
  cancelInstAnim();
  if(G.mode) cancelGesture();
  S.restoring = true;
  const lt = setTimeout(()=> els.loading.classList.add('show'), 250);
  canvas.discardActiveObject();
  const data = JSON.parse(S.history[i]);
  const done = ()=>{
    clearTimeout(lt);
    els.loading.classList.remove('show');
    S.restoring = false;
    S.hIndex = i;
    setBackground(data.__bg || 'none', false);
    canvas.requestRenderAll();
    updateUndo(); updateCtxBar();
    autoSaveDebounced();
  };
  try{ canvas.loadFromJSON(data, done); }catch(e){ console.warn(e); done(); }
}
function undo(){ flushHistory(); if(S.hIndex > 0) restoreHistory(S.hIndex - 1); }
function redo(){ flushHistory(); if(S.hIndex < S.history.length - 1) restoreHistory(S.hIndex + 1); }
function updateUndo(){
  els.undoBtn.disabled = S.hIndex <= 0 && !hist.dirty;
  els.redoBtn.disabled = hist.dirty || S.hIndex >= S.history.length - 1;
}

/* ============================================================
   AUTOSAVE / PROJECT
============================================================ */
function autoSave(force){
  if(G.mode && !force){ autoSaveDebounced(); return; }   // وسط نوشتن، کار سنگین نکن
  const s = S.history[S.hIndex];
  if(!s) return;
  try{ localStorage.setItem(AUTOSAVE_KEY, s); }catch(e){ /* حجم زیاد */ }
}
// حذف گیره‌های نامرئیِ پرگارِ نسخه‌ی قبلی از پروژه‌های قدیمی
function migrateLegacy(){
  canvas.getObjects()
    .filter(o=> o.wbRole === 'pivot' || o.wbRole === 'pencilHit' || o.wbRole === 'handleHit')
    .forEach(o=> canvas.remove(o));
  canvas.getObjects().forEach(o=>{ if(o.type === 'path' && o.objectCaching === false) o.objectCaching = true; });
  canvas.getObjects().forEach(o=>{ if(o.wbFrac && o.type === 'group') upgradeFracLabel(o); });
}
function tryAutoLoad(){
  let raw = null;
  try{ raw = localStorage.getItem(AUTOSAVE_KEY) || localStorage.getItem(LEGACY_KEY); }catch(e){}
  if(!raw) return;
  let d;
  try{ d = JSON.parse(raw); }catch(e){ return; }
  const data = d.canvas || d;
  const bg = d.background || d.__bg || 'none';
  if(!data.objects || !data.objects.length){ setBackground(bg, false); resetHistory(); return; }
  S.restoring = true;
  try{
    canvas.loadFromJSON(data, ()=>{
      S.restoring = false;
      migrateLegacy();
      setBackground(bg, false);
      canvas.requestRenderAll();
      resetHistory();
      toast('آخرین پروژه بازیابی شد');
    });
  }catch(e){ S.restoring = false; console.warn(e); }
}
function saveProject(){
  flushHistory();
  const data = { version:3, background:S.bg, canvas:canvas.toJSON(INCLUDE_PROPS) };
  downloadBlob(new Blob([JSON.stringify(data)], { type:'application/json' }), 'whiteboard-project.json');
  toast('💾 پروژه ذخیره شد');
}
function loadProject(e){
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  if(!confirm('محتوای فعلی با فایل باز‌شده جایگزین شود؟')) return;
  els.loading.classList.add('show');
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      flushHistory();
      cancelInstAnim();
      S.restoring = true;
      canvas.discardActiveObject();
      canvas.loadFromJSON(d.canvas || d, ()=>{
        S.restoring = false;
        migrateLegacy();
        setBackground(d.background || d.__bg || 'none', false);
        canvas.requestRenderAll();
        saveHistory();
        updateCtxBar();
        els.loading.classList.remove('show');
        toast('📂 پروژه باز شد');
      });
    }catch(err){
      S.restoring = false;
      els.loading.classList.remove('show');
      alert('فایل پروژه معتبر نیست');
    }
  };
  r.readAsText(f);
}

/* ---- خروجی PNG از کل محتوا، همراه پس‌زمینه ---- */
let exportNoise = null;
function paintExportBg(g, b, mult){
  const def = BG[S.bg] || BG.none;
  g.fillStyle = def.color;
  g.fillRect(0, 0, g.canvas.width, g.canvas.height);
  if(def.dark){
    if(!exportNoise){
      exportNoise = document.createElement('canvas');
      exportNoise.width = exportNoise.height = 160;
      const nx = exportNoise.getContext('2d'), img = nx.createImageData(160, 160);
      for(let i=0; i<img.data.length; i+=4){
        img.data[i] = img.data[i+1] = img.data[i+2] = 255;
        img.data[i+3] = Math.random() < .5 ? Math.round(Math.random()*20) : 0;
      }
      nx.putImageData(img, 0, 0);
    }
    g.fillStyle = g.createPattern(exportNoise, 'repeat');
    g.fillRect(0, 0, g.canvas.width, g.canvas.height);
  }
  const e = def.exp;
  if(e){
    g.save();
    g.scale(mult, mult);
    g.translate(-b.x, -b.y);
    g.fillStyle = e.c; g.strokeStyle = e.c; g.lineWidth = 1/mult;
    const x0 = Math.floor(b.x/e.s)*e.s, y0 = Math.floor(b.y/e.s)*e.s;
    if(e.kind === 'dots'){
      for(let x=x0; x<=b.x + b.w + e.s; x+=e.s) for(let y=y0; y<=b.y + b.h + e.s; y+=e.s){
        g.beginPath(); g.arc(x + e.s/2, y + e.s/2, e.r, 0, TAU); g.fill();
      }
    } else {
      g.beginPath();
      for(let y=y0; y<=b.y + b.h; y+=e.s){ g.moveTo(b.x, y); g.lineTo(b.x + b.w, y); }
      if(e.kind === 'grid') for(let x=x0; x<=b.x + b.w; x+=e.s){ g.moveTo(x, b.y); g.lineTo(x, b.y + b.h); }
      g.stroke();
    }
    g.restore();
  }
}
function exportPNG(){
  const active = canvas.getActiveObject();
  canvas.discardActiveObject();
  let b = contentBounds();
  if(b){ const pad = 40; b = { x:b.x - pad, y:b.y - pad, w:b.w + pad*2, h:b.h + pad*2 }; }
  else { const tl = toWorld({ x:0, y:0 }), br = toWorld({ x:canvas.getWidth(), y:canvas.getHeight() }); b = { x:tl.x, y:tl.y, w:br.x - tl.x, h:br.y - tl.y }; }
  const mult = clamp(Math.min(2, 8000/Math.max(b.w, b.h)), 0.1, 2);
  const v = canvas.viewportTransform, z = v[0];
  let el;
  try{
    el = canvas.toCanvasElement(mult/z, { left:b.x*z + v[4], top:b.y*z + v[5], width:b.w*z, height:b.h*z });
  }catch(e){ toast('ساخت تصویر ممکن نشد'); return; }
  const out = document.createElement('canvas');
  out.width = el.width; out.height = el.height;
  const g = out.getContext('2d');
  paintExportBg(g, b, mult);
  g.drawImage(el, 0, 0);
  downloadURL(out.toDataURL('image/png'), 'whiteboard.png');
  if(active) canvas.setActiveObject(active);
  canvas.requestRenderAll();
  toast('🖼 تصویر PNG ساخته شد');
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function downloadURL(url, name){
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
}

/* ============================================================
   IMAGE (آپلود + Paste + Drop)
============================================================ */
function addImageFile(file, pt){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = ev=>{
    fabric.Image.fromURL(ev.target.result, img=>{
      const z = canvas.getZoom();
      const maxW = canvas.getWidth()*0.6/z, maxH = canvas.getHeight()*0.6/z;
      const scale = Math.min(maxW/img.width, maxH/img.height, 1);
      const pos = pt || viewCenter();
      img.set({ left:pos.x, top:pos.y, originX:'center', originY:'center', scaleX:scale, scaleY:scale, opacity:S.opacity });
      addAndSelect(img);
      toast('🖼 تصویر اضافه شد');
    });
  };
  r.readAsDataURL(file);
}
function bindImageIO(){
  ['dragenter','dragover'].forEach(ev=> els.canvasWrap.addEventListener(ev, e=> e.preventDefault()));
  els.canvasWrap.addEventListener('drop', e=>{
    e.preventDefault();
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f=> f.type && f.type.startsWith('image/'));
    if(!files.length) return;
    wrapRect = els.canvasWrap.getBoundingClientRect();
    const pt = toWorld(localOf(e));
    files.forEach((f, i)=> setTimeout(()=>addImageFile(f, { x:pt.x + i*24, y:pt.y + i*24 }), i*60));
  });
  document.addEventListener('paste', e=>{
    const a = document.activeElement;
    const editing = a && (['input','textarea','select'].includes((a.tagName || '').toLowerCase()) || a.isContentEditable);
    if(editing) return;
    const items = e.clipboardData && e.clipboardData.items ? Array.from(e.clipboardData.items) : [];
    const imgs = items.filter(i=> i.type && i.type.startsWith('image/'));
    if(!imgs.length) return;
    e.preventDefault();
    imgs.forEach((it, i)=> setTimeout(()=>{
      const f = it.getAsFile();
      if(f) addImageFile(f, viewCenter());
    }, i*60));
  });
}

/* ============================================================
   WHEEL / FULLSCREEN
============================================================ */
function bindWheel(){
  const wrap = els.canvasWrap;
  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    if(G.mode === 'ink') return;
    const r = wrap.getBoundingClientRect();
    const pt = { x:e.clientX - r.left, y:e.clientY - r.top };
    let dx = e.deltaX, dy = e.deltaY;
    if(e.deltaMode === 1){ dx *= 16; dy *= 16; } else if(e.deltaMode === 2){ dx *= r.width; dy *= r.height; }
    if(e.ctrlKey || e.metaKey){ zoomAt(pt, canvas.getZoom()*Math.exp(-dy*0.01)); return; }
    if(e.shiftKey){ panBy(-(dx || dy), 0); return; }
    if(Math.abs(dx) > 0.5){ panBy(-dx, -dy); return; }
    zoomAt(pt, canvas.getZoom()*Math.pow(1.0015, -dy));
  }, { passive:false });
  // زوم با دو انگشت روی تاچ‌پد در Safari
  if(!navigator.maxTouchPoints){
    let gz = 1;
    wrap.addEventListener('gesturestart', e=>{ e.preventDefault(); gz = canvas.getZoom(); });
    wrap.addEventListener('gesturechange', e=>{
      e.preventDefault();
      const r = wrap.getBoundingClientRect();
      zoomAt({ x:e.clientX - r.left, y:e.clientY - r.top }, gz*e.scale);
    });
  } else {
    wrap.addEventListener('gesturestart', e=> e.preventDefault());
  }
}
function fullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* ============================================================
   SHORTCUTS (بر اساس کلید فیزیکی — با صفحه‌کلید فارسی هم کار می‌کند)
============================================================ */
const TOOL_KEYS = { KeyV:'select', KeyH:'pan', KeyP:'pen', KeyB:'highlighter', KeyE:'eraser', KeyL:'laser' };

function bindShortcuts(){
  document.addEventListener('keydown', e=>{
    const cmd = e.ctrlKey || e.metaKey;
    const a = document.activeElement;
    const tag = (a && a.tagName || '').toLowerCase();
    const editing = ['input','textarea','select'].includes(tag) || (a && a.isContentEditable);
    const code = e.code;

    if(cmd && code === 'KeyZ'){ if(editing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if(cmd && code === 'KeyY'){ if(editing) return; e.preventDefault(); redo(); return; }
    if(cmd && code === 'KeyS'){ e.preventDefault(); saveProject(); return; }
    if(cmd && code === 'KeyD'){ e.preventDefault(); duplicateSelected(); return; }
    if(cmd && (code === 'Digit0' || code === 'Numpad0')){ e.preventDefault(); resetZoom(); return; }
    if(cmd && (code === 'Equal' || code === 'NumpadAdd')){ e.preventDefault(); zoomBy(1.15); return; }
    if(cmd && (code === 'Minus' || code === 'NumpadSubtract')){ e.preventDefault(); zoomBy(1/1.15); return; }

    if(editing || cmd || e.altKey) return;

    if(code === 'Space'){
      e.preventDefault();
      if(!e.repeat){ S.spaceDown = true; applyCursor(); }
      return;
    }
    if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSelected(); return; }
    if(e.key === 'Escape'){
      closeAllMenus();
      $$('.panel').forEach(p=>p.classList.remove('open'));
      if(G.mode === 'shape' || G.mode === 'instrument'){ cancelGesture(); }
      else if(INST.anim) cancelInstAnim();
      else { canvas.discardActiveObject(); canvas.requestRenderAll(); }
      return;
    }
    if(e.key.startsWith('Arrow')){
      const o = canvas.getActiveObject();
      if(o){
        const step = e.shiftKey ? 10 : 1;
        const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
        const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
        if((dx && !o.lockMovementX) || (dy && !o.lockMovementY)){
          e.preventDefault();
          o.set({ left:(o.left || 0) + dx, top:(o.top || 0) + dy });
          o.setCoords();
          canvas.requestRenderAll();
          saveHistoryDebounced();
        }
      }
      return;
    }
    if(code === 'BracketLeft' || code === 'BracketRight'){
      e.preventDefault();
      setWidth(S.width + (code === 'BracketRight' ? 1 : -1));
      return;
    }
    const digit = /^Digit([1-8])$/.exec(code);
    if(digit){
      e.preventDefault();
      setColor(PALETTES[S.dark ? 'dark' : 'light'][+digit[1] - 1]);
      return;
    }
    if(code === 'KeyT'){ e.preventDefault(); createMath('text'); return; }
    if(code === 'KeyC'){ e.preventDefault(); toggleCompass(); return; }
    if(code === 'KeyR'){ e.preventDefault(); toggleProtractor(); return; }
    if(code === 'KeyA'){ e.preventDefault(); addAngle(); return; }
    if(code === 'KeyG'){ e.preventDefault(); runAction('board'); return; }
    if(code === 'KeyF'){ e.preventDefault(); setTool('bucket'); return; }
    if(code === 'KeyN'){ e.preventDefault(); createMath('net'); return; }
    if(TOOL_KEYS[code]){ e.preventDefault(); setTool(TOOL_KEYS[code]); }
  });
  document.addEventListener('keyup', e=>{
    if(e.code === 'Space' && S.spaceDown){ S.spaceDown = false; applyCursor(); }
  });
}

/* ============================================================
   BOOT
============================================================ */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
