   TOOLBAR
============================================================ */
function bindToolbar(){
  $('#toolbar').addEventListener('click', e=>{
    const btn = e.target.closest('.toolbtn');
    if(!btn || btn.dataset.menu) return;
    const cmd = btn.dataset.cmd;
    if(cmd === 'background') togglePanel(els.bgPanel);
    else if(cmd === 'props') togglePanel(els.props);
    else if(cmd === 'delete') deleteSelected();
    else if(cmd === 'duplicate') duplicateSelected();
    else if(cmd === 'lock') toggleLock();
    else if(cmd === 'image') els.imageInput.click();
    else if(cmd === 'compass') toggleCompass();
    else if(cmd === 'protractor') toggleProtractor();
    else if(cmd === 'angle') addAngle();
    else if(btn.dataset.tool) setTool(btn.dataset.tool);
  });
}

const TOOL_LABELS = {
  select:'انتخاب — روی شیء بزنید یا کادر بکشید',
  pan:'جابجایی — بکشید (یا Space + درگ، یا دو انگشت)',
  pen:'قلم — بنویسید', highlighter:'هایلایتر — بکشید',
  eraser:'پاک‌کن — روی نوشته بکشید', laser:'لیزر — بکشید',
  bucket:'سطل رنگ — داخل یک ناحیه‌ی بسته، یک قسمت از شکل کسری یا یک وجهِ گسترده بزنید (دوباره بزنید = پاک)',
  shape:'شکل — بکشید برای اندازه دلخواه، کلیک ساده = اندازه پیش‌فرض'
};

function setTool(t){
  if(S.drawingShape){ canvas.remove(S.drawingShape); S.drawingShape = null; }
  S.shapeStart = null;
  closeAllMenus();

  S.tool = t;
  $$('[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool === t));
  $$('.hasmenu[data-menu="shapeMenu"]').forEach(b=>b.classList.toggle('active', t === 'shape'));
  $$('.menuitem[data-shape]').forEach(b=>b.classList.toggle('active', t === 'shape' && b.dataset.shape === S.pendingShape));

  canvas.isDrawingMode = false;
  canvas.selection = (t === 'select');
  if(t !== 'select' && canvas.getActiveObject()){
    canvas.discardActiveObject();
    canvas.requestRenderAll();
  }
  status(t === 'pen' && S.chalk ? 'گچ — روی تخته بنویسید' : (TOOL_LABELS[t] || 'آماده'));
  applyCursor();
  updateCtxBar();
}

/* ============================================================
   MENUS
============================================================ */
function bindMenus(){
  document.addEventListener('click', e=>{
    const item = e.target.closest('.menu .menuitem');
    if(item){
      e.preventDefault();
      e.stopPropagation();
      closeAllMenus();
      if(item.dataset.pick) setColor(item.dataset.pick);
      else if(item.dataset.tool) setTool(item.dataset.tool);
      else if(item.dataset.shape){ S.pendingShape = item.dataset.shape; setTool('shape'); }
      else if(item.dataset.math) createMath(item.dataset.math);
      else if(item.dataset.logo) logoAction(item.dataset.logo);
      else if(item.dataset.act) runAction(item.dataset.act);
      return;
    }
    const slot = e.target.closest('.cslot');
    if(slot){
      e.preventDefault();
      e.stopPropagation();
      onSlotTap(slot);
      return;
    }
    const btn = e.target.closest('.hasmenu');
    if(btn){
      e.preventDefault();
      e.stopPropagation();
      const menu = btn._menu;
      if(!menu) return;
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();
      if(!wasOpen) openMenuAt(menu, btn);
      return;
    }
    if(!e.target.closest('.menu')) closeAllMenus();
  }, true);
  window.addEventListener('resize', closeAllMenus);
}

function openMenuAt(menu, btn){
  menu.style.visibility = 'hidden';
  menu.style.left = '-9999px';
  menu.style.top = '0px';
  menu.classList.add('open');
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  const r = btn.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left, top;
  if(btn.closest('#topbar')){
    left = r.left; top = r.bottom + 6;
  } else {
    // نوار ابزار در همه‌ی اندازه‌ها سمت چپ است؛ منو کنارش باز می‌شود
    // و در موبایل بالاتر از منوی پایینِ سایت می‌ماند
    const sb = Math.max(8, parseFloat(getComputedStyle(document.body).getPropertyValue('--safe-b')) || 0);
    left = r.right + 8;
    top = r.top;
    if(left + mw > vw - 8) left = r.left - mw - 8;
    if(top + mh > vh - sb) top = vh - sb - mh;
  }
  menu.style.left = clamp(left, 8, Math.max(8, vw - mw - 8)) + 'px';
  menu.style.top = clamp(top, 8, Math.max(8, vh - mh - 8)) + 'px';
  menu.style.visibility = '';
}
function closeAllMenus(){ $$('.menu.open').forEach(m=>m.classList.remove('open')); }

/* ============================================================
   PANELS & BACKGROUND
============================================================ */
function bindPanels(){
  $$('.bgchoice').forEach(b=> b.addEventListener('click', ()=> setBackground(b.dataset.bg, true)));
  document.addEventListener('click', e=>{
    if(e.target.closest('.panel')) return;
    if(e.target.closest('#dialogOverlay')) return;
    if(e.target.closest('[data-cmd="background"]') || e.target.closest('[data-cmd="props"]')) return;
    $$('.panel.open').forEach(p=>p.classList.remove('open'));
  });
}
function togglePanel(panel){
  const isOpen = panel.classList.contains('open');
  $$('.panel').forEach(p=>p.classList.remove('open'));
  if(!isOpen) panel.classList.add('open');
}

function setBackground(name, record){
  if(!BG[name]) name = 'none';
  const def = BG[name];
  const wasDark = S.dark;
  S.bg = name;
  S.dark = S.chalk = !!def.dark;
  if(S.dark) S.lastChalkBg = name; else S.lastLightBg = name;

  const st = els.canvasWrap.style;
  st.backgroundColor = def.color;
  st.backgroundImage = def.layers.length ? def.layers.map(l=>l.img).join(',') : 'none';
  st.backgroundRepeat = def.layers.length ? def.layers.map(l=>(l.follow || l.tile) ? 'repeat' : 'no-repeat').join(',') : 'repeat';
  syncBg();
  $$('.bgchoice').forEach(x=>x.classList.toggle('active', x.dataset.bg === name));
  document.body.classList.toggle('board-dark', S.dark);
  els.boardBtn.textContent = S.dark ? '⬜' : '🟩';
  els.boardBtn.title = S.dark ? 'تخته سفید' : 'تخته سبز (گچی)';

  if(wasDark !== S.dark){
    // رنگ قلم = همان خانه (اول/دوم) از دو رنگِ اصلیِ این تخته (مشکی ⇄ گچ سفید، آبی ⇄ گچ زرد، …)
    S.color = slotsNow()[S.slotIdx];
    els.color.value = toHex(S.color);
    buildSwatches();
    if(canvas){ markAllDirty(); canvas.requestRenderAll(); }
    if(DRAW_TOOLS.has(S.tool)) status(S.tool === 'pen' && S.chalk ? 'گچ — روی تخته بنویسید' : TOOL_LABELS[S.tool]);
  }
  applyCursor();
  ovRender();
  if(record) saveHistory();
}

function syncBg(){
  const def = BG[S.bg];
  if(!def || !canvas) return;
  const v = canvas.viewportTransform, z = v[0];
  const mod = (a, m) => ((a % m) + m) % m;
  const sizes = [], pos = [];
  for(const l of def.layers){
    if(l.follow){
      const w = l.w ? l.w*z : 0, h = l.h*z;
      sizes.push((w ? w.toFixed(3) + 'px' : '100%') + ' ' + h.toFixed(3) + 'px');
      pos.push((w ? mod(v[4], w).toFixed(2) : '0') + 'px ' + mod(v[5], h).toFixed(2) + 'px');
    } else if(l.tile){
      sizes.push(l.w + 'px ' + l.h + 'px'); pos.push('0 0');
    } else {
      sizes.push('100% 100%'); pos.push('0 0');
    }
  }
  const st = els.canvasWrap.style;
  st.backgroundSize = sizes.join(',');
  st.backgroundPosition = pos.join(',');
}

/* ============================================================
   PROPS
============================================================ */
function bindProps(){
  els.color.addEventListener('input', e=> setColor(e.target.value));
  els.width.addEventListener('input', e=> setWidth(+e.target.value));
  els.opacity.addEventListener('input', e=>{
    S.opacity = +e.target.value / 100;
    els.opacityVal.textContent = e.target.value + '%';
    styleSelection({ opacity:S.opacity });
  });
  els.font.addEventListener('change', e=>{ S.font = e.target.value; styleSelection({ font:S.font }); });
  els.fontSize.addEventListener('input', e=>{
    S.fontSize = +e.target.value;
    els.fontSizeVal.textContent = e.target.value;
    styleSelection({ fontSize:S.fontSize });
  });

  els.props.addEventListener('click', e=>{
    const btn = e.target.closest('[data-prop]');
    if(!btn) return;
    const o = canvas.getActiveObject();
    if(!o) return;
    const act = btn.dataset.prop;
    const list = o.type === 'activeSelection' ? o.getObjects() : [o];
    if(act === 'front') list.forEach(x=>canvas.bringToFront(x));
    else if(act === 'back') list.slice().reverse().forEach(x=>canvas.sendToBack(x));
    else if(act === 'rotate'){
      if(o.type === 'wbAngle') o.set({ a1:normDeg(o.a1 + 15), a2:normDeg(o.a2 + 15) });
      else if(o.type === 'wbArc') o.set('startAngle', normDeg(o.startAngle + 15));
      else if(o.type === 'wbNet'){ netFreezeCam(o); o.setNetState({ yaw:o.yaw - 15 }); }
      else o.rotate((o.angle || 0) + 15);
      o.setCoords();
    }
    else if(act === 'flip'){
      if(o.type === 'wbAngle') mirrorAngle(o);
      else if(o.type === 'wbArc'){ if(!o.isFull()) o.set('startAngle', normDeg(180 - o.endAngle())); }
      else o.set('flipX', !o.flipX);
      o.setCoords();
    }
    canvas.requestRenderAll();
    updateCtxBar();
    saveHistory();
  });
}
function mirrorAngle(o){ const a1 = o.a1, l1 = o.len1; o.set({ a1:normDeg(180 - o.a2), a2:normDeg(180 - a1), len1:o.len2, len2:l1 }); }

function setFontSelect(v){
  if(Array.from(els.font.options).some(o=>o.value === v)) els.font.value = v;
}
// نمایش ویژگی‌های شیء انتخاب‌شده در پنل تنظیمات
function syncProps(){
  const o = canvas.getActiveObject();
  if(!o) return;
  let src = o;
  if(o.type === 'group' || o.type === 'activeSelection'){
    const objs = o.getObjects();
    if(objs.length) src = objs[0];
  }
  const col = (isTextObj(src) || (src.fill && typeof src.fill === 'string' && !src.stroke)) ? src.fill : src.stroke;
  if(typeof col === 'string') els.color.value = toHex(col);
  if(src.strokeWidth){
    const wv = clamp(Math.round(src.strokeWidth), 1, 40);
    els.width.value = wv; els.widthVal.textContent = wv;
  }
  if(o.opacity != null){
    const ov2 = clamp(Math.round(o.opacity*100), 10, 100);
    els.opacity.value = ov2; els.opacityVal.textContent = ov2 + '%';
  }
  if(src.fontSize){
    const fv = clamp(Math.round(src.fontSize), 12, 80);
    els.fontSize.value = fv; els.fontSizeVal.textContent = fv;
  }
  if(src.fontFamily) setFontSelect(src.fontFamily);
}

function styleObject(o, opts, nested){
  if(opts.opacity != null && !nested) o.set('opacity', opts.opacity);
  if(o.type === 'group'){
    o.getObjects().forEach(c=> styleObject(c, { color:opts.color, width:opts.width, font:opts.font }, true));
    o.dirty = true;
    return;
  }
  if(o.type === 'image') return;
  if(o.type === 'wbFracLabel'){
    if(opts.color) o.set('fill', opts.color);
    if(opts.font) o.set('fontFamily', opts.font);
    return;
  }
  if(isTextObj(o)){
    if(opts.color) o.set('fill', opts.color);
    if(opts.font) o.set('fontFamily', opts.font);
    if(opts.fontSize && !nested) o.set('fontSize', opts.fontSize);
    return;
  }
  if(opts.color){
    const upd = { stroke: o.wbRole === 'hi' ? hexToRgba(opts.color, .35) : opts.color };
    // سرِ پیکان و مانند آن: پرشدگی هم‌رنگِ خط
    if(typeof o.fill === 'string' && o.fill && typeof o.stroke === 'string' &&
       toHex(o.fill) === toHex(o.stroke) && colorAlpha(o.fill) > .85) upd.fill = opts.color;
    if(!o.stroke && typeof o.fill === 'string' && colorAlpha(o.fill) > .85) upd.fill = opts.color;
    o.set(upd);
  }
  if(opts.width != null && o.strokeWidth){
    o.set('strokeWidth', o.wbRole === 'hi' ? Math.max(10, opts.width*3) : opts.width);
  }
  if(opts.font && o.type === 'wbAngle') o.set('fontFamily', opts.font);
}
// اعمال سبک روی انتخاب فعلی (فقط در ابزار انتخاب) — true یعنی انتخابی بود
function styleSelection(opts){
  if(S.tool !== 'select') return false;
  const sel = canvas.getActiveObject();
  if(!sel) return false;
  flushHistory();
  const list = sel.type === 'activeSelection' ? sel.getObjects() : [sel];
  list.forEach(o=> styleObject(o, opts, false));
  if(sel.type === 'activeSelection') sel.dirty = true;
  sel.setCoords();
  canvas.requestRenderAll();
  saveHistoryDebounced();
  return true;
}

/* ============================================================
   رویدادهای fabric
============================================================ */
function bindCanvas(){
  canvas.on('text:editing:exited', e=>{
    if(S.restoring) return;
    const t = e && e.target;
    if(t && typeof t.text === 'string' && !t.text.trim()) canvas.remove(t);
    saveHistory();
  });
  canvas.on('object:modified', ()=>{ clearGuides(); S.snapMark = null; saveHistory(); updateCtxBar(); });
  canvas.on('object:moving', e=> onObjectMoving(e.target));
  canvas.on('mouse:up', ()=>{ if(S.snapMark || ov.guides.length){ S.snapMark = null; clearGuides(); } });
  canvas.on('selection:created', onSelChange);
  canvas.on('selection:updated', onSelChange);
  canvas.on('selection:cleared', onSelChange);
  canvas.on('after:render', onAfterRender);
  // دوبار زدن روی گسترده = باز/بسته شدن
  canvas.on('mouse:dblclick', e=>{
    const t = e && e.target;
    if(!t || S.tool !== 'select') return;
    const L = t.type === 'wbNet' ? [t] : t.type === 'activeSelection' ? netList() : [];
    if(L.length){ netToggle(L); updateCtxBar(); }
  });
}
function onSelChange(){ syncProps(); updateCtxBar(); ovRender(); }

let lastVKey = '', lastZ = 0;
function onAfterRender(e){
  if(e && e.ctx && e.ctx !== canvas.contextContainer) return;   // خروجی PNG
  const v = canvas.viewportTransform, key = v[0] + '|' + v[4] + '|' + v[5];
  let vChanged = false;
  if(key !== lastVKey){
    vChanged = true;
    const zChanged = v[0] !== lastZ;
    lastVKey = key; lastZ = v[0];
    syncBg();
    updateZoom();
    if(zChanged && (DRAW_TOOLS.has(S.tool))) applyCursor();
  }
  if(ink.pending.length){ ink.pending.length = 0; inkRender(); }
  else if(vChanged && ink.trail) inkRender();
  ovRender();
}

/* ============================================================
   مسیریاب اشاره‌گر — قلم/پاک‌کن/پرگار/جابجایی مستقیماً اینجا
   مدیریت می‌شوند؛ فقط ابزار «انتخاب» به fabric سپرده می‌شود.
============================================================ */
const G = { mode:null, id:null, ptype:null };
const touchPts = new Map();
const fabricIds = new Set();

function bindRouter(){
  const wrap = els.canvasWrap;
  wrap.addEventListener('pointerdown', onPDown, true);
  window.addEventListener('pointermove', onPMove, true);
  window.addEventListener('pointerup', onPUp, true);
  window.addEventListener('pointercancel', onPUp, true);
  wrap.addEventListener('pointerleave', ()=>{
    if(S.instHover){ S.instHover = null; ovKick(); }
  });
  wrap.addEventListener('contextmenu', e=> e.preventDefault());
  wrap.addEventListener('dblclick', e=>{ if(S.tool !== 'select') e.stopPropagation(); }, true);
  window.addEventListener('blur', ()=>{
    if(S.spaceDown){ S.spaceDown = false; applyCursor(); }
    if(G.mode && G.mode !== 'pinch' && G.mode !== 'wait') finishGesture();
    touchPts.clear();
    if(G.mode === 'pinch' || G.mode === 'wait'){ endPinch(); G.mode = null; }
  });
}
function block(e){ e.stopPropagation(); if(e.cancelable) e.preventDefault(); }
function beginGesture(e, mode){
  G.mode = mode; G.id = e.pointerId; G.ptype = e.pointerType;
  try{ els.canvasWrap.setPointerCapture(e.pointerId); }catch(_){}
}
function coalesced(e){
  if(e.getCoalescedEvents){
    const l = e.getCoalescedEvents();
    if(l && l.length) return l;
  }
  return [e];
}

function onPDown(e){
  wrapRect = els.canvasWrap.getBoundingClientRect();
  const p = localOf(e);
  if(e.pointerType === 'pen' && !S.penSeen){
    S.penSeen = true;
    toast('✒️ قلم نوری شناسایی شد — لمس انگشت فقط صفحه را جابه‌جا/بزرگ می‌کند', 3000);
  }
  if(e.pointerType === 'touch'){
    touchPts.set(e.pointerId, p);
    if(G.mode && G.ptype === 'pen'){ block(e); return; }     // کفِ دست هنگام نوشتن با قلم
    if(touchPts.size >= 2){
      if(G.mode && G.mode !== 'pinch' && G.mode !== 'wait') cancelGesture();
      startPinch();
      block(e);
      return;
    }
  }
  if(G.mode){ block(e); return; }

  // دکمه‌ی وسط یا Space → جابجایی
  if(e.button === 1 || S.spaceDown){ beginGesture(e, 'pan'); startPan(p); block(e); return; }
  if(e.button === 2){ if(S.tool !== 'select') block(e); return; }

  // ابزارهای سه‌بعدی (پرگار/نقاله) در هر حالتی اولویت دارند
  const hit = instrumentHit(p);
  if(hit){ beginGesture(e, 'instrument'); instStart(hit, p); block(e); return; }

  const t = S.tool;
  // سرِ پاک‌کنِ قلم نوری
  const penEraser = e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32));
  if(e.pointerType === 'touch' && S.penSeen && (DRAW_TOOLS.has(t) || t === 'eraser')){
    beginGesture(e, 'pan'); startPan(p); block(e); return;
  }
  if(penEraser || t === 'eraser'){ beginGesture(e, 'erase'); eraseStart(p); block(e); return; }
  if(DRAW_TOOLS.has(t)){
    if(S.restoring){ block(e); return; }
    beginGesture(e, 'ink'); inkStart(e, p); block(e); return;
  }
  if(t === 'laser'){ beginGesture(e, 'laser'); laserStart(p); block(e); return; }
  if(t === 'bucket'){ beginGesture(e, 'tap'); bucketAt(p); block(e); return; }
  if(t === 'pan'){ beginGesture(e, 'pan'); startPan(p); block(e); return; }
  if(t === 'shape'){ beginGesture(e, 'shape'); shapeStart(p); block(e); return; }
  // ابزار انتخاب: fabric
  fabricIds.add(e.pointerId);
}

function onPMove(e){
  if(e.pointerType === 'touch' && touchPts.has(e.pointerId)) touchPts.set(e.pointerId, localOf(e));
  if(!G.mode){
    if(fabricIds.size) return;                           // fabric در حال کشیدن است
    const over = els.canvasWrap.contains(e.target);
    if(!over){ if(S.instHover){ S.instHover = null; ovKick(); } return; }
    const p = localOf(e);
    const hit = (INST.compass.on || INST.prot.on) ? instrumentHit(p) : null;
    const prev = S.instHover;
    if(!hit !== !prev || (hit && prev && (hit.inst !== prev.inst || hit.part !== prev.part))){
      S.instHover = hit;
      if(hit) canvas.upperCanvasEl.style.cursor = hit.part === 'knob' ? 'alias' : 'grab';
      else if(S.tool === 'select') canvas.upperCanvasEl.style.cursor = 'default';
      else applyCursor();
      ovKick();
    }
    if(hit || S.tool !== 'select') e.stopPropagation();
    return;
  }
  if(G.mode === 'pinch'){ block(e); pinchMove(); return; }
  if(G.mode === 'wait'){ block(e); return; }
  if(e.pointerId !== G.id){ if(touchPts.has(e.pointerId)) block(e); return; }
  block(e);
  switch(G.mode){
    case 'ink': inkMove(e); break;
    case 'erase': eraseMove(e); break;
    case 'laser': laserMove(e); break;
    case 'pan': panMove(localOf(e)); break;
    case 'shape': shapeMove(localOf(e)); break;
    case 'instrument': instMove(localOf(e), e); break;
  }
}

function onPUp(e){
  if(e.pointerType === 'touch') touchPts.delete(e.pointerId);
  if(fabricIds.has(e.pointerId)){
    fabricIds.delete(e.pointerId);
    if(G.mode === 'pinch' && touchPts.size < 2){ endPinch(); G.mode = touchPts.size ? 'wait' : null; }
    else if(G.mode === 'wait' && !touchPts.size) G.mode = null;
    return;                                               // پایانِ کار fabric
  }
  if(!G.mode) return;
  if(G.mode === 'pinch' || G.mode === 'wait'){
    block(e);
    if(G.mode === 'pinch' && touchPts.size < 2){ endPinch(); G.mode = touchPts.size ? 'wait' : null; }
    else if(G.mode === 'wait' && !touchPts.size) G.mode = null;
    return;
  }
  if(e.pointerId !== G.id){ block(e); return; }
  block(e);
  if(G.mode === 'ink' && e.type === 'pointerup'){
    const q = localOf(e), l = ink.raw[ink.raw.length - 1];
    if(l && dist(q, l) > 0.8) pushSmoothed(q);
  }
  finishGesture(e);
}
function finishGesture(e){
  const m = G.mode;
  G.mode = null;
  if(m === 'ink') inkEnd();
  else if(m === 'erase') eraseEnd();
  else if(m === 'laser') laserEnd();
  else if(m === 'pan') endPan();
  else if(m === 'shape') shapeEnd(e ? localOf(e) : null);
  else if(m === 'instrument') instEnd();
}
function cancelGesture(){
  const m = G.mode;
  G.mode = null;
  if(m === 'ink'){ ink.pts = []; ink.raw = []; ink.pred = []; inkRender(); if(hist.dirty) markHistoryDirty(); }
  else if(m === 'erase') eraseEnd();
  else if(m === 'laser') laserEnd();
  else if(m === 'pan') endPan();
  else if(m === 'shape'){
    if(S.drawingShape){ canvas.remove(S.drawingShape); S.drawingShape = null; }
    S.shapeStart = null;
  }
  else if(m === 'instrument'){
    if(G.inst && G.inst.part === 'knob'){ ink.trail = null; inkRender(); if(hist.dirty) markHistoryDirty(); }
    G.inst = null; S.snapMark = null; ovKick();
  }
}

/* ---- جابجایی و زوم دو انگشتی ---- */
function liveVpt(){
  const a = canvas.getActiveObject();
  if(a) a.setCoords();
  canvas.requestRenderAll();
}
function startPan(p){
  const v = canvas.viewportTransform;
  G.pan = { x:p.x, y:p.y, v4:v[4], v5:v[5] };
  applyCursor('grabbing');
}
function panMove(p){
  const v = canvas.viewportTransform;
  v[4] = G.pan.v4 + p.x - G.pan.x;
  v[5] = G.pan.v5 + p.y - G.pan.y;
  liveVpt();
}
function endPan(){
  canvas.setViewportTransform(canvas.viewportTransform.slice());
  applyCursor();
}
function startPinch(){
  const pts = Array.from(touchPts.values());
  const a = pts[0], b = pts[1];
  G.mode = 'pinch'; G.id = null; G.ptype = 'touch';
  G.pinch = {
    d0: Math.max(10, dist(a, b)), z0: canvas.getZoom(),
    c0: { x:(a.x + b.x)/2, y:(a.y + b.y)/2 }, v0: canvas.viewportTransform.slice()
  };
}
function pinchMove(){
  const pts = Array.from(touchPts.values());
  if(pts.length < 2 || !G.pinch) return;
  const a = pts[0], b = pts[1], pz = G.pinch;
  const c = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 };
  const z = clamp(pz.z0 * dist(a, b) / pz.d0, ZMIN, ZMAX);
  const wx = (pz.c0.x - pz.v0[4]) / pz.z0, wy = (pz.c0.y - pz.v0[5]) / pz.z0;
  const v = canvas.viewportTransform;
  v[0] = v[3] = z;
  v[4] = c.x - wx*z;
  v[5] = c.y - wy*z;
  liveVpt();
}
function endPinch(){
  G.pinch = null;
  canvas.setViewportTransform(canvas.viewportTransform.slice());
}

/* ============================================================
   موتور جوهر — نوشتن روان
   · همه‌ی نقاط میانیِ رویداد (coalesced) برای خطوط صاف و دقیق
   · میانگین‌گیری وزنی از چند نمونه‌ی خامِ آخر همزمان با ورود هر نقطه —
     لرزشِ ریزِ دست/ماوس/حسگر را می‌گیرد تا خط یک‌دست به نظر برسد،
     نه مثل چند پاره‌خطِ به‌هم‌وصل‌شده (تأخیرش کمتر از یک فریم است)
   · پیش‌بینی نقطه‌ی بعد برای کاهش تأخیر (قلم نوری/لمس)
   · رسم زنده روی بوم جداگانه در هر فریم، بدون درگیرکردن fabric
   · در پایان خط: ساده‌سازی + منحنی نرم (Catmull‑Rom) و افزودن یک‌باره به بوم
============================================================ */
const ink = { pts:[], raw:[], pred:[], style:null, raf:0, pending:[], trail:null, usePred:false };
const SMOOTH_W = [0.5, 0.3, 0.2];   // وزن نمونه‌های خام: [تازه‌ترین, قبلی, قبل‌تر]
function pushSmoothed(q){
  const raw = ink.raw;
  raw.push(q);
  if(raw.length > SMOOTH_W.length) raw.shift();
  let sx = 0, sy = 0, sw = 0;
  for(let k = 0; k < raw.length; k++){
    const w = SMOOTH_W[k] || 0, pt = raw[raw.length - 1 - k];   // k=0 → تازه‌ترین
    sx += pt.x*w; sy += pt.y*w; sw += w;
  }
  ink.pts.push({ x:sx/sw, y:sy/sw });
}

function inkKick(){ if(!ink.raf) ink.raf = requestAnimationFrame(inkRender); }
function inkRender(){
  if(ink.raf){ cancelAnimationFrame(ink.raf); ink.raf = 0; }
  if(!inkCtx) return;
  const ctx = inkCtx;
  ctx.clearRect(0, 0, wrapRect.width + 2, wrapRect.height + 2);
  for(const fn of ink.pending) fn(ctx);
  if(G.mode === 'ink' && ink.pts.length){
    drawStroke(ctx, ink.pred.length ? ink.pts.concat(ink.pred) : ink.pts, ink.style);
  }
  if(ink.trail) drawTrail(ctx, ink.trail);
}
function tracePts(ctx, pts){
  const n = pts.length;
  if(!n) return;
  ctx.moveTo(pts[0].x, pts[0].y);
  if(n === 1){ ctx.lineTo(pts[0].x + 0.01, pts[0].y); return; }
  if(n === 2){ ctx.lineTo(pts[1].x, pts[1].y); return; }
  ctx.lineTo((pts[0].x + pts[1].x)/2, (pts[0].y + pts[1].y)/2);
  for(let i=1; i<n-1; i++){
    const a = pts[i], b = pts[i+1];
    ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x)/2, (a.y + b.y)/2);
  }
  ctx.lineTo(pts[n-1].x, pts[n-1].y);
}
function inkPaint(ctx, st){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(0.6, st.width*canvas.getZoom());
  ctx.globalAlpha = st.opacity;
  ctx.strokeStyle = (st.chalk && chalkPattern(ctx, st.color)) || st.color;
}
function drawStroke(ctx, pts, st){
  ctx.save();
  inkPaint(ctx, st);
  ctx.beginPath(); tracePts(ctx, pts); ctx.stroke();
  ctx.restore();
}
function drawTrail(ctx, t){
  if(Math.abs(t.sweep) < 1e-4) return;
  const v = canvas.viewportTransform, z = v[0];
  ctx.save();
  inkPaint(ctx, t.style);
  ctx.beginPath();
  if(Math.abs(t.sweep) >= TAU - 1e-6) ctx.arc(t.cx*z + v[4], t.cy*z + v[5], t.r*z, 0, TAU);
  else ctx.arc(t.cx*z + v[4], t.cy*z + v[5], t.r*z, -t.a0, -(t.a0 + t.sweep), t.sweep > 0);
  ctx.stroke();
  ctx.restore();
}

function inkStart(e, p){
  clearTimeout(hist.timer);              // در میانه‌ی نوشتن هیچ کار سنگینی انجام نشود
  const hi = S.tool === 'highlighter';
  ink.style = {
    hi, chalk:S.chalk, opacity:S.opacity,
    color: hi ? hexToRgba(S.color, .35) : S.color,
    width: hi ? Math.max(10, S.width*3) : S.width
  };
  ink.pts = [p]; ink.raw = [p]; ink.pred = [];
  ink.usePred = e.pointerType !== 'mouse';
  inkKick();
}
function inkMove(e){
  for(const ev of coalesced(e)){
    const q = localOf(ev), l = ink.raw[ink.raw.length - 1];
    const dx = q.x - l.x, dy = q.y - l.y;
    if(dx*dx + dy*dy >= 0.36) pushSmoothed(q);
  }
  ink.pred.length = 0;
  if(ink.usePred && e.getPredictedEvents){
    const pr = e.getPredictedEvents();
    if(pr && pr.length) ink.pred.push(localOf(pr[Math.min(pr.length - 1, 1)]));
  }
  inkKick();
}
function inkEnd(){
  const pts = ink.pts, st = ink.style;
  ink.pts = []; ink.raw = []; ink.pred = [];
  if(!pts.length || !st){ inkRender(); return; }
  const v = canvas.viewportTransform, z = v[0];
  let w = pts.map(p => ({ x:(p.x - v[4])/z, y:(p.y - v[5])/z }));
  w = simplifyRDP(w, 0.35/z);
  const path = new fabric.Path(buildPathCmds(w), {
    stroke:st.color, strokeWidth:st.width, fill:null,
    strokeLineCap:'round', strokeLineJoin:'round',
    opacity:st.opacity, wbRole: st.hi ? 'hi' : 'ink'
  });
  flushHistory();                                    // وضعیت خط قبلی (قلم بالاست؛ مکث دیده نمی‌شود)
  ink.pending.push(ctx => drawStroke(ctx, pts, st)); // تا رسم fabric، خط روی لایه‌ی جوهر می‌ماند
  canvas.add(path);
  markHistoryDirty();
  inkRender();
}
function buildPathCmds(pts){
  const r = n => Math.round(n*100)/100;
  const n = pts.length, a = pts[0];
  if(n === 1) return [['M', r(a.x), r(a.y)], ['L', r(a.x) + 0.01, r(a.y)]];
  const out = [['M', r(a.x), r(a.y)]];
  if(n === 2){ out.push(['L', r(pts[1].x), r(pts[1].y)]); return out; }
  out.push(['L', r((a.x + pts[1].x)/2), r((a.y + pts[1].y)/2)]);
  for(let i=1; i<n-1; i++){
    const p = pts[i], q = pts[i+1];
    out.push(['Q', r(p.x), r(p.y), r((p.x + q.x)/2), r((p.y + q.y)/2)]);
  }
  const l = pts[n-1];
  out.push(['L', r(l.x), r(l.y)]);
  return out;
}
function simplifyRDP(pts, eps){
  if(pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]], e2 = eps*eps;
  while(stack.length){
    const [s, t] = stack.pop();
    const a = pts[s], b = pts[t], dx = b.x - a.x, dy = b.y - a.y, L2 = dx*dx + dy*dy;
    let maxD = 0, idx = -1;
    for(let i=s+1; i<t; i++){
      const p = pts[i];
      let d;
      if(!L2) d = (p.x - a.x)**2 + (p.y - a.y)**2;
      else {
        const u = clamp(((p.x - a.x)*dx + (p.y - a.y)*dy)/L2, 0, 1);
        d = (a.x + u*dx - p.x)**2 + (a.y + u*dy - p.y)**2;
      }
      if(d > maxD){ maxD = d; idx = i; }
    }
    if(maxD > e2 && idx > 0){ keep[idx] = 1; stack.push([s, idx], [idx, t]); }
  }
  return pts.filter((_, i) => keep[i]);
}

/* ============================================================
   پاک‌کن — فقط چیزی را که واقعاً لمس شود پاک می‌کند؛
   تصاویر و اشیای قفل‌شده محفوظ‌اند.
============================================================ */
function eraseStart(p){
  canvas.discardActiveObject();
  const dis = [];
  canvas.getObjects().forEach(o=>{
    if(((o.type === 'image' && o.wbRole !== 'fill') || o.lockMovementX) && o.evented !== false){ o.evented = false; dis.push(o); }
  });
  G.erase = { last:p, removed:0, dis };
  canvas.targetFindTolerance = ERASER_R;
  eraseAt(p);
  ovKick();
}
function eraseMove(e){
  const er = G.erase;
  if(!er) return;
  for(const ev of coalesced(e)){
    const q = localOf(ev), d = dist(q, er.last);
    const steps = Math.max(1, Math.ceil(d/5));
    for(let i=1; i<=steps; i++) eraseAt(along(er.last, q, i/steps));
    er.last = q;
  }
  ovKick();
}
function eraseAt(p){
  const ev = { clientX:p.x + wrapRect.left, clientY:p.y + wrapRect.top, target:canvas.upperCanvasEl, type:'pointermove' };
  for(let i=0; i<6; i++){
    const t = canvas.findTarget(ev, true);
    if(!t) break;
    canvas.remove(t);
    G.erase.removed++;
  }
}
function eraseEnd(){
  const er = G.erase;
  G.erase = null;
  canvas.targetFindTolerance = 6;
  if(!er) return;
  er.dis.forEach(o=>{ o.evented = true; });
  if(er.removed){ canvas.requestRenderAll(); saveHistory(); }
  ovKick();
}

/* ============================================================
   لیزر
============================================================ */
function laserStart(p){
  S.laserActive = true;
  ov.pts = [{ x:p.x, y:p.y, t:performance.now() }];
  ovKick();
}
function laserMove(e){
  for(const ev of coalesced(e)){
    const p = localOf(ev), last = ov.pts[ov.pts.length - 1];
    if(!last || Math.hypot(p.x - last.x, p.y - last.y) > 1.5){
      ov.pts.push({ x:p.x, y:p.y, t:performance.now() });
      if(ov.pts.length > 500) ov.pts.shift();
    }
  }
  ovKick();
}
function laserEnd(){ S.laserActive = false; ovKick(); }

/* ============================================================
   اشکال (کشیدن برای اندازه دلخواه، کلیک = اندازه پیش‌فرض)
============================================================ */
const SHAPE_DEFAULTS = {
  rect:[180,110], circle:[150,150], triangle:[150,140], line:[170,0],
  arrow:[180,0], star:[150,150], polygon:[160,160],
  cube:[190,160], cylinder:[190,160], pyramid:[190,160]
};
function shapeStart(p){
  S.shapeStart = toWorld(p);
  if(S.drawingShape){ canvas.remove(S.drawingShape); S.drawingShape = null; }
}
function shapeMove(p){
  const s = S.shapeStart;
  if(!s) return;
  const w = toWorld(p);
  if(!S.drawingShape){
    if(Math.hypot(w.x - s.x, w.y - s.y) < 6 / canvas.getZoom()) return;
    S.drawingShape = makeShape(S.pendingShape, (s.x + w.x)/2, (s.y + w.y)/2,
      Math.abs(w.x - s.x), Math.abs(w.y - s.y), s.x, s.y, w.x, w.y);
    if(S.drawingShape) canvas.add(S.drawingShape);
  } else {
    updateDragShape(s, w);
  }
}
function shapeEnd(p){
  const s = S.shapeStart;
  if(!s) return;
  let o = S.drawingShape;
  S.drawingShape = null; S.shapeStart = null;
  if(o){
    if(p) o = updateDragShapeFinal(o, s, toWorld(p));
  } else {
    const q = p ? toWorld(p) : s;
    const d = SHAPE_DEFAULTS[S.pendingShape] || [160,120];
    o = makeShape(S.pendingShape, q.x, q.y, d[0], d[1], q.x - d[0]/2, q.y - d[1]/2, q.x + d[0]/2, q.y + d[1]/2);
    if(o) canvas.add(o);
  }
  if(!o) return;
  setTool('select');
  o.setCoords();
  canvas.setActiveObject(o);
  canvas.requestRenderAll();
  saveHistory();
  status('شکل اضافه شد');
}
function updateDragShapeFinal(o, s, w){
  S.drawingShape = o;
  updateDragShape(s, w);
  o = S.drawingShape;
  S.drawingShape = null;
  return o;
}

function makeShape(type, cx, cy, w, h, x1, y1, x2, y2){
  w = Math.max(w, 2); h = Math.max(h, 2);
  const c = S.color, sw = S.width;
  const base = { stroke:c, strokeWidth:sw, fill:'rgba(255,255,255,.05)', opacity:S.opacity };
  switch(type){
    case 'rect':
      return new fabric.Rect({ ...base, left:cx, top:cy, width:w, height:h,
        originX:'center', originY:'center',
        rx:Math.min(10, w/6, h/6), ry:Math.min(10, w/6, h/6) });
    case 'circle':
      return new fabric.Circle({ ...base, left:cx, top:cy, originX:'center', originY:'center',
        radius:Math.max(4, Math.min(w,h)/2) });
    case 'triangle':
      return new fabric.Triangle({ ...base, left:cx, top:cy, width:w, height:h, originX:'center', originY:'center' });
    case 'line':
      return new fabric.Line([x1,y1,x2,y2], { stroke:c, strokeWidth:sw, strokeLineCap:'round', opacity:S.opacity });
    case 'arrow':
      return makeArrowSeg(x1, y1, x2, y2);
    case 'star': {
      const o = new fabric.Polygon(starPts(50,5), { ...base, left:cx, top:cy, originX:'center', originY:'center' });
      o.set({ scaleX:w/100, scaleY:h/100 });
      return o;
    }
    case 'polygon': {
      const o = new fabric.Polygon(starPts(50,6,.5), { ...base, left:cx, top:cy, originX:'center', originY:'center' });
      o.set({ scaleX:w/100, scaleY:h/100 });
      return o;
    }
    case 'cube':     return groupScaled(makeCube(), cx, cy, w, h);
    case 'cylinder': return groupScaled(makeCylinder(), cx, cy, w, h);
    case 'pyramid':  return groupScaled(makePyramid(), cx, cy, w, h);
  }
  return null;
}
function updateDragShape(s, p){
  const o = S.drawingShape;
  if(!o) return;
  const cx = (s.x + p.x)/2, cy = (s.y + p.y)/2;
  const w = Math.abs(p.x - s.x), h = Math.abs(p.y - s.y);
  switch(S.pendingShape){
    case 'rect':
      o.set({ left:cx, top:cy, width:Math.max(w,2), height:Math.max(h,2),
              rx:Math.min(10, w/6, h/6), ry:Math.min(10, w/6, h/6) });
      break;
    case 'circle':
      o.set({ left:cx, top:cy, radius:Math.max(4, Math.min(w,h)/2) });
      break;
    case 'triangle':
      o.set({ left:cx, top:cy, width:Math.max(w,2), height:Math.max(h,2) });
      break;
    case 'star':
    case 'polygon':
      o.set({ left:cx, top:cy, scaleX:Math.max(w,2)/100, scaleY:Math.max(h,2)/100 });
      break;
    case 'line':
    case 'arrow':
      canvas.remove(o);
      S.drawingShape = makeShape(S.pendingShape, cx, cy, w, h, s.x, s.y, p.x, p.y);
      canvas.add(S.drawingShape);
      break;
    default: {
      const bw = o._baseW || 1, bh = o._baseH || 1;
      o.set({ left:cx, top:cy, scaleX:Math.max(w,2)/bw, scaleY:Math.max(h,2)/bh });
    }
  }
  S.drawingShape.setCoords();
  canvas.requestRenderAll();
}
function makeArrowSeg(x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx) * R2D;
  const head = Math.max(16, S.width*4);
  const ex = x2 - (dx/len)*head*0.7, ey = y2 - (dy/len)*head*0.7;
  const l = new fabric.Line([x1,y1,ex,ey], { stroke:S.color, strokeWidth:S.width, strokeLineCap:'round' });
  const tri = new fabric.Triangle({
    left:x2 - (dx/len)*head*0.5, top:y2 - (dy/len)*head*0.5,
    width:head, height:head*0.85, angle:ang + 90,
    fill:S.color, stroke:S.color, strokeWidth:1,
    originX:'center', originY:'center'
  });
  return new fabric.Group([l, tri], { opacity:S.opacity });
}
function starPts(r, n, inner=.45){
  const a = [];
  for(let i=0;i<n*2;i++){
    const rr = i%2 ? r*inner : r;
    const ang = -Math.PI/2 + i*Math.PI/n;
    a.push({ x:Math.cos(ang)*rr, y:Math.sin(ang)*rr });
  }
  return a;
}
function groupScaled(o, cx, cy, w, h){
  const bw = (o.width || 1), bh = (o.height || 1);
  o._baseW = bw; o._baseH = bh;
  o.set({ left:cx, top:cy, originX:'center', originY:'center', scaleX:w/bw, scaleY:h/bh, opacity:S.opacity });
  o.setCoords();
  return o;
}
function makeCube(){
  const c = S.color, sw = S.width;
  return new fabric.Group([
    new fabric.Rect({left:-55,top:-45,width:110,height:90,fill:'rgba(255,255,255,.04)',stroke:c,strokeWidth:sw}),
    new fabric.Polyline([{x:-55,y:-45},{x:-25,y:-72},{x:85,y:-72},{x:55,y:-45}],{fill:'rgba(255,255,255,.02)',stroke:c,strokeWidth:sw}),
    new fabric.Polyline([{x:55,y:-45},{x:85,y:-72},{x:85,y:18},{x:55,y:45}],{fill:'rgba(255,255,255,.02)',stroke:c,strokeWidth:sw})
  ], {originX:'center',originY:'center'});
}
function makeCylinder(){
  const c = S.color, sw = S.width;
  return new fabric.Group([
    new fabric.Ellipse({left:-65,top:-55,rx:65,ry:22,fill:'rgba(255,255,255,.05)',stroke:c,strokeWidth:sw}),
    new fabric.Line([-65,-33,-65,57],{stroke:c,strokeWidth:sw}),
    new fabric.Line([65,-33,65,57],{stroke:c,strokeWidth:sw}),
    new fabric.Ellipse({left:-65,top:35,rx:65,ry:22,fill:'rgba(255,255,255,.03)',stroke:c,strokeWidth:sw})
  ], {originX:'center',originY:'center'});
}
function makePyramid(){
  const c = S.color, sw = S.width;
  return new fabric.Group([
    new fabric.Polygon([{x:-70,y:55},{x:70,y:55},{x:40,y:78},{x:-40,y:78}],{fill:'rgba(255,255,255,.03)',stroke:c,strokeWidth:sw}),
    new fabric.Line([-70,55,0,-70],{stroke:c,strokeWidth:sw}),
    new fabric.Line([70,55,0,-70],{stroke:c,strokeWidth:sw}),
    new fabric.Line([-40,78,0,-70],{stroke:c,strokeWidth:sw}),
    new fabric.Line([40,78,0,-70],{stroke:c,strokeWidth:sw})
  ], {originX:'center',originY:'center'});
}

/* ============================================================
   نقاط چسبان (برای دقت در ترسیم هندسی)
============================================================ */
function lineEnds(o){
  const p = o.calcLinePoints(), m = o.calcTransformMatrix();
  return [fabric.util.transformPoint(new fabric.Point(p.x1, p.y1), m),
          fabric.util.transformPoint(new fabric.Point(p.x2, p.y2), m)];
}
function arcPointW(o, deg){ const c = o.getCenterPoint(), q = polar(deg, o.radius); return { x:c.x + q.x, y:c.y + q.y }; }
function anglePointsW(o){
  const c = o.getCenterPoint(), p1 = polar(o.a1, o.len1), p2 = polar(o.a2, o.len2);
  return [c, { x:c.x + p1.x, y:c.y + p1.y }, { x:c.x + p2.x, y:c.y + p2.y }];
}
function collectSnapPoints(exclude, fromInst){
  const out = [];
  const objs = canvas.getObjects();
  if(objs.length <= 2000) for(const o of objs){
    if(o === exclude) continue;
    if(o.type === 'wbArc'){
      out.push(o.getCenterPoint());
      if(!o.isFull()) out.push(arcPointW(o, o.startAngle), arcPointW(o, o.endAngle()));
    }
    else if(o.type === 'wbAngle') out.push(...anglePointsW(o));
    else if(o.type === 'line') out.push(...lineEnds(o));
    else if(o.type === 'polygon' || o.type === 'polyline'){
      const m = o.calcTransformMatrix();
      for(const p of o.points) out.push(fabric.util.transformPoint(new fabric.Point(p.x - o.pathOffset.x, p.y - o.pathOffset.y), m));
    }
  }
  const c = INST.compass, pr = INST.prot;
  if(fromInst !== 'compass' && c.on) out.push({ x:c.x, y:c.y }, { x:c.x + c.r*Math.cos(c.a), y:c.y - c.r*Math.sin(c.a) });
  if(fromInst !== 'prot' && pr.on) out.push({ x:pr.x, y:pr.y });
  return out;
}
function nearestSnap(w, pts, tol){
  let best = null, bd = tol;
  for(const q of pts){
    const d = Math.hypot(q.x - w.x, q.y - w.y);
    if(d < bd){ bd = d; best = q; }
  }
  return best ? { x:best.x, y:best.y } : null;
}
// جهت خطوطی که از یک نقطه شروع می‌شوند (برای چسبیدن نقاله به ضلع زاویه)
function dirsAtPoint(pt){
  const dirs = [], tol = 1.5 / canvas.getZoom();
  for(const o of canvas.getObjects()){
    if(o.type === 'wbAngle'){ if(dist(o.getCenterPoint(), pt) < tol) dirs.push(o.a1, o.a2); }
    else if(o.type === 'wbArc'){ if(!o.isFull() && dist(o.getCenterPoint(), pt) < tol) dirs.push(o.startAngle, o.endAngle()); }
    else if(o.type === 'line'){
      const [p1, p2] = lineEnds(o);
      if(dist(p1, pt) < tol) dirs.push(Math.atan2(-(p2.y - p1.y), p2.x - p1.x)*R2D);
      else if(dist(p2, pt) < tol) dirs.push(Math.atan2(-(p1.y - p2.y), p1.x - p2.x)*R2D);
    }
  }
  return dirs;
}
const degGap = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);

/* ============================================================
   ابزارهای سه‌بعدی: پرگار و نقاله (روی لایه‌ی رویی)
============================================================ */
const INST = {
  compass:{ on:false, x:0, y:0, r:UNIT*3, a:0, sweepPref:120 },
  prot:{ on:false, x:0, y:0, R:170, rot:0, arm:60, full:false },
  focus:null, anim:0
};
function refreshInstButtons(){
  $$('[data-cmd="compass"]').forEach(b=>b.classList.toggle('active', INST.compass.on));
  $$('[data-cmd="protractor"]').forEach(b=>b.classList.toggle('active', INST.prot.on));
}
function toggleCompass(force){
  const c = INST.compass;
  const on = force != null ? !!force : !c.on;
  if(on && !c.on){
    const vc = viewCenter(), z = canvas.getZoom();
    c.r = snapLen(Math.min(UNIT*3, 150/z)); c.a = 0;
    c.x = vc.x - c.r/2; c.y = vc.y + 50/z;
    status('پرگار — نوک مداد: شعاع • سوزن: جابجایی • دسته‌ی بالا را دور سوزن بچرخانید تا رسم شود');
  }
  if(!on) cancelInstAnim();
  c.on = on;
  INST.focus = on ? 'compass' : (INST.prot.on ? 'prot' : null);
  if(on && canvas.getActiveObject()){ canvas.discardActiveObject(); canvas.requestRenderAll(); }
  refreshInstButtons(); updateCtxBar(); ovRender();

function toggleProtractor(force){
  const pr = INST.prot;
  const on = force != null ? !!force : !pr.on;
  if(on && !pr.on){
    const vc = viewCenter(), z = canvas.getZoom();
    pr.R = 170/z; pr.rot = 0; pr.x = vc.x; pr.y = vc.y + 70/z;
    status('نقاله — بدنه: جابجایی • دستگیره‌ی ↻: چرخش • دستگیره‌ی قرمز: اندازه زاویه');
  }
  pr.on = on;
  INST.focus = on ? 'prot' : (INST.compass.on ? 'compass' : null);
  if(on && canvas.getActiveObject()){ canvas.discardActiveObject(); canvas.requestRenderAll(); }

/* ---- هندسه‌ی پرگار (مختصات صفحه) — نمای مایل: لولا بالاتر از کاغذ دیده می‌شود ---- */
function compassGeom(){
  const c = INST.compass, v = canvas.viewportTransform, z = v[0];
  const P = { x:c.x*z + v[4], y:c.y*z + v[5] };
  const rs = c.r*z;
  const T = { x:P.x + rs*Math.cos(c.a), y:P.y - rs*Math.sin(c.a) };
  const k = clamp(Math.sqrt(z), 0.7, 1.35);
  const legW = Math.max(c.r*0.56 + 85, c.r/2 + 30);
  const hs = Math.max(Math.sqrt(Math.max(0, legW*legW - c.r*c.r/4))*z*0.62, 44*k);
  const M = { x:(P.x + T.x)/2, y:(P.y + T.y)/2 };
  const H = { x:M.x, y:M.y - hs };
  const K = { x:H.x, y:H.y - 30*k };
  return { P, T, M, H, K, k, z, rs };
}
function compassHit(p){
  const g = compassGeom(), k = g.k;
  if(dist(p, g.T) < 20) return 'pencil';
  if(dist(p, g.K) < 17 || distToSeg(p, g.H, g.K) < 11*k + 3 || dist(p, g.H) < 13*k + 3) return 'knob';
  if(dist(p, g.P) < 16) return 'needle';
  if(distToSeg(p, g.H, g.P) < 7*k + 4 || distToSeg(p, g.H, g.T) < 7*k + 4) return 'leg';
  return null;
}

/* ---- هندسه‌ی نقاله ---- */
function protFrame(){
  const pr = INST.prot, v = canvas.viewportTransform, z = v[0];
  const R = pr.R*z;
  return { C:{ x:pr.x*z + v[4], y:pr.y*z + v[5] }, R, rot:pr.rot*D2R, k:clamp(R/170, 0.55, 1.8) };
}
function protLocal(p, f){
  const dx = p.x - f.C.x, dy = p.y - f.C.y, c = Math.cos(f.rot), s = Math.sin(f.rot);
  return { x:c*dx - s*dy, y:s*dx + c*dy };
}
function protToScreen(L, f){
  const c = Math.cos(-f.rot), s = Math.sin(-f.rot);
  return { x:f.C.x + L.x*c - L.y*s, y:f.C.y + L.x*s + L.y*c };
}
function protRotHandle(f){
  return INST.prot.full ? polar(-45, f.R + 30*f.k) : { x:0, y:20*f.k + 20*f.k };
}
function protHit(p){
  const pr = INST.prot, f = protFrame(), k = f.k, R = f.R;
  const L = protLocal(p, f);
  const knob = polar(pr.arm, R + 22*k);
  if(Math.hypot(L.x - knob.x, L.y - knob.y) < 18) return 'arm';
  const rh = protRotHandle(f);
  if(Math.hypot(L.x - rh.x, L.y - rh.y) < 17) return 'rotate';
  const r = Math.hypot(L.x, L.y), Rin = R*0.36;
  if(pr.full){
    if(r <= R + 2 && r >= Rin - 2) return 'body';
  } else {
    const base = 20*k;
    const inHole = L.y < -6*k && Math.hypot(L.x, L.y + 6*k) < Rin;
    if(!inHole && ((L.y <= 0 && r <= R + 2) || (L.y > 0 && L.y <= base + 2 && Math.abs(L.x) <= R + 2))) return 'body';
  }
  if(distToSeg(L, { x:0, y:0 }, knob) < 6) return 'arm';
  return null;
}
function instrumentHit(p){
  if(INST.compass.on){ const part = compassHit(p); if(part) return { inst:'compass', part }; }
  if(INST.prot.on){ const part = protHit(p); if(part) return { inst:'prot', part }; }
  return null;
}

/* ---- کشیدن ابزارها ---- */
function compassInkStyle(){ return { color:S.color, width:Math.max(2, S.width), chalk:S.chalk, opacity:S.opacity }; }

function instStart(hit, p){
  if(INST.anim) cancelInstAnim();
  if(canvas.getActiveObject()){ canvas.discardActiveObject(); canvas.requestRenderAll(); }
  INST.focus = hit.inst;
  const w = toWorld(p);
  const d = G.inst = { inst:hit.inst, part:hit.part };
  if(hit.inst === 'compass'){
    const c = INST.compass;
    if(hit.part === 'needle' || hit.part === 'leg'){ d.off = { x:c.x - w.x, y:c.y - w.y }; d.snaps = collectSnapPoints(null, 'compass'); }
    else if(hit.part === 'pencil') d.snaps = collectSnapPoints(null, 'compass');
    else if(hit.part === 'knob'){
      const g = compassGeom();
      d.lastPhi = Math.atan2(-(p.y - g.P.y), p.x - g.P.x);
      clearTimeout(hist.timer);
      ink.trail = { cx:c.x, cy:c.y, r:c.r, a0:c.a, sweep:0, style:compassInkStyle() };
    }
  } else {
    const pr = INST.prot;
    if(hit.part === 'body'){ d.off = { x:pr.x - w.x, y:pr.y - w.y }; d.snaps = collectSnapPoints(null, 'prot'); }
    else if(hit.part === 'rotate'){
      const f = protFrame();
      d.last = Math.atan2(-(p.y - f.C.y), p.x - f.C.x); d.acc = 0; d.rot0 = pr.rot;
      d.dirs = dirsAtPoint({ x:pr.x, y:pr.y });
    }
    else if(hit.part === 'arm') d.dirs = dirsAtPoint({ x:pr.x, y:pr.y });
  }
  updateCtxBar();
  ovRender();
}
function instMove(p){
  const d = G.inst;
  if(!d) return;
  const w = toWorld(p), z = canvas.getZoom();
  if(d.inst === 'compass'){
    const c = INST.compass;
    if(d.part === 'needle' || d.part === 'leg'){
      let q = { x:w.x + d.off.x, y:w.y + d.off.y };
      const s = nearestSnap(q, d.snaps, 12/z);
      S.snapMark = s;
      if(s) q = s;
      c.x = q.x; c.y = q.y;
    } else if(d.part === 'pencil'){
      const s = nearestSnap(w, d.snaps, 12/z);
      S.snapMark = s;
      const q = s || w;
      let r = Math.hypot(q.x - c.x, q.y - c.y);
      if(!s) r = snapLen(r);
      c.r = clamp(r, UNIT*0.2, UNIT*60);
      c.a = Math.atan2(-(q.y - c.y), q.x - c.x);
    } else if(d.part === 'knob'){
      const g = compassGeom();
      if(dist(p, g.P) < 6) return;
      const phi = Math.atan2(-(p.y - g.P.y), p.x - g.P.x);
      const t = ink.trail;
      t.sweep = clamp(t.sweep + angDelta(d.lastPhi, phi), -TAU, TAU);
      d.lastPhi = phi;
      c.a = t.a0 + t.sweep;
      inkKick();
    }
  } else {
    const pr = INST.prot;
    if(d.part === 'body'){
      let q = { x:w.x + d.off.x, y:w.y + d.off.y };
      const s = nearestSnap(q, d.snaps, 14/z);
      S.snapMark = s;
      if(s) q = s;
      pr.x = q.x; pr.y = q.y;
    } else if(d.part === 'rotate'){
      const f = protFrame();
      const phi = Math.atan2(-(p.y - f.C.y), p.x - f.C.x);
      d.acc += angDelta(d.last, phi); d.last = phi;
      let rot = d.rot0 + d.acc*R2D, best = null, bg = 3.5;
      const cands = [];
      d.dirs.forEach(x=> cands.push(x, x + 180));
      for(let m=0; m<360; m+=15) cands.push(m);
      for(const x of cands){ const g = degGap(rot, x); if(g < bg){ bg = g; best = x; } }
      pr.rot = normDeg(best != null ? best : Math.round(rot));
    } else if(d.part === 'arm'){
      const f = protFrame(), L = protLocal(p, f);
      let th = Math.atan2(-L.y, L.x)*R2D;
      if(pr.full) th = normDeg(th);
      else if(th < 0) th = th < -90 ? 180 : 0;
      let best = null, bg = 2.5;
      for(const x of d.dirs){
        const rel = normDeg(x - pr.rot);
        if(!pr.full && rel > 180) continue;
        const g = degGap(th, rel);
        if(g < bg){ bg = g; best = rel; }
      }
      pr.arm = best != null ? best : Math.round(th);
    }
  }
  fillCtx();
  ovRender();
}
function instEnd(){
  const d = G.inst;
  G.inst = null;
  S.snapMark = null;
  if(d && d.inst === 'compass' && d.part === 'knob'){
    const t = ink.trail;
    ink.trail = null;
    if(t && Math.abs(t.sweep) > D2R) commitCompassArc(t);
    else { inkRender(); if(hist.dirty) markHistoryDirty(); }
  }
  updateCtxBar();
  ovRender();
}
function commitCompassArc(t){
  let start = t.a0*R2D, sw = t.sweep*R2D;
  if(Math.abs(sw) >= 359.5) sw = sw < 0 ? -360 : 360;
  if(sw < 0){ start += sw; sw = -sw; }
  const arc = new fabric.WbArc({
    left:t.cx, top:t.cy, radius:t.r, startAngle:normDeg(start), sweep:sw,
    stroke:t.style.color, strokeWidth:t.style.width, opacity:t.style.opacity, showCenter:true
  });
  flushHistory();
  ink.pending.push(ctx => drawTrail(ctx, t));
  canvas.add(arc);
  saveHistory();
  inkRender();
  toast(sw >= 360 ? '⭕ دایره رسم شد' : '◠ کمان ' + faNum(sw, 0) + '° رسم شد');
}
// رسم خودکار دایره/کمان با انیمیشن چرخش پرگار
function compassAuto(sweepDeg){
  const c = INST.compass;
  if(G.mode || INST.anim || !c.on) return;
  const sw = clamp(sweepDeg, -360, 360)*D2R;
  if(Math.abs(sw) < D2R) return;
  const a0 = c.a, dur = clamp(Math.abs(sw)/TAU*1500, 400, 1500), t0 = performance.now();
  clearTimeout(hist.timer);
  const tr = ink.trail = { cx:c.x, cy:c.y, r:c.r, a0, sweep:0, style:compassInkStyle() };
  const step = now=>{
    if(!INST.anim) return;
    const k = clamp((now - t0)/dur, 0, 1);
    tr.sweep = sw*easeInOut(k);
    c.a = a0 + tr.sweep;
    inkRender(); ovRender();
    if(k < 1) INST.anim = requestAnimationFrame(step);
    else { INST.anim = 0; ink.trail = null; commitCompassArc(tr); }
  };
  INST.anim = requestAnimationFrame(step);
}
function cancelInstAnim(){
  if(INST.anim){
    cancelAnimationFrame(INST.anim);
    INST.anim = 0;
    ink.trail = null;
    inkRender();
    if(hist.dirty) markHistoryDirty();
  }
}

/* ============================================================
   لایه‌ی رویی: راهنماها، ابزارهای سه‌بعدی، لیزر
============================================================ */
function ovKick(){ if(!ov.raf) ov.raf = requestAnimationFrame(ovRender); }
function ovRender(){
  if(ov.raf){ cancelAnimationFrame(ov.raf); ov.raf = 0; }
  if(!ovCtx || !canvas) return;
  const ctx = ovCtx;
  ctx.clearRect(0, 0, wrapRect.width + 2, wrapRect.height + 2);
  drawGuides(ctx);
  drawSmartInfo(ctx);
  if(INST.prot.on) drawProtractor(ctx);
  if(INST.compass.on) drawCompass(ctx);
  drawSnapMark(ctx);
  drawEraserMark(ctx);
  if(drawLaser(ctx)) ovKick();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pill(ctx, x, y, text, bg){
  ctx.save();
  ctx.font = 'bold 12px Tahoma, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  try{ ctx.direction = 'rtl'; }catch(e){}
  const w = ctx.measureText(text).width + 18, h = 24;
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6;
  ctx.fillStyle = bg || 'rgba(15,23,42,.88)';
  roundRect(ctx, x - w/2, y - h/2, w, h, 12); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x, y + 0.5);
  ctx.restore();
}

function drawGuides(ctx){
  if(!ov.guides.length) return;
  const v = canvas.viewportTransform, w = wrapRect.width, h = wrapRect.height;
  ctx.save();
  ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]);
  for(const g of ov.guides){
    ctx.beginPath();
    if(g.v){ const x = g.x*v[0] + v[4]; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    else   { const y = g.y*v[3] + v[5]; ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawSnapMark(ctx){
  if(!S.snapMark) return;
  const p = toScreen(S.snapMark);
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = '#f43f5e';
  ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawEraserMark(ctx){
  if(G.mode !== 'erase' || !G.erase || G.ptype === 'mouse') return;
  const p = G.erase.last;
  ctx.save();
  ctx.lineWidth = 1.5; ctx.strokeStyle = S.dark ? 'rgba(255,255,255,.85)' : 'rgba(51,65,85,.85)';
  ctx.fillStyle = S.dark ? 'rgba(255,255,255,.15)' : 'rgba(148,163,184,.2)';
  ctx.beginPath(); ctx.arc(p.x, p.y, ERASER_R, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}
// اطلاعات کمان انتخاب‌شده: دایره‌ی کامل کم‌رنگ، شعاع و اندازه
function drawSmartInfo(ctx){
  const o = canvas.getActiveObject();
  if(!o || o.type !== 'wbArc') return;
  const c = objToScreen(o, 0, 0), z = canvas.getZoom(), r = o.radius*z;
  ctx.save();
  ctx.setLineDash([6,6]); ctx.lineWidth = 1.2;
  ctx.strokeStyle = S.dark ? 'rgba(255,255,255,.45)' : 'rgba(59,110,245,.55)';
  if(!o.isFull()){ ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.stroke(); }
  const m = polar(o.startAngle + (o.isFull() ? 90 : o.sweep/2), r);
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + m.x, c.y + m.y); ctx.stroke();
  ctx.restore();
  const txt = 'شعاع ' + faNum(o.radius/UNIT, 1) + (o.isFull() ? ' • دایره' : ' • ' + faNum(o.sweep, 0) + '°');
  pill(ctx, c.x, c.y + 24, txt);
}

/* ---- رسم پرگار سه‌بعدی ---- */
const STEEL = [[0,'#3f4652'],[.22,'#9aa3b0'],[.42,'#f4f6f8'],[.6,'#c9d0d8'],[1,'#2f3540']];
const STEEL_DARK = [[0,'#1f2329'],[.4,'#6b7480'],[.55,'#b3bac3'],[1,'#1b1f24']];
const PENCIL_BODY = [[0,'#92400e'],[.28,'#f59e0b'],[.5,'#fde68a'],[.72,'#f59e0b'],[1,'#92400e']];
const WOOD = [[0,'#a57443'],[.5,'#f3d3a8'],[1,'#a57443']];

function drawRod(ctx, A, B, wA, wB, stops, outline){
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, nx = -dy/L, ny = dx/L;
  const w = Math.max(wA, wB)/2, mx = (A.x + B.x)/2, my = (A.y + B.y)/2;
  const g = ctx.createLinearGradient(mx - nx*w, my - ny*w, mx + nx*w, my + ny*w);
  for(const [o, c] of stops) g.addColorStop(o, c);
  ctx.beginPath();
  ctx.moveTo(A.x + nx*wA/2, A.y + ny*wA/2);
  ctx.lineTo(B.x + nx*wB/2, B.y + ny*wB/2);
  ctx.lineTo(B.x - nx*wB/2, B.y - ny*wB/2);
  ctx.lineTo(A.x - nx*wA/2, A.y - ny*wA/2);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = outline || 'rgba(17,24,39,.55)'; ctx.stroke();
}
function shadeStops(col){
  const h = toHex(col);
  return [[0,'rgba(0,0,0,.55)'],[.25,h],[.5,'rgba(255,255,255,.55)'],[.7,h],[1,'rgba(0,0,0,.45)']];
}
function metalBall(ctx, x, y, r, base){
  const g = ctx.createRadialGradient(x - r*0.35, y - r*0.4, r*0.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, base || '#c7ced6'); g.addColorStop(1, '#3b424c');
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(17,24,39,.6)'; ctx.stroke();
}
function drawCompass(ctx){
  const g = compassGeom(), { P, T, M, H, K, k } = g, c = INST.compass;
  const active = G.mode === 'instrument' && G.inst && G.inst.inst === 'compass';
  const part = active ? G.inst.part : (S.instHover && S.instHover.inst === 'compass' ? S.instHover.part : null);
  const u = { x:(T.x - H.x)/(dist(H, T) || 1), y:(T.y - H.y)/(dist(H, T) || 1) };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if(part === 'pencil' || (active && part === 'knob')){
    ctx.save();
    ctx.setLineDash([6,7]); ctx.lineWidth = 1.3;
    ctx.strokeStyle = S.dark ? 'rgba(255,255,255,.5)' : 'rgba(59,110,245,.55)';
    ctx.beginPath(); ctx.arc(P.x, P.y, g.rs, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // سایه‌ی نرم روی تخته
  const hs = M.y - H.y, Hs = { x:M.x + hs*0.45, y:M.y + hs*0.12 };
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 6*k;
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14*k;
  ctx.beginPath();
  ctx.moveTo(P.x, P.y); ctx.lineTo(Hs.x, Hs.y); ctx.lineTo(T.x, T.y);
  ctx.moveTo(Hs.x, Hs.y); ctx.lineTo(Hs.x + 30*k*0.45, Hs.y + 30*k*0.12);
  ctx.stroke();
  ctx.restore();

  // پای سوزنی
  const N0 = towards(P, H, 16*k);
  drawRod(ctx, H, N0, 12*k, 7*k, STEEL);
  drawRod(ctx, N0, towards(N0, H, 7*k), 9*k, 9*k, STEEL_DARK);
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.4*k;
  ctx.beginPath(); ctx.moveTo(N0.x, N0.y); ctx.lineTo(P.x, P.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.8*k;
  ctx.beginPath(); ctx.moveTo(N0.x - 0.6*k, N0.y); ctx.lineTo(P.x, P.y - 1); ctx.stroke();

  // پای مدادی/گچی
  const Q = along(H, T, 0.5);
  drawRod(ctx, H, Q, 12*k, 9*k, STEEL);
  const Qp = towards(Q, H, 6*k);
  if(S.chalk){
    const tipBack = towards(T, H, 3*k);
    drawRod(ctx, Qp, tipBack, 11*k, 10*k, shadeStops(S.color), 'rgba(0,0,0,.35)');
    ctx.beginPath(); ctx.arc(tipBack.x, tipBack.y, 5*k, 0, TAU);
    ctx.fillStyle = toHex(S.color); ctx.fill();
  } else {
    const C0 = towards(T, H, 22*k), L0 = towards(T, H, 7*k);
    drawRod(ctx, Qp, C0, 10*k, 10*k, PENCIL_BODY);
    drawRod(ctx, C0, L0, 10*k, 3.6*k, WOOD);
    drawRod(ctx, L0, T, 3.6*k, 0.9*k, [[0,'#111827'],[.5,toHex(S.color)],[1,'#111827']], 'rgba(0,0,0,.6)');
    // نوار رنگ روی مداد
    drawRod(ctx, towards(Qp, T, 8*k), towards(Qp, T, 13*k), 10.5*k, 10.5*k, shadeStops(S.color), 'rgba(0,0,0,.3)');
  }
  // بست فلزی
  drawRod(ctx, towards(Q, H, 5*k), towards(Q, T, 5*k), 15*k, 15*k, STEEL_DARK);
  metalBall(ctx, Q.x - u.y*8.5*k, Q.y + u.x*8.5*k, 3.2*k);

  // دسته و لولا
  drawRod(ctx, H, K, 9*k, 11*k, STEEL);
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
  for(let i=1; i<=4; i++){
    const y = H.y - 8*k - i*4.5*k;
    ctx.beginPath(); ctx.moveTo(H.x - 5*k, y); ctx.lineTo(H.x + 5*k, y); ctx.stroke();
  }
  metalBall(ctx, K.x, K.y, 6*k, '#d7dde3');
  metalBall(ctx, H.x, H.y, 11*k, '#cfd6dd');
  ctx.beginPath(); ctx.arc(H.x, H.y, 3.6*k, 0, TAU); ctx.fillStyle = '#6b7280'; ctx.fill();
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 1.2*k;
  ctx.beginPath(); ctx.moveTo(H.x - 2.6*k, H.y - 1.4*k); ctx.lineTo(H.x + 2.6*k, H.y + 1.4*k); ctx.stroke();

  // هاله‌ی بخشِ زیر اشاره‌گر
  if(part){
    const spot = part === 'pencil' ? T : part === 'knob' ? along(H, K, .6) : P;
    ctx.save();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(59,110,245,.9)';
    ctx.shadowColor = 'rgba(59,110,245,.6)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(spot.x, spot.y, part === 'knob' ? 16*k : 13, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // اندازه‌ها
  if(active && part === 'pencil'){
    ctx.save();
    ctx.setLineDash([4,4]); ctx.lineWidth = 1.2;
    ctx.strokeStyle = S.dark ? 'rgba(255,255,255,.8)' : 'rgba(59,110,245,.9)';
    ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(T.x, T.y); ctx.stroke();
    ctx.restore();
    const n = { x:-(T.y - P.y), y:T.x - P.x }, nl = Math.hypot(n.x, n.y) || 1;
    const sgn = n.y > 0 ? 1 : -1;
    pill(ctx, M.x + n.x/nl*22*sgn, M.y + n.y/nl*22*sgn, 'شعاع ' + faNum(c.r/UNIT, 1) + ' سانتی‌متر');
  } else if(active && part === 'knob' && ink.trail){
    pill(ctx, T.x, T.y + 26, faNum(Math.abs(ink.trail.sweep*R2D), 0) + '°');
  } else if(INST.anim && ink.trail){
    pill(ctx, T.x, T.y + 26, faNum(Math.abs(ink.trail.sweep*R2D), 0) + '°');
  }
}

/* ---- رسم نقاله‌ی سه‌بعدی (پلاستیک شفاف) ---- */
function drawProtractor(ctx){
  const pr = INST.prot, f = protFrame(), R = f.R, k = f.k, full = pr.full;
  const base = full ? 0 : 20*k, Rin = R*0.36;
  const active = G.mode === 'instrument' && G.inst && G.inst.inst === 'prot';
  const part = active ? G.inst.part : (S.instHover && S.instHover.inst === 'prot' ? S.instHover.part : null);

  ctx.save();
  ctx.translate(f.C.x, f.C.y);
  ctx.rotate(-f.rot);

  const body = new Path2D();
  if(full){
    body.arc(0, 0, R, 0, TAU);
    body.moveTo(Rin, 0); body.arc(0, 0, Rin, 0, TAU);
  } else {
    body.moveTo(-R, base); body.lineTo(-R, 0);
    body.arc(0, 0, R, Math.PI, TAU);
    body.lineTo(R, base); body.closePath();
    body.moveTo(Rin, -6*k); body.arc(0, -6*k, Rin, 0, Math.PI, true); body.closePath();
  }
  // بدنه با سایه
  const gr = ctx.createLinearGradient(0, -R, 0, base || R);
  gr.addColorStop(0, 'rgba(236,248,255,.6)'); gr.addColorStop(1, 'rgba(180,222,248,.5)');
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 16*k; ctx.shadowOffsetX = 4*k; ctx.shadowOffsetY = 8*k;
  ctx.fillStyle = gr; ctx.fill(body, 'evenodd');
  ctx.restore();
  // درخشش
  ctx.save();
  ctx.clip(body, 'evenodd');
  const gl = ctx.createLinearGradient(-R, -R, R*0.3, R*0.2);
  gl.addColorStop(0, 'rgba(255,255,255,.6)'); gl.addColorStop(.42, 'rgba(255,255,255,.1)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(-R, -R, 2*R, R + (base || R));
  ctx.restore();
  // لبه‌ها
  ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(14,116,144,.85)'; ctx.stroke(body);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath();
  if(full) ctx.arc(0, 0, R - 3*k, 0, TAU); else ctx.arc(0, 0, R - 3*k, Math.PI, TAU);
  ctx.stroke();

  // درجه‌بندی
  const maxD = full ? 359 : 180, minor = R > 110;
  const tick = (len, w, filter)=>{
    ctx.lineWidth = w; ctx.beginPath();
    for(let d=0; d<=maxD; d++){
      if(!filter(d)) continue;
      const c = Math.cos(d*D2R), s = -Math.sin(d*D2R);
      ctx.moveTo(c*(R - 1.5), s*(R - 1.5)); ctx.lineTo(c*(R - 1.5 - len), s*(R - 1.5 - len));
    }
    ctx.stroke();
  };
  ctx.strokeStyle = 'rgba(12,74,110,.9)';
  if(minor) tick(6*k, 0.8, d => d % 5 !== 0);
  tick(10*k, 1, d => d % 5 === 0 && d % 10 !== 0);
  tick(16*k, 1.4, d => d % 10 === 0);
  // خط پایه و مرکز
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(12,74,110,.8)';
  ctx.beginPath(); ctx.moveTo(-R + 2, 0); ctx.lineTo(R - 2, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -9*k); ctx.lineTo(0, 9*k); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 3*k, 0, TAU); ctx.stroke();

  // اعداد
  const fs = Math.round(clamp(10.5*k, 8, 17));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  try{ ctx.direction = 'ltr'; }catch(e){}
  for(let d=0; d<=maxD; d+=10){
    const q = polar(d, R - 26*k);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate((90 - d)*D2R);
    ctx.font = 'bold ' + fs + 'px Tahoma, sans-serif'; ctx.fillStyle = '#0c4a6e';
    ctx.fillText(faNum(d, 0), 0, 0);
    ctx.restore();
    if(!full && R > 90){
      const q2 = polar(d, R - 41*k);
      ctx.save(); ctx.translate(q2.x, q2.y); ctx.rotate((90 - d)*D2R);
      ctx.font = Math.max(7, fs - 2) + 'px Tahoma, sans-serif'; ctx.fillStyle = '#be123c';
      ctx.fillText(faNum(180 - d, 0), 0, 0);
      ctx.restore();
    }
  }

  // بازوی اندازه‌گیری
  const am = pr.arm, rw = Math.max(Rin*0.85, 24*k);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, rw, 0, -am*D2R, true); ctx.closePath();
  ctx.fillStyle = 'rgba(225,29,72,.16)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, rw, 0, -am*D2R, true);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(225,29,72,.85)'; ctx.stroke();
  const kn = polar(am, R + 22*k);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(kn.x, kn.y);
  ctx.lineWidth = 2.2; ctx.strokeStyle = '#e11d48'; ctx.stroke();
  metalBall(ctx, kn.x, kn.y, 9*k, '#fb7185');
  if(part === 'arm'){
    ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(225,29,72,.8)';
    ctx.beginPath(); ctx.arc(kn.x, kn.y, 14*k, 0, TAU); ctx.stroke(); ctx.restore();
  }

  // دستگیره‌ی چرخش
  const rh = protRotHandle(f);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 5;
  ctx.beginPath(); ctx.arc(rh.x, rh.y, 11*k, 0, TAU);
  ctx.fillStyle = part === 'rotate' ? '#eaf0ff' : '#ffffff'; ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.4; ctx.strokeStyle = '#3b6ef5';
  ctx.beginPath(); ctx.arc(rh.x, rh.y, 11*k, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1.8*k;
  ctx.beginPath(); ctx.arc(rh.x, rh.y, 5.5*k, -Math.PI*0.2, Math.PI*1.3); ctx.stroke();
  const ah = { x:rh.x + 5.5*k*Math.cos(-Math.PI*0.2), y:rh.y + 5.5*k*Math.sin(-Math.PI*0.2) };
  ctx.beginPath(); ctx.moveTo(ah.x + 3*k, ah.y - 2.5*k); ctx.lineTo(ah.x, ah.y); ctx.lineTo(ah.x - 3.2*k, ah.y - 1.5*k); ctx.stroke();

  if(part === 'body'){
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(59,110,245,.7)'; ctx.stroke(body);
  }
  ctx.restore();

  // عدد زاویه
  const lp = protToScreen(polar(am/2, rw + 18*k), f);
  pill(ctx, lp.x, lp.y, faNum(am, am % 1 ? 1 : 0) + '°', 'rgba(190,18,60,.92)');
  if(active && G.inst.part === 'rotate') pill(ctx, f.C.x, f.C.y + base + 60*k, 'چرخش ' + faNum(pr.rot, pr.rot % 1 ? 1 : 0) + '°');
}

/* ---- لیزر ---- */
function drawLaser(ctx){
  if(!ov.pts.length) return false;
  const LIFE = 1200, now = performance.now();
  ov.pts = ov.pts.filter(p => now - p.t < LIFE || S.laserActive && p === ov.pts[ov.pts.length - 1]);
  if(!ov.pts.length) return false;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,45,45,.9)'; ctx.shadowBlur = 8;
  if(ov.pts.length >= 2){
    ctx.lineWidth = 4;
    for(let i=0; i<ov.pts.length - 1; i++){
      const a = ov.pts[i], b = ov.pts[i+1];
      const alpha = clamp(1 - (now - (a.t + b.t)/2)/LIFE, 0, 1);
      if(alpha <= 0) continue;
      ctx.strokeStyle = 'rgba(255,45,45,' + (0.95*alpha).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  const h = ov.pts[ov.pts.length - 1];
  const alpha = S.laserActive ? 1 : clamp(1 - (now - h.t)/LIFE, 0, 1);
  ctx.fillStyle = 'rgba(255,45,45,' + (0.95*alpha).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, 4.5, 0, TAU); ctx.fill();
  ctx.restore();
  return true;
}

/* ============================================================
   خطوط هم‌راستایی و چسبیدن هنگام جابجایی اشیا
============================================================ */
function onObjectMoving(o){
  if(!o) return;
  if(isSmart(o)){
    const z = canvas.getZoom();
    const s = nearestSnap(o.getCenterPoint(), collectSnapPoints(o), 10/z);
    if(s){ o.set({ left:s.x, top:s.y }); o.setCoords(); }
    S.snapMark = s;
    return;
  }
  updateGuides(o);
}
function updateGuides(obj){
  if(S.tool !== 'select' || (obj.lockMovementX && obj.lockMovementY)) return;
  const all = canvas.getObjects();
  if(all.length > 600){ ov.guides = []; return; }
  const z = canvas.getZoom(), th = 6/z;
  const members = obj.type === 'activeSelection' ? new Set(obj.getObjects()) : null;
  const r = obj.getBoundingRect(true, true);
  const mine = { l:r.left, r:r.left + r.width, t:r.top, b:r.top + r.height, cx:r.left + r.width/2, cy:r.top + r.height/2 };
  let bestV = null, bestH = null;
  for(const q of all){
    if(q === obj || (members && members.has(q))) continue;
    const rq = q.getBoundingRect(true, true);
    const cand = { l:rq.left, r:rq.left + rq.width, t:rq.top, b:rq.top + rq.height, cx:rq.left + rq.width/2, cy:rq.top + rq.height/2 };
    for(const [a, b] of [[mine.cx,cand.cx],[mine.l,cand.l],[mine.r,cand.r]]){
      const d = b - a;
      if(Math.abs(d) < th && (!bestV || Math.abs(d) < Math.abs(bestV.delta))) bestV = { delta:d, pos:b };
    }
    for(const [a, b] of [[mine.cy,cand.cy],[mine.t,cand.t],[mine.b,cand.b]]){
      const d = b - a;
      if(Math.abs(d) < th && (!bestH || Math.abs(d) < Math.abs(bestH.delta))) bestH = { delta:d, pos:b };
    }
  }
  if(bestV) obj.set('left', obj.left + bestV.delta);
  if(bestH) obj.set('top', obj.top + bestH.delta);
  ov.guides = [];
  if(bestV || bestH){
    obj.setCoords();
    if(bestV) ov.guides.push({ v:true, x:bestV.pos });
    if(bestH) ov.guides.push({ h:true, y:bestH.pos });
  }
}
function clearGuides(){ if(ov.guides.length){ ov.guides = []; ovKick(); } }

function updateCtxBar(){
  if(!canvas || !els.ctxBar) return;
  const o = canvas.getActiveObject();
  let mode = null;
  if(o && o.type === 'wbArc') mode = 'arc';
  else if(o && o.type === 'wbAngle') mode = 'angle';
  else if(o && netList().length) mode = 'net';
  else if(o && o.wbFrac) mode = 'frac';
  else if(o && !o.isEditing) mode = 'obj';
  else if(INST.focus === 'compass' && INST.compass.on) mode = 'compass';
  else if(INST.focus === 'prot' && INST.prot.on) mode = 'prot';
  else if(INST.compass.on) mode = 'compass';
  else if(INST.prot.on) mode = 'prot';
  if(mode !== cb.mode){
    cb.mode = mode;
    els.ctxBar.innerHTML = mode ? CTX_TPL[mode]() : '';
    els.ctxBar.classList.toggle('open', !!mode);
  }
  fillCtx();
}
function fillCtx(){
  if(!cb.mode) return;
  const o = canvas.getActiveObject();
  const setV = (k, v)=>{
    const inp = els.ctxBar.querySelector(`[data-k="${k}"]`);
    if(inp && document.activeElement !== inp) inp.value = v;
  };
  const on = (a, v)=>{ const b = els.ctxBar.querySelector(`[data-a="${a}"]`); if(b) b.classList.toggle('on', !!v); };
  if(cb.mode === 'compass'){
    setV('r', numStr(INST.compass.r/UNIT, 1));
    setV('sweep', numStr(INST.compass.sweepPref, 1));
  } else if(cb.mode === 'prot'){
    setV('arm', numStr(INST.prot.arm, 1));
    setV('rot', numStr(INST.prot.rot, 1));
    on('full', INST.prot.full);
  } else if(cb.mode === 'arc' && o){
    setV('r', numStr(o.radius/UNIT, 2));
    setV('start', numStr(o.startAngle, 1));
    setV('sweep', numStr(o.sweep, 1));
    on('full', o.isFull()); on('center', o.showCenter);
  } else if(cb.mode === 'angle' && o){
    setV('deg', numStr(o.measure(), 1));
    on('label', o.showLabel); on('marker', o.showMarker);
  } else if(cb.mode === 'frac' && o){
    const { k, n } = fracStats(o), dec = o.wbFrac.dec;
    const st = els.ctxBar.querySelector('[data-info="stat"]');
    if(st) st.textContent = 'رنگی: ' + faNum(k, 0) + ' از ' + faNum(n, 0) + (dec ? ' = ' + faNum(k/n, dec) : '');
    const lab = o.getObjects().find(x=> x.wbRole === 'fracLabel');
    on('flabel', lab && lab.visible);
  } else if(cb.mode === 'net'){
    const L = netList(), n1 = L[0];
    if(!n1) return;
    const many = L.length > 1, q = sel => els.ctxBar.querySelector(sel);
    const nm = q('[data-info="netname"]');
    if(nm) nm.textContent = '📦 ' + (many ? faNum(L.length, 0) + ' گسترده' : n1.netName());
    const tb = q('[data-a="nettoggle"]');
    if(tb) tb.textContent = (netGoal(n1, 'fold') >= 0.5 ? '📂 باز کردن' : '📦 بستن') + (many ? ' همه' : '');
    setV('fold', String(Math.round(n1.fold*100)));
    on('netview', n1.autoCam); on('netcolor', n1.colorful);
    const clr = q('[data-a="netclear"]');
    if(clr) clr.style.display = L.some(x=> x.faceColors && x.faceColors.some(Boolean)) ? '' : 'none';
    const cube = q('[data-info="cube"]'), one = !many && n1.kind === 'cube';
    if(cube) cube.style.display = one ? '' : 'none';
    if(one) setV('variant', String(n1.variant));
  }
}
function netChanged(){
  netSelRefresh();
  canvas.requestRenderAll();
  saveHistoryDebounced();
}
function smartChanged(o){
  o.setCoords();
  canvas.requestRenderAll();
  saveHistoryDebounced();
}
function ctxApply(k, val){
  const o = canvas.getActiveObject();
  if(cb.mode === 'compass'){
    const c = INST.compass;
    if(k === 'r' && val > 0) c.r = clamp(val*UNIT, UNIT*0.2, UNIT*60);
    if(k === 'sweep') c.sweepPref = clamp(val, -360, 360);
    ovRender();
  } else if(cb.mode === 'prot'){
    const pr = INST.prot;
    if(k === 'arm') pr.arm = pr.full ? normDeg(val) : clamp(val, 0, 180);
    if(k === 'rot') pr.rot = normDeg(val);
    ovRender();
  } else if(cb.mode === 'arc' && o){
    if(k === 'r' && val > 0) o.set('radius', clamp(val*UNIT, 2, UNIT*200));
    if(k === 'start') o.set('startAngle', normDeg(val));
    if(k === 'sweep' && val !== 0) o.set('sweep', clamp(Math.abs(val), 0.5, 360));
    smartChanged(o);
  } else if(cb.mode === 'angle' && o){
    if(k === 'deg') o.setMeasure(val);
    smartChanged(o);
  } else if(cb.mode === 'net'){
    const L = netList();
    if(k === 'fold') L.forEach(x=>{ netStop(x, ['fold']); x.setNetState({ fold:clamp(val/100, 0, 1) }); });
    if(k === 'variant' && L.length === 1 && L[0].kind === 'cube') L[0].setVariant(val);
    netChanged();
    fillCtx();
  }
}
function bindCtxBar(){
  const bar = els.ctxBar;
  bar.addEventListener('input', e=>{
    const k = e.target.dataset && e.target.dataset.k;
    if(!k) return;
    const v = parseNum(e.target.value);
    if(isFinite(v)) ctxApply(k, v);
  });
  bar.addEventListener('change', ()=> fillCtx());
  bar.addEventListener('focusout', ()=> setTimeout(fillCtx, 0));
  bar.addEventListener('keydown', e=>{ if(e.key === 'Enter') e.target.blur(); });
  bar.addEventListener('click', e=>{
    const b = e.target.closest('[data-a]');
    if(!b) return;
    const a = b.dataset.a, o = canvas.getActiveObject();
    if(a === 'mirror' || a === 'water'){ reflectSelection(a); return; }
    if(cb.mode === 'frac' && o){
      if(a === 'bucket'){ setTool('bucket'); return; }
      flushHistory();
      if(a === 'flabel'){
        const lab = o.getObjects().find(x=> x.wbRole === 'fracLabel');
        if(lab){ lab.set('visible', !lab.visible); updateFracLabel(o); }
      } else if(a === 'fclear'){
        fracParts(o).forEach(x=> x.set('fill', null));
        updateFracLabel(o);
      }
      canvas.requestRenderAll();
      saveHistory();
      fillCtx();
      return;
    }
    if(cb.mode === 'compass'){
      if(a === 'circle') compassAuto(360);
      else if(a === 'arc') compassAuto(INST.compass.sweepPref || 90);
      else if(a === 'close') toggleCompass(false);
    } else if(cb.mode === 'prot'){
      const pr = INST.prot;
      if(a === 'mkangle') angleFromProtractor();
      else if(a === 'full'){ pr.full = !pr.full; if(!pr.full) pr.arm = clamp(pr.arm > 180 ? 360 - pr.arm : pr.arm, 0, 180); ovRender(); }
      else if(a === 'close') toggleProtractor(false);
    } else if(cb.mode === 'arc' && o){
      if(a === 'full') o.set('sweep', 360);
      else if(a === 'center') o.set('showCenter', !o.showCenter);
      smartChanged(o);
    } else if(cb.mode === 'net'){
      const L = netList();
      if(!L.length) return;
      if(a === 'nettoggle') netToggle(L);
      else if(a === 'netrotL') L.forEach(x=> netRotate(x, 45));
      else if(a === 'netrotR') L.forEach(x=> netRotate(x, -45));
      else if(a === 'netbucket'){ setTool('bucket'); status('🪣 روی هر وجهِ گسترده بزنید تا رنگی شود؛ دوباره با همان رنگ = پاک'); return; }
      else {
        flushHistory();
        if(a === 'netview') L.forEach(x=>{ netStop(x, ['yaw','elev']); x.setNetState({ autoCam:true, yaw:NET_YAW, elev:NET_ELEV }); });
        else if(a === 'netcolor'){ const v = !L[0].colorful; L.forEach(x=> x.set('colorful', v)); }
        else if(a === 'netclear') L.forEach(x=> x.set('faceColors', null));
        else if(a === 'netnext' && L.length === 1 && L[0].kind === 'cube') L[0].setVariant(L[0].variant + 1);
        netChanged();
      }
    } else if(cb.mode === 'angle' && o){
      if(a === 'inc' || a === 'dec'){
        o.setMeasure(clamp(Math.round(o.measure()) + (a === 'inc' ? 1 : -1), 0, 359));
      }
      else if(a === 'flip') mirrorAngle(o);
      else if(a === 'label') o.set('showLabel', !o.showLabel);
      else if(a === 'marker') o.set('showMarker', !o.showMarker);
      smartChanged(o);
    }
    fillCtx();
  });
}

function addAndSelect(o){
  flushHistory();
  if(S.tool !== 'select') setTool('select');

  canvas.setActiveObject(o);

function angleFromProtractor(){
  const pr = INST.prot;
  if(pr.arm < 0.5){ toast('ابتدا بازوی قرمز نقاله را روی زاویه‌ی موردنظر ببرید'); return; }
  const len = pr.R*1.12;
  const o = new fabric.WbAngle({
    left:pr.x, top:pr.y, a1:normDeg(pr.rot), a2:normDeg(pr.rot + pr.arm), len1:len, len2:len, reflex:pr.arm > 180,
    stroke:S.color, strokeWidth:Math.max(2, S.width), opacity:S.opacity, fontFamily:S.font
  });
  addAndSelect(o);
  toast('∠ زاویه‌ی ' + faNum(pr.arm, 1) + '° رسم شد');
}

function promptDialog(title, fields){
  return new Promise(resolve=>{
    let wrap = document.getElementById('dialogOverlay');
    if(!wrap){
      wrap = document.createElement('div');
      wrap.id = 'dialogOverlay';
      document.body.appendChild(wrap);
    }
    wrap.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'dialogBox';
    const h = document.createElement('div');
    h.className = 'dialogTitle';
    h.textContent = title;
    box.appendChild(h);
    const inputs = {}, rows = {}, choice = {};
    const shown = f => !f.showIf || f.showIf(choice);
    const refreshRows = ()=> fields.forEach(f=>{ rows[f.key].style.display = shown(f) ? '' : 'none'; });
    fields.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('label');
      lab.textContent = f.label;
      row.appendChild(lab);
      if(f.type === 'choice' || f.type === 'pick'){
        // انتخاب حالت (دکمه‌های کنار هم؛ pick = جدولِ تصویرها)
        choice[f.key] = f.value;
        const seg = document.createElement('div');
        seg.className = f.type === 'pick' ? 'pickgrid' : 'seg';
        if(f.type === 'pick') row.classList.add('col');
        f.options.forEach(op=>{
          const b = document.createElement('button');
          b.type = 'button';
          if(op.html) b.innerHTML = op.html; else b.textContent = op.t;
          if(op.title) b.title = op.title;
          b.classList.toggle('on', op.v === f.value);
          b.addEventListener('click', ()=>{
            choice[f.key] = op.v;
            seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x === b));
            if(f.onPick) f.onPick(op.v, inputs);
            refreshRows();
          });
          seg.appendChild(b);
        });
        row.appendChild(seg);
      } else {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
        inp.value = f.value;
        inp.addEventListener('input', ()=>{ inp.dataset.touched = '1'; });
        row.appendChild(inp);
        inputs[f.key] = inp;
      }
      box.appendChild(row);
      rows[f.key] = row;
    });
    refreshRows();
    const btns = document.createElement('div');
    btns.className = 'dialogBtns';
    const okB = document.createElement('button');
    okB.textContent = '✅ ساختن';
    const cx = document.createElement('button');
    cx.textContent = 'انصراف';
    btns.appendChild(okB); btns.appendChild(cx);
    box.appendChild(btns);
    wrap.appendChild(box);

    let closed = false;
    const close = vals=>{
      if(closed) return;
      closed = true;
      wrap.classList.remove('open');
      document.removeEventListener('keydown', keyH, true);
      resolve(vals);
    };
    const submit = ()=>{
      const vals = {};
      for(const f of fields){
        if(f.type === 'choice' || f.type === 'pick'){ vals[f.key] = choice[f.key]; continue; }
        if(!shown(f)){ vals[f.key] = null; continue; }
        let v = parseNum(inputs[f.key].value);
        if(!isFinite(v)){ toast('لطفاً مقدار عددی وارد کنید'); inputs[f.key].focus(); return; }
        v = clamp(v, f.min, f.max);
        if(f.int) v = Math.round(v);
        vals[f.key] = v;
      }
      close(vals);
    };
    const keyH = e=>{
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(null); }
      else if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); submit(); }
    };
    document.addEventListener('keydown', keyH, true);
    okB.addEventListener('click', submit);
    cx.addEventListener('click', ()=> close(null));
    wrap.addEventListener('click', e=>{ if(e.target === wrap) close(null); });
    wrap.classList.add('open');
    const first = fields.find(f=> f.type !== 'choice' && f.type !== 'pick' && shown(f));
    if(first){ inputs[first.key].focus(); inputs[first.key].select(); }
  });
}
