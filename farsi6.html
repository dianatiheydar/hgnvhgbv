:root{
  --bg1:#7b5cff; --bg2:#5b8bff; --bg3:#ff7ab8;
  --ink:#2d2a45; --ink2:#6b6884; --card:#ffffff; --line:#eee9fb;
  --gold:#ffb020; --green:#1fb978; --red:#ff5d5d; --blue:#38a1f0; --purple:#8e5cf7; --teal:#00b8a9; --pink:#ff6fae;
  --r:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;
  font-family:'Yekan','B Yekan',Vazirmatn,Tahoma,sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,#8a63f5 34%,var(--bg2) 68%,#4f8df0 100%);
  color:var(--ink); direction:rtl; overflow-x:hidden;
  background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
 background:radial-gradient(circle at 15% 12%, rgba(255,255,255,.22) 0 90px, transparent 91px),
            radial-gradient(circle at 88% 8%, rgba(255,255,255,.16) 0 130px, transparent 131px),
            radial-gradient(circle at 92% 88%, rgba(255,255,255,.14) 0 110px, transparent 111px),
            radial-gradient(circle at 6% 86%, rgba(255,255,255,.14) 0 120px, transparent 121px);
}
/* ---------- App frame ---------- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:104px 14px 118px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 4px 14px}
.topbar .logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#ffd76e,#ff9d4d);
 display:grid;place-items:center;font-size:28px;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:pop .6s ease}
.topbar h1{font-size:21px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.18);line-height:1.4}
.topbar h1 small{display:block;font-size:12px;font-weight:normal;opacity:.92}
.topbar .sound{margin-right:auto;width:42px;height:42px;border:none;border-radius:14px;background:rgba(255,255,255,.22);
 color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 10px 28px rgba(40,30,90,.16);margin-bottom:14px;border:1px solid rgba(255,255,255,.6)}
.card.hero{background:linear-gradient(135deg,#fff 0%,#fff7ea 100%);overflow:hidden;position:relative}
.card.hero .emoji-float{position:absolute;font-size:44px;opacity:.9;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.hero h2{font-size:18px;margin-bottom:6px}
.hero p{color:var(--ink2);font-size:13.5px;line-height:1.9}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:bold;color:#fff;
 box-shadow:0 6px 14px rgba(0,0,0,.14)}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;margin:18px 4px 10px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.section-title .n{background:rgba(255,255,255,.28);border-radius:12px;padding:3px 10px;font-size:12.5px}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
 border-radius:18px;padding:13px 20px;font-size:15px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--purple),#b06ef5);
 box-shadow:0 8px 20px rgba(120,70,220,.35);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.95)}
.btn.small{padding:9px 14px;font-size:13px;border-radius:14px}
.btn.gold{background:linear-gradient(135deg,#ffb020,#ff8a3d);box-shadow:0 8px 20px rgba(255,150,40,.35)}
.btn.green{background:linear-gradient(135deg,#22c07e,#149a63);box-shadow:0 8px 20px rgba(30,180,110,.35)}
.btn.blue{background:linear-gradient(135deg,#3aa4f5,#2a7fe0);box-shadow:0 8px 20px rgba(50,150,240,.35)}
.btn.pink{background:linear-gradient(135deg,#ff6fae,#f5478c);box-shadow:0 8px 20px rgba(250,80,150,.35)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(40,30,90,.12)}
.btn.tomato{background:linear-gradient(135deg,#ff7a59,#f5474d);box-shadow:0 8px 20px rgba(250,90,80,.35)}
.btn.rowlink{width:100%;justify-content:flex-start;border-radius:18px;background:#f6f2ff;color:var(--ink);box-shadow:none;font-size:14px;padding:13px 15px;margin-bottom:9px}
.btn.rowlink .ic{font-size:20px;margin-left:4px}
.btn.rowlink .go{margin-right:auto;color:var(--purple);font-size:17px}
/* ---------- Chapter cards ---------- */
.chap{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:22px;color:#fff;cursor:pointer;
 box-shadow:0 10px 24px rgba(0,0,0,.16);margin-bottom:12px;transition:transform .15s;position:relative;overflow:hidden}
.chap:active{transform:scale(.97)}
.chap .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:26px;flex:none}
.chap h3{font-size:16px;margin-bottom:3px}
.chap p{font-size:12px;opacity:.92}
.chap .count{margin-right:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap}
/* lesson rows */
.lesson{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 14px;margin-bottom:10px;cursor:pointer;
 box-shadow:0 8px 20px rgba(40,30,90,.13);border:1px solid #f0ecfa;transition:transform .15s}
.lesson:active{transform:scale(.97)}
.lesson .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;color:#fff}
.lesson b{font-size:14.5px;display:block;margin-bottom:2px}
.lesson span{font-size:11.5px;color:var(--ink2)}
.lesson .tag{margin-right:auto;font-size:11px;background:#f2edfd;color:var(--purple);padding:4px 10px;border-radius:999px;white-space:nowrap}
/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;top:0;bottom:auto;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.bottomnav .in{pointer-events:auto;max-width:520px;width:calc(100% - 22px);margin-top:12px;display:flex;background:rgba(255,255,255,.96);
 backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 12px 34px rgba(20,15,60,.28);padding:8px;gap:4px}
.bottomnav button{flex:1;border:none;background:transparent;font-family:inherit;color:var(--ink2);border-radius:20px;padding:8px 2px 7px;
 font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
.bottomnav button .bi{font-size:21px;transition:transform .2s}
.bottomnav button.on{background:linear-gradient(135deg,#f2ecff,#ffeef6);color:var(--purple);font-weight:bold}
.bottomnav button.on .bi{transform:translateY(-2px) scale(1.12)}
/* ---------- Sheet (lesson) ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:linear-gradient(170deg,#efeaff,#fdf3f7);overflow-y:auto;overscroll-behavior:contain;
 transform:translateY(102%);transition:transform .32s cubic-bezier(.22,.9,.3,1);border-radius:30px 30px 0 0}
.sheet.open{transform:translateY(0)}
/* حالتِ جاسازی‌شده در صفحه */
#fa6root .sheet{position:relative;inset:auto;height:auto;max-height:none;overflow:visible;
 transform:none;transition:none;border-radius:22px;display:none}
#fa6root .sheet.open{display:block}
#fa6root.sheetopen #app{display:none}
.sheet .grab{width:52px;height:6px;border-radius:99px;background:#d8cef2;margin:12px auto 4px}
.sheet .smain{max-width:520px;margin:0 auto;padding:6px 14px 40px}
.shead{display:flex;align-items:center;gap:12px;padding:10px 2px 14px}
.shead .back{width:42px;height:42px;border:none;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(40,30,90,.14);font-size:20px;cursor:pointer;font-family:inherit}
.shead .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;color:#fff}
.shead h2{font-size:17px;flex:1;line-height:1.5}
.shead .sub{font-size:11.5px;color:var(--ink2);font-weight:normal}
.panel{background:#fff;border-radius:22px;padding:16px;margin-bottom:13px;box-shadow:0 8px 22px rgba(40,30,90,.1);border:1px solid #f2eefc}
.panel .ptitle{display:flex;align-items:center;gap:9px;font-size:14.5px;margin-bottom:11px}
.panel .ptitle .pic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:#fff;flex:none}
.panel p.txt{font-size:13.5px;line-height:2.1;color:#3c3857}
.panel .tip{background:#fff8e8;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:2;color:#7a5b12;margin-top:10px}
.panel.apanel{background:linear-gradient(135deg,#f5f0ff,#fdf0f7)}
.avplayer{width:100%;height:42px;border-radius:99px;display:block}
/* flip words */
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.wcard{perspective:800px;height:66px;cursor:pointer}
.wcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.wcard.flip .inner{transform:rotateY(180deg)}
.wface{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;text-align:center;padding:6px 8px;font-size:13px;font-weight:bold}
.wfront{background:linear-gradient(135deg,#f0eaff,#fdeeff);color:#5a3fb8}
.wback{background:linear-gradient(135deg,#3fbf8c,#1f9e6e);color:#fff;transform:rotateY(180deg);font-size:12px;line-height:1.7}
/* chips (هم خانواده) */
.famwrap{display:flex;flex-wrap:wrap;gap:8px}
.fam{background:linear-gradient(135deg,#e3f6ff,#e9f0ff);border-radius:14px;padding:9px 12px;font-size:13px;color:#1f5f9e;line-height:1.8}
.fam b{color:#123c6b}
/* تضاد */
.opp{display:flex;flex-wrap:wrap;gap:8px}
.op{background:#fff0f0;border:1.5px dashed #ffb4b4;border-radius:14px;padding:8px 12px;font-size:13px;color:#c0392b;font-weight:bold}
.op em{font-style:normal;color:#ff8a8a;margin:0 5px;font-size:11px}
/* notes accordion */
.acc{border-radius:16px;overflow:hidden;margin-bottom:9px;border:1px solid #efe9fb;background:#fbf9ff}
.acc .head{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer;font-size:13.5px;font-weight:bold}
.acc .head .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.acc .head .arr{margin-right:auto;transition:transform .3s;font-size:12px;color:var(--ink2)}
.acc.open .head .arr{transform:rotate(180deg)}
.acc .body{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc.open .body{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-height:400px}
.acc .body .inner{padding:2px 13px 13px;font-size:13px;line-height:2.1;color:#4a4668;border-top:1px dashed #e8e2f7}
/* steps */
.step{position:relative;padding:0 0 14px 0}
.stepsbox{margin-top:4px}
.step .b{background:linear-gradient(135deg,#fff4d6,#ffe9ea);border-radius:16px;padding:11px 13px;font-size:14px;font-weight:bold;line-height:2;color:#7c4a03;box-shadow:inset 0 0 0 1.5px #ffd98f}
.step .m{background:#f1fbe9;border-radius:14px;padding:10px 12px;font-size:13px;line-height:2;color:#2f6b2f;margin-top:8px}
.step .n{background:#eef4ff;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:2.1;color:#274f8a;margin-top:8px}
.step .lbl{display:inline-block;font-size:11px;background:#fff;border-radius:99px;padding:2px 11px;margin-bottom:6px;color:#8a4baf;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.step.hidden{display:none}
.step{animation:stepin .5s ease}
@keyframes stepin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* quiz */
.qscene{min-height:100dvh;max-width:520px;margin:0 auto;padding:14px 14px 130px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qtop .back{width:40px;height:40px;border-radius:13px;border:none;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.12);font-family:inherit}
.qtop .prog{flex:1}
.qtop .pnum{color:#fff;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
.pbar{height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd76e,#ff9d4d);transition:width .4s}
.qcard{background:#fff;border-radius:26px;padding:20px 18px;box-shadow:0 14px 34px rgba(30,20,80,.2);margin-top:12px}
.qcard .qq{font-size:16px;line-height:2.1;font-weight:bold;margin-bottom:6px}
.qcard .qhint{font-size:12px;color:var(--ink2);margin-bottom:12px}
.opt{width:100%;display:flex;align-items:center;gap:11px;text-align:right;border:2px solid #ece6fb;background:#fbfaff;border-radius:18px;
 padding:13px 13px;margin-bottom:10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);transition:all .2s;line-height:1.9}
.opt .l{width:32px;height:32px;border-radius:11px;background:#efe9fc;color:var(--purple);display:grid;place-items:center;font-size:13px;flex:none;font-weight:bold}
.opt:hover{border-color:#c9b8f5;transform:translateY(-1px)}
.opt.right{border-color:var(--green);background:#eafdf3;animation:flashg .55s}
.opt.right .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff0f0;animation:flashr .55s}
.opt.wrong .l{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
@keyframes flashg{0%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes flashr{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.feedback{border-radius:18px;padding:13px 15px;font-size:13px;line-height:2.05;margin:12px 0;animation:stepin .4s}
.feedback.good{background:#eafdf3;color:#186a44;border:1.5px solid #9fe8c4}
.feedback.bad{background:#fff3f3;color:#a03030;border:1.5px solid #ffc3c3}
.feedback .fbhead{font-weight:bold;font-size:14px;margin-bottom:4px}
/* result */
.reswrap{text-align:center;padding-top:26px}
.ring{width:190px;height:190px;margin:10px auto 16px;border-radius:50%;display:grid;place-items:center;position:relative;background:#fff;box-shadow:0 16px 40px rgba(30,20,80,.2)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{font-size:34px;font-weight:bold;color:var(--purple)}
.ring .rl{font-size:12.5px;color:var(--ink2);margin-top:-4px}
.stars{font-size:26px;letter-spacing:5px;margin:6px 0 2px}
.msg{font-size:15px;font-weight:bold;margin-bottom:4px}
.submsg{font-size:12.5px;color:var(--ink2);line-height:2;margin-bottom:16px}
.rev{text-align:right}
.rev .ritem{background:#fff;border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:0 6px 16px rgba(40,30,90,.08)}
.rev .rq{font-size:13.5px;font-weight:bold;line-height:2;margin-bottom:6px}
.rev .ra{font-size:12.5px;line-height:2}
.rev .ok{color:var(--green)} .rev .no{color:var(--red)}
/* flashcards */
.fscene{max-width:520px;margin:0 auto;padding:14px 14px 130px}
.fcardwrap{perspective:1400px;margin:14px 0}
.fcard{position:relative;width:100%;height:330px;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
.fface.front{background:linear-gradient(145deg,#8e5cf7 0%,#6a7bff 100%);color:#fff;box-shadow:0 18px 44px rgba(70,40,160,.4)}
.fface.front .w{font-size:30px;font-weight:bold;line-height:1.7}
.fface.front .hintt{font-size:13px;opacity:.85}
.fface.back{background:linear-gradient(145deg,#2fbf8c,#1a9e70);color:#fff;transform:rotateY(180deg);box-shadow:0 18px 44px rgba(20,130,90,.4)}
.fface.back .m{font-size:19px;line-height:2.1;font-weight:bold}
.fctrl{display:flex;gap:10px}
.fctrl button{flex:1}
.fmeta{display:flex;justify-content:space-between;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.25);margin-top:6px}
/* qavaed */
.qv .qa{background:#fff;border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:0 8px 22px rgba(40,30,90,.1)}
.qv .qa .h{display:flex;gap:10px;align-items:center;padding:14px;cursor:pointer;font-size:14.5px;font-weight:bold}
.qv .qa .h .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}
.qv .qa .h .x{margin-right:auto;transition:transform .3s;color:var(--ink2);font-size:13px}
.qv .qa.open .h .x{transform:rotate(180deg)}
.qv .qa .b{max-height:0;overflow:hidden;transition:max-height .4s}
.qv .qa.open .b{max-height:6000px}
.qv .qa .bi{padding:2px 15px 15px;font-size:14px;line-height:2.15;color:#454160}
.qv .ex{background:#f4f0ff;border-radius:13px;padding:9px 12px;margin-top:9px;font-size:13.5px;line-height:2;color:#5b3fae}
.qv .ex b{color:#3c1f86}
.qv .ex2{background:#eefaf3;border-radius:13px;padding:9px 12px;margin-top:9px;font-size:13.5px;line-height:2;color:#0d7a4f}
.qv .ex2 b{color:#0a5c3b}
.qv .warn{background:#fff4e8;border-radius:13px;padding:9px 12px;margin-top:9px;font-size:13.5px;line-height:2;color:#8a4b0a}
.qv .warn b{color:#6b3800}
.qv .shapewrap{display:flex;flex-direction:column;gap:6px;margin:10px 0;background:#f8f6ff;border-radius:14px;padding:12px 14px}
.qv .shapetitle{font-size:12.5px;color:#7a71a8;margin-bottom:2px;font-weight:bold}
.qv .shaperow{display:flex;align-items:center;gap:6px}
.qv .shapelbl{font-size:11.5px;color:#8a83ab;width:38px;flex:none;text-align:center}
.qv .shapebar{flex:1;height:9px;border-radius:5px;background:#e3ddf7}
.qv .shapebar.short{flex:.55}
.qv .shapebar.long{flex:1.5}
.qv .shapedot{width:11px;height:11px;border-radius:50%;background:#ddd6f5;flex:none;border:1.5px solid #cfc4f2}
.qv .shapedot.on{background:var(--sc,#8e5cf7);border-color:var(--sc,#8e5cf7)}
.qv .mc{background:linear-gradient(135deg,#fff8ec,#fffdf7);border:2px dashed #ffb545;border-radius:15px;padding:12px 14px;margin-top:11px}
.qv .mct{font-weight:bold;color:#c2680a;font-size:12.5px;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.qv .mcq{font-size:14px;color:#332a55;margin-bottom:9px;font-weight:bold;line-height:1.9}
.qv .mcopts{display:flex;flex-direction:column;gap:7px}
.qv .mcopt{background:#fff;border:1.5px solid #e3ddf7;border-radius:12px;padding:9px 13px;font-size:13.5px;cursor:pointer;transition:.15s;color:#454160}
.qv .mcopt:active{transform:scale(.97)}
.qv .mcopts.done .mcopt{cursor:default}
.qv .mcopt.right{background:#e7f8ee;border-color:#22a55d;color:#0a5c3b;font-weight:bold}
.qv .mcopt.wrong{background:#fdeaea;border-color:#e33;color:#a11212;font-weight:bold}
.qv .mcopt.dim{opacity:.45}
.qv .mcfb{display:none;margin-top:10px;background:#f4f0ff;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.9;color:#5b3fae}
.qv .mcfb.show{display:block}
/* toast */
#toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,30px);background:#2d2a45;color:#fff;padding:11px 22px;border-radius:99px;
 font-size:13px;z-index:99;opacity:0;transition:all .35s;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* confetti canvas */
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none}
/* pill selector */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:none;font-family:inherit;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:13px;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pill.on{color:#fff;background:linear-gradient(135deg,var(--purple),#b06ef5)}
.seg{display:flex;background:rgba(255,255,255,.92);border-radius:18px;padding:5px;gap:4px}
.seg button{flex:1;border:none;background:transparent;font-family:inherit;padding:10px 4px;border-radius:14px;font-size:13px;font-weight:bold;color:var(--ink2);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,#ffb020,#ff8a3d);color:#fff;box-shadow:0 6px 14px rgba(255,150,40,.35)}
.divider{height:1px;background:#efeafd;margin:13px 0}
.statrow{display:flex;gap:9px}
.stat{flex:1;background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 7px 18px rgba(40,30,90,.1)}
.stat .v{font-size:20px;font-weight:bold;color:var(--purple)}
.stat .l{font-size:11px;color:var(--ink2);margin-top:2px}
@media(min-width:520px){ body{-webkit-text-size-adjust:100%;text-size-adjust:100%;background-size:cover} }

/* ---------- تکمیلی ---------- */
.panel .ptitle{font-weight:800}
.panel .ptitle .pic{font-weight:normal}
.qcard .qq{font-weight:800}
.hero h2{font-weight:800}
.chip{font-weight:800}
/* XP */
.xpline{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:13px 15px;margin-bottom:11px;box-shadow:0 8px 20px rgba(40,30,90,.13);border:1px solid #f0ecfa}
.xpline .em{font-size:26px}
.xpbar{height:12px;background:#efe9fb;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8e5cf7,#ff6fae);border-radius:99px;transition:width .6s}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:6px}
.badge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:#fff;box-shadow:0 6px 14px rgba(40,30,90,.12);transition:transform .25s}
.badge.got{background:linear-gradient(135deg,#fff3d6,#ffe3ea)}
.badge.lock{filter:grayscale(1);opacity:.4}
.badge:hover{transform:translateY(-3px) rotate(4deg)}
/* استریک */
.streak{background:#ff5722;color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;margin-left:5px;display:inline-block;animation:pop .4s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* کاوشگر نقش‌ها */
.vw{display:inline-flex;align-items:baseline;white-space:nowrap}
.rgw{display:flex;flex-wrap:wrap;gap:.55em .85em;align-items:baseline;line-height:2.35;position:relative}
.rw{position:relative;border-bottom:3px solid var(--rc);border-radius:6px;padding:0 3px;cursor:pointer;transition:background .2s,color .2s}
.rw.act{background:var(--rc);color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.rgw.show{padding-top:3.9em;row-gap:4.2em;column-gap:1.2em}
.rgw.show .rwlbl::after{content:attr(data-role);position:absolute;top:-2.05em;right:50%;transform:translateX(50%);background:var(--rc);color:#fff;font-size:.72em;font-weight:bold;line-height:1.6;padding:3px 9px;border-radius:99px;white-space:nowrap;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.rgw.show .rwlbl.rwup::after{top:-3.75em}
.rgw.show .rwlbl.rwup::before{content:'';position:absolute;top:-2.15em;right:50%;width:2px;height:1.75em;background:var(--rc);opacity:.45;z-index:4}
.rgw.show .rw.act::after{z-index:6}
.rgctrl{display:flex;gap:8px;margin-top:10px}
.rgctrl button{flex:1;white-space:nowrap;font-size:12.5px;padding:10px 6px}
.rchips{display:none;flex-wrap:wrap;gap:7px;margin-top:11px}
.rgw.show~.rchips{display:flex}
@media(max-width:520px){
  .rgw.show{column-gap:1.5em;row-gap:4em}
  .rgw.show .rwlbl::after{font-size:.62em;padding:2px 7px}
}

/* ================= بخش‌های تازه ================= */
.acc.open .body{max-height:2400px}
.panel .ptitle{flex-wrap:wrap}
.pext{margin-right:auto;font-size:13px;color:#9a93c0;font-weight:normal;display:flex;gap:6px;align-items:center}
.pext .cnt{background:#f3efff;color:#6d4ed8;border-radius:99px;padding:3px 11px;font-weight:bold}
.hemi{display:block}
.infochips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ichip{background:#fff;border-radius:14px;padding:7px 12px;font-size:14px;box-shadow:0 5px 14px rgba(40,30,90,.1);border:1px solid #efe9fb;line-height:1.8}
.ichip em{font-style:normal;color:#8a83ab;margin-left:6px;font-size:12.5px}
.jump{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.jump button{flex:none;border:none;font-family:inherit;background:#fff;color:#5a3fb8;border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(40,30,90,.1)}
.prose .pr{background:#fffaf0;border:1px solid #f6e7c8;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.prose .prt{font-size:16.5px;line-height:2.2;color:#5a3a06;font-weight:bold}
.prose .prb{border:none;font-family:inherit;background:#fff;color:#b45309;border-radius:99px;padding:5px 13px;font-size:13px;margin-top:6px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.prose .prm{display:none;margin-top:8px;background:#f1fbe9;border-radius:12px;padding:9px 12px;font-size:15px;line-height:2.1;color:#2f6b2f}
.prose .pr.show .prm{display:block}
.fullpoem{background:linear-gradient(135deg,#f7fff9,#f2f8ff);border-radius:16px;padding:12px 14px}
.fullpoem .fp{padding:9px 4px;border-bottom:1px dashed #d8eadf;font-size:17.5px;line-height:2.1;font-weight:bold;color:#1c4a33;text-align:center}
.fullpoem .fp:last-child{border-bottom:none}
.fullpoem .hemi{display:inline-block;margin:0 10px}
.hemi.mem{cursor:pointer;background:#e3f3ea;border-radius:10px;padding:0 8px;min-width:120px}
.hemi.mem i{font-style:normal;visibility:hidden}
.hemi.mem.rev{background:transparent}.hemi.mem.rev i{visibility:visible;color:#0d8f56}
.blank{cursor:pointer;background:#ffe9b8;border-radius:8px;padding:0 6px}
.blank i{font-style:normal;visibility:hidden}
.blank.rev{background:transparent}.blank.rev i{visibility:visible;color:#c2410c}
.memctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.memtip{font-size:14px;color:#7a71a8;margin-top:8px;line-height:2}
.step .lbl.cntl{background:#e6f7fb;color:#0e7490;margin-right:6px}
.stepbtns,.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stepbtns .btn:first-child{flex:1}
.rowbtns.center{justify-content:center}
.vw.vsep{color:#c7bff0;flex-basis:100%;height:0;overflow:hidden}

.daily{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff7e0,#ffe7f0);border-radius:20px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:0 8px 20px rgba(40,30,90,.13);border:2px solid #ffd27a}

 msg:'انسان باید قدردانِ خداوند باشد؛ خدایی که بی‌هیچ چشم‌داشتی همه‌ی آفریده‌ها را آفرید و به آن‌ها نعمت بخشید. اندیشیدن در کارِ خالق و مخلوق دل را روشن می‌کند و غفلت، تاریکی و گمراهی می‌آورد.',
 prose:[
  ['این همه خلق را که شما بینید بدین چندین بسیاری، این همه را خالقی است که آفریدگارِ ایشان است و نعمت بر ایشان از وی است.','این همه آفریده را که با این فراوانی می‌بینید، آفریننده‌ای دارند که آن‌ها را آفریده و به همه‌ی آن‌ها نعمت و روزی بخشیده است.'],
  ['آفریدگار را بباید پرستیدن و بر نعمتِ او سپاس‌داری باید کردن.','شایسته است که خداوند را پرستش کنیم و برای نعمت‌هایش شکرگزار باشیم.'],
  ['اندیشه کردن اندر کارِ خالق و مخلوق، روشنایی افزاید اندر دل؛ و غفلت از این و نااندیشیدن، تاریکی افزاید اندر دل و نادانی و گمراهی است.','فکر کردن در کارِ خدا و آفریده‌هایش دل را روشن و آگاه می‌کند و بی‌توجهی و فکر نکردن، دل را تاریک می‌کند و مایه‌ی نادانی و گمراهی است.']],
 poem:[
  ['بادِ بهاری وزید از طرفِ مرغزار • باز به گردون رسید ناله‌ی هر مرغِ زار','بادِ خوشِ بهاری از سمتِ چمنزار وزید و دوباره آوازِ سوزناکِ پرندگان به آسمان بلند شد.','جمله‌ی ۱: فعل: وزید، نهاد: بادِ بهاری (نهادِ اصلی: باد)؛ از طرفِ: حرفِ اضافه، مرغزار: متمم. جمله‌ی ۲: فعل: رسید، نهاد: ناله‌ی هر مرغِ زار (نهادِ اصلی: ناله)، باز: قیدِ تکرار؛ به: حرفِ اضافه، گردون: متمم. ترکیبِ وصفی: بادِ بهاری، هر مرغ، مرغِ زار. ترکیبِ اضافی: ناله‌ی مرغ. آرایه: کنایه (به گردون رسیدن = پخش شدنِ صدا در همه‌جا)، اغراق (رسیدنِ ناله‌ی مرغ به آسمان)، تناسب (مرغزار، بادِ بهاری، ناله‌ی مرغ). قافیه: مرغزار / زار.',2],
  ['خیز و غنیمت شمار جنبشِ بادِ ربیع • ناله‌ی موزونِ مرغ، بوی خوشِ لاله‌زار','برخیز و قدرِ وزشِ بادِ بهاری، آوازِ خوش‌آهنگِ پرندگان و بوی خوشِ گل‌ها را بدان و از آن‌ها لذت ببر.','جمله‌ی ۱: فعل: خیز (امر). جمله‌ی ۲: فعل: غنیمت شمار (امر)؛ نهادِ هر دو جمله: تو (محذوف). مفعول‌ها: جنبش، ناله، بوی. ترکیبِ اضافی: جنبشِ باد، بادِ ربیع، ناله‌ی مرغ، بوی لاله‌زار. ترکیبِ وصفی: ناله‌ی موزون، بوی خوش. آرایه: تناسب (لاله‌زار، مرغ، بادِ ربیع).',2],
  ['هر گل و برگی که هست یادِ خدا می‌کند • بلبل و قمری چه خواند؟ یادِ خداوندگار','گل‌ها، برگ‌ها و پرندگان (همه‌ی موجودات) در حالِ یاد کردن و ستایشِ خداوند هستند و با او راز و نیاز می‌کنند.','جمله‌ی ۱: فعل: هست، نهاد: هر گل و برگی، مسند: «موجود» (حذف شده). جمله‌ی ۲: فعل: یاد می‌کند، نهاد: او (محذوف)؛ «یادِ خدا» ترکیبِ اضافی. جمله‌ی ۳: فعل: خواند؟، نهاد: بلبل و قمری، مفعول: چه. جمله‌ی ۴: «یادِ خداوندگار (را خواند)» ← فعلِ محذوف، مفعول: یادِ خداوندگار. آرایه: تشخیص (یادِ خدا کردنِ گل و برگ)، تناسب (گل و برگ؛ بلبل و قمری)، تلمیح (به آیه‌ی نخستِ سوره‌ی جمعه: همه‌ی موجوداتِ آسمان و زمین خدا را تسبیح می‌کنند).',4],
  ['برگِ درختانِ سبز در نظرِ هوشیار • هر ورقش دفتری است معرفتِ کردگار','از نظرِ انسانِ هوشیار و خردمند، هر برگِ درختانِ سبز مانندِ دفتری است که ما را با آفریدگار آشنا می‌کند.','فعل: است، مسند: دفتر، نهاد: برگِ درختانِ سبز (نهادِ اصلی: برگ)؛ در: حرفِ اضافه، نظر: متمم. ترکیبِ اضافی: برگِ درختان، نظرِ هوشیار، ورقش، معرفتِ کردگار. ترکیبِ وصفی: درختانِ سبز، هر ورق. آرایه: تشبیه (برگِ درخت به دفترِ معرفت)، تناسب (برگ، ورق، دفتر). نکته: این بیت با بیتِ آخرِ «ستایش» (همه عالم کتابِ حق تعالی است) ارتباطِ معنایی دارد.',1]],

  ['قالبِ غزل','غزل معمولاً ۵ تا ۱۴ بیت دارد؛ مصراعِ اول با همه‌ی مصراع‌های زوج هم‌قافیه است، بیت‌ها از نظرِ معنی مستقل‌اند و شاعر معمولاً در بیتِ آخر تخلص (نامِ شعری‌اش) را می‌آورد. قافیه‌های این غزل: مرغزار، زار، لاله‌زار، خداوندگار، کردگار.'],
  ['نهاد و گزاره','نهاد: کلمه‌ای که درباره‌اش خبر می‌دهیم. گزاره: خبری که درباره‌ی نهاد می‌دهیم و مهم‌ترین جزءِ آن فعل است. «بادِ بهاری وزید» ← نهاد: بادِ بهاری، گزاره: وزید.'],
  ['انواعِ جمله','خبری: «هوا گرم است.» — پرسشی: «حالِ شما چطور است؟» — امری: «کتاب را بیاور.» — عاطفی: «چقدر زیبا!» — دعایی: «خدا خیرت دهد.»'],
  ['مسندِ حذف‌شده','گاهی در شعر مسند حذف می‌شود: «هر گل و برگی که هست» یعنی «هر گل و برگی که (موجود) هست».'],
  ['حکایتِ درس: دو دوست','دو دوست در سفر بودند؛ یکی دیگری را آزرد و او روی شن نوشت. کمی بعد در برکه‌ای لغزید و دوستش نجاتش داد؛ این بار روی صخره حک کرد. پیام: بدی‌های دوستان را زود فراموش کن و خوبی‌هایشان را همیشه به یاد داشته باش.']],
 arts:['کنایه: «به گردون رسید» یعنی صدا همه‌جا پخش شد.','اغراق: رسیدنِ ناله‌ی مرغ به آسمان.','تشخیص: یادِ خدا کردنِ گل و برگ و بلبل و قمری.','تشبیه: برگِ درختان به دفترِ معرفت.','تناسب: مرغزار، بادِ بهاری، گل، برگ، بلبل، قمری.','تلمیح: اشاره به آیه‌ای از قرآن که همه‌ی موجودات را تسبیح‌گوی خدا می‌داند.'],

  ['گر از عهدِ خُردیت یاد آمدی • که بیچاره بودی در آغوشِ من','(مادری به فرزندِ نیرومندش می‌گوید:) اگر دورانِ کودکی‌ات را به یاد می‌آوردی که در آغوشِ من ناتوان و درمانده بودی…','جمله‌ی ۱: فعل: یاد آمدی (= یاد می‌آمد)، «گر»: حرفِ شرط. جمله‌ی ۲: فعل: بودی، نهاد: تو، مسند: بیچاره؛ در: حرفِ اضافه، آغوش: متمم. ترکیبِ اضافی: عهدِ خردی، آغوشِ من. این بیت با بیتِ بعد «موقوف‌المعانی» است (معنی‌اش با بیتِ بعد کامل می‌شود). شاعر: سعدی (گلستان، بابِ ششم).',2],

 poem:[
  ['ای مادرِ عزیز که جانم فدای تو • قربانِ مهربانی و لطف و صفای تو','ای مادرِ عزیز و گرامی، جانم فدای تو باد؛ من قربانِ مهربانی، لطف و یکرنگیِ تو شوم.','جمله‌ی ۱: ای: حرفِ ندا، مادر: منادا؛ «مادرِ عزیز» ترکیبِ وصفی. جمله‌ی ۲: فعل: (باد، محذوف)، نهاد: جانم، مسند: فدا. جمله‌ی ۳: نهاد: من (محذوف)، مسند: قربان. ترکیبِ اضافی: جانم، فدای تو، قربانِ مهربانی، صفای تو.',3],
  ['هرگز نشد محبتِ یاران و دوستان • هم‌پایه‌ی محبت و مهر و وفای تو','عشق و محبتِ دوستانِ صمیمی هرگز به اندازه‌ی مهربانی و وفاداریِ تو نمی‌شود.','فعل: نشد (ماضی)، مسند: هم‌پایه، گروهِ نهادی: محبتِ یاران و دوستان (نهادِ اصلی: محبت)؛ هرگز: قید. ترکیبِ اضافی: محبتِ یاران، هم‌پایه‌ی محبت، وفای تو. آرایه: تناسب (محبت، مهر، وفا).',1],
  ['مهرت برون نمی‌رود از سینه‌ام که هست • این سینه خانه‌ی تو و این دل سرای تو','مهر و محبتِ تو از وجودم بیرون نمی‌رود، زیرا سینه و دلِ من خانه و جایگاهِ عشقِ توست.','جمله‌ی ۱: فعل: برون نمی‌رود، نهاد: مهر (مهرت)؛ از: حرفِ اضافه، سینه: متمم. جمله‌ی ۲: فعل: هست، نهاد: این سینه، مسند: خانه. جمله‌ی ۳: فعلِ «هست» حذف شده، نهاد: این دل، مسند: سرا. ترکیبِ اضافی: مهرت، سینه‌ام، خانه‌ی تو، سرای تو. ترکیبِ وصفی: این سینه، این دل. آرایه: تشبیه (دل به خانه).',3],
  ['ای مادرِ عزیز که جان داده‌ای مرا • سهل است اگر که جان دهم اکنون به پای تو','ای مادرِ عزیز که به من زندگی بخشیدی، اگر اکنون جانم را در راهِ تو فدا کنم، کارِ ساده و آسانی است.','جمله‌ی ۱: ای: حرفِ ندا، مادر: منادا. جمله‌ی ۲: فعل: داده‌ای، نهاد: تو، مفعول: جان؛ مرا = به من (من: متمم). جمله‌ی ۳: فعل: است، مسند: سهل، نهاد: او (محذوف). جمله‌ی ۴: اگر: حرفِ شرط، فعل: دهم، نهاد: من، مفعول: جان، اکنون: قید؛ به: حرفِ اضافه، پا: متمم. آرایه: کنایه (جان دادن به پای کسی = فدا شدن).',4],
  ['خشنودیِ تو مایه‌ی خشنودیِ من است • زیرا بُوَد رضای خدا در رضای تو','خوشحالی و رضایتِ تو مایه‌ی خوشحالیِ من است؛ زیرا راضی بودنِ تو سبب می‌شود خدا هم از من راضی باشد.','جمله‌ی ۱: فعل: است، مسند: مایه‌ی خشنودیِ من (مسندِ اصلی: مایه)، نهاد: خشنودیِ تو. جمله‌ی ۲: فعل: بُوَد، مسند: در رضای تو، نهاد: رضای خدا. ترکیبِ اضافی: خشنودیِ تو، مایه‌ی خشنودی، رضای خدا، رضای تو. آرایه: تکرار (خشنودی، رضا)؛ تلمیح (رضایتِ خدا در رضایتِ پدر و مادر است).',2],
  ['گر بود اختیارِ جهانی به دستِ من • می‌ریختم تمامِ جهان را به پای تو','اگر اختیارِ همه‌ی جهان در دستِ من بود، همه‌ی آن را به پاس محبت‌هایت به پای تو می‌ریختم.','جمله‌ی ۱: گر: حرفِ شرط، فعل: بود، مسند: به دستِ من، نهاد: اختیارِ جهانی (نهادِ اصلی: اختیار). جمله‌ی ۲: فعل: می‌ریختم، نهاد: من، مفعول: جهان (تمامِ جهان)؛ به: حرفِ اضافه، پا: متمم. ترکیبِ اضافی: اختیارِ جهان، پای تو. آرایه: اغراق.',2]],

 poem:[
  ['خروشید و جوشید و برکند خاک • ز سُمَش زمین شد همه چاک‌چاک','رخش (اسبِ رستم) بانگ و فریاد زد، خشمگین شد و خاک را کند؛ از ضربه‌های سُمِ او زمین تکه‌تکه شد.','جمله‌ی ۱ تا ۳: فعل‌ها: خروشید، جوشید، برکند؛ نهاد: رخش (محذوف)؛ مفعولِ «برکند»: خاک. جمله‌ی ۴: فعل: شد، مسند: چاک‌چاک، نهاد: زمین، همه: قید؛ ز: حرفِ اضافه، سُم: متمم. ترکیبِ اضافی: سُمش. آرایه: اغراق (در جوش و خروشِ رخش)، تناسب (جوشید، خروشید، برکند، خاک، چاک‌چاک). قافیه: خاک / چاک.',4],
  ['بزد تیغ و بنداخت از بر سرش • فرو ریخت چون رود خون از برش','رستم با شمشیر ضربه زد و سرِ اژدها را از تنش جدا کرد و خون مانندِ رود از بدنش جاری شد.','جمله‌ی ۱: فعل: بزد، نهاد: رستم (محذوف)، مفعول: تیغ. جمله‌ی ۲: فعل: بنداخت (= بینداخت)، مفعول: سر؛ از: حرفِ اضافه، بر (= تن): متمم. جمله‌ی ۳: فعل: فرو ریخت، نهاد: خون؛ چون: حرفِ اضافه، رود: متمم؛ از: حرفِ اضافه، بر: متمم. ترکیبِ اضافی: سرش، برش. آرایه: تشبیه (جاری شدنِ خون به رود)، اغراق (در فورانِ خون)، تناسب (سر، بر).',3],
  ['بینداخت چون باد خَمِّ کمند • سرِ جادو آورد ناگه به بند','رستم با سرعتی مانندِ باد، حلقه‌ی کمند را به سویِ جادوگر انداخت و ناگهان او را اسیر کرد.','جمله‌ی ۱: فعل: بینداخت، نهاد: او (رستم، محذوف)، مفعول: خَمِّ کمند؛ چون: حرفِ اضافه، باد: متمم. جمله‌ی ۲: فعل: آورد، مفعول: سرِ جادو، ناگه: قیدِ زمان؛ به: حرفِ اضافه، بند: متمم. ترکیبِ اضافی: خمِّ کمند، سرِ جادو. آرایه: تشبیه (سرعتِ رستم به باد)، اغراق، کنایه (به بند آوردن = اسیر کردن).',2],
  ['میانش به خنجر به دو نیم کرد • دلِ جادوان زو پر از بیم کرد','رستم با خنجر کمرِ جادوگر را دو نیم کرد و با این کار، دلِ جادوگران را پر از ترس کرد.','جمله‌ی ۱: فعل: به دو نیم کرد (عبارتِ فعلی)، نهاد: او (محذوف)، مفعول: میان (کمر)؛ به: حرفِ اضافه، خنجر: متمم. جمله‌ی ۲: فعل: پر از بیم کرد (عبارتِ فعلی)، مفعول: دل؛ زو = از او (او: متمم). ترکیبِ اضافی: میانش، دلِ جادوان. قافیه: نیم / بیم؛ ردیف: کرد.',2],
  ['چو رستم بدیدش برانگیخت اسب • بدو تاخت مانندِ آذرگشسب','هنگامی که رستم او (ارژنگ دیو) را دید، اسب را به حرکت درآورد و مانندِ آتشی تند و سوزان به او حمله کرد.','جمله‌ی ۱: چو (= هنگامی که)، فعل: بدید، نهاد: رستم، مفعول: ـَش (او). جمله‌ی ۲: فعل: برانگیخت، نهاد: رستم (محذوف)، مفعول: اسب. جمله‌ی ۳: فعل: تاخت؛ بدو = به او (او: متمم)؛ مانندِ: حرفِ اضافه، آذرگشسب: متمم. آرایه: تشبیه (رستم به آذرگشسب)، اغراق.',3],
  ['سر و گوش بگرفت و یالش دلیر • سر از تن بکندش به کردارِ شیر','رستم با دلیری سر و گوش و یالِ دیو را گرفت و مانندِ شیر، سرش را از تن جدا کرد.','جمله‌ی ۱: فعل: بگرفت، نهاد: رستم (محذوف)، مفعول: سر و گوش و یال، دلیر: قیدِ حالت. جمله‌ی ۲: فعل: بکند، مفعول: سر؛ از: حرفِ اضافه، تن: متمم؛ به کردارِ (= مانندِ): حرفِ اضافه، شیر: متمم. «ـَش» در «بکندش» مضاف‌الیه است (سرش را از تن کند). آرایه: تشبیه (رستم به شیر)، تناسب (سر، گوش، یال، تن).',2],
  ['ز بهرِ نیایش سر و تن بشست • یکی پاک‌جای پرستش بجست','رستم برای نیایش با خداوند، سر و تنِ خود را شست و جای پاکیزه‌ای برای عبادت پیدا کرد.','جمله‌ی ۱: فعل: بشست، نهاد: رستم (محذوف)، مفعول: سر و تن؛ ز بهرِ (= برای): حرفِ اضافه، نیایش: متمم. جمله‌ی ۲: فعل: بجست (= جست‌وجو کرد)، مفعول: جای. ترکیبِ وصفی: پاک‌جای، یکی جای. ترکیبِ اضافی: جای پرستش. آرایه: تناسب (نیایش، پرستش، پاک).',2],
  ['از آن پس نهاد از برِ خاک سر • چنین گفت کای داورِ دادگر','رستم سپس سر بر خاک گذاشت (سجده کرد) و چنین گفت: ای خدای عادل!','جمله‌ی ۱: فعل: نهاد، نهاد: رستم (محذوف)، مفعول: سر، از آن پس: قیدِ زمان؛ از برِ (= بر روی): حرفِ اضافه، خاک: متمم. جمله‌ی ۲: فعل: گفت، چنین: قیدِ حالت. جمله‌ی ۳: کای = که + ای؛ ای: حرفِ ندا، داورِ دادگر: منادا. ترکیبِ وصفی: داورِ دادگر. آرایه: کنایه (سر بر خاک نهادن = سجده کردن).',3],
  ['ز هر بد تویی بندگان را پناه • تو دادی مرا گُردی و دستگاه','خدایا، تو پناهِ بندگان در برابرِ هر بدی هستی و تو به من پهلوانی و قدرت دادی.','جمله‌ی ۱: «تویی» = تو هستی؛ نهاد: تو، مسند: پناه؛ ز: حرفِ اضافه، هر بد: متمم؛ «بندگان را پناه» یعنی پناهِ بندگان. جمله‌ی ۲: فعل: دادی، نهاد: تو، مفعول: گُردی و دستگاه؛ مرا = به من (من: متمم). ترکیبِ وصفی: هر بد. آرایه: واج‌آرایی (تکرارِ «د»). این بیت با بیتِ قبل موقوف‌المعانی است.',2]],

 info:[['شاعر','نادر ابراهیمی'],['قالب','چهارپاره'],['موضوع','عشق به وطن']],
 msg:'وطن، سلام و سرود و نگهبانِ وجودِ ماست؛ دلیلِ زنده بودن و جان‌پناهی جاودانه است و در زیبایی، پاکی، سربلندی و وفاداری همتا ندارد.',
 poem:[
  ['ای سلامم، ای سرودم • ای نگهبانِ وجودم • ای غمم تو، شادی‌ام تو • مایه‌ی آزادی‌ام تو • ای وطن!','ای وطن، تو سلام و شعر و سرودِ من هستی و در برابرِ دشمنان از من نگهبانی می‌کنی؛ غم و شادیِ من به تو وابسته است (از مشکلاتِ تو غمگین و از افتخاراتت شاد می‌شوم) و تو مایه‌ی آزادیِ من هستی.','«ای سلامم» = ای وطن، (تو) سلامِ من هستی (۲ جمله) — «ای سرودم» (۲) — «ای نگهبانِ وجودم» (۲) — «ای غمم تو، شادی‌ام تو» (۳) — «مایه‌ی آزادی‌ام تو» (۱) — «ای وطن!» (۱) ← روی‌هم ۱۱ جمله. منادا «وطن» است که در مصراع‌ها حذف شده. ترکیبِ اضافی: سلامم، سرودم، نگهبانِ وجود، وجودم، غمم، شادی‌ام، مایه‌ی آزادی، آزادی‌ام. آرایه: تشبیه (وطن به نگهبان و سرود)، تضاد (غم و شادی).',11],
  ['ای دلیلِ زنده بودن • ای سرودی صادقانه • ای دلیلِ زنده ماندن • جان‌پناهی جاودانه • ای وطن!','ای وطن، تو دلیلِ زنده بودنِ ما و مانندِ سرودی صادقانه و بی‌ریا هستی؛ تو انگیزه‌ی زنده ماندنِ ما و مانندِ پناهگاهی همیشگی، مایه‌ی آرامش و امنیتِ ما هستی.','«ای دلیلِ زنده بودن» (۲ جمله) — «ای سرودی صادقانه» (۲) — «ای دلیلِ زنده ماندن» (۲) — «جان‌پناهی جاودانه» (۱) — «ای وطن!» (۱) ← ۸ جمله. نکته: منادا در این مصراع‌ها «وطن» است که حذف شده؛ «دلیل» و «سرود» منادا نیستند. ترکیبِ وصفی: سرودی صادقانه، جان‌پناهی جاودانه. ترکیبِ اضافی: دلیلِ زنده بودن. آرایه: تشبیه (وطن به سرود و جان‌پناه).',8],
  ['همچو رویش در بهاران • همچو جان در هر بدن • مثلِ بوی عطرِ گل‌ها • مثلِ سبزیِ چمن • ای وطن!','ای وطن، تو مانندِ روییدنِ گیاهان در بهار سرزنده‌ای، مانندِ جان در بدنِ همه، زندگی‌بخشی؛ مانندِ بوی خوشِ گل‌ها دلپذیری و مانندِ چمنزار سرسبز و شادابی.','هر مصراع یک جمله است با فعلِ محذوفِ «هستی» (۴ جمله) + «ای وطن!» (۱) ← ۵ جمله. همچو و مثلِ: حرفِ اضافه. ترکیبِ اضافی: بوی عطر، عطرِ گل‌ها، سبزیِ چمن. ترکیبِ وصفی: هر بدن. نکته: «ان» در «بهاران» نشانه‌ی جمع نیست؛ پسوندِ زمان است (بهاران = هنگامِ بهار). آرایه: تشبیه (در هر چهار مصراع)، تناسب (بهاران، گل‌ها، چمن).',5],
  ['مثلِ رازِ شعرِ حافظ • مثلِ آوازِ قناری • همچو یادِ خوش‌ترین‌ها • همچو بارانِ بهاری • ای وطن!','ای وطن، تو مانندِ رازِ شعرهای حافظ اسرارآمیز، مانندِ آوازِ قناری دلنشین، مانندِ خاطره‌های خوش به‌یادماندنی و مانندِ بارانِ بهاری لطیف و پاکی.','۴ جمله با فعلِ محذوفِ «هستی» + «ای وطن!» ← ۵ جمله. ترکیبِ اضافی: رازِ شعر، شعرِ حافظ، آوازِ قناری، یادِ خوش‌ترین‌ها. ترکیبِ وصفی: بارانِ بهاری. آرایه: تشبیه (در هر چهار مصراع).',5],
  ['مثلِ غم در مرگِ مادر • مثلِ کوهِ غصه‌هایی • مثلِ سربازانِ عاشق • قهرمانِ قصه‌هایی • ای وطن!','ای وطن، تو مانندِ غمِ از دست دادنِ مادر، دردناک و مانندِ کوهی از غصه‌ها رنج‌کشیده‌ای؛ و مانندِ سربازانِ عاشقی که دلیرانه دفاع کرده‌اند، قهرمانِ داستان‌هایی.','«مثلِ غم در مرگِ مادر» (۱) — «مثلِ کوهِ غصه‌هایی» (۱) — «مثلِ سربازانِ عاشق، قهرمانِ قصه‌هایی» (۱) — «ای وطن!» (۱) ← ۴ جمله. ترکیبِ اضافی: مرگِ مادر، کوهِ غصه‌ها، قهرمانِ قصه‌ها. ترکیبِ وصفی: سربازانِ عاشق. آرایه: تشبیه، جناس (غصه و قصه).',4],
  ['همچو آوازِ بلندی • از بلندی‌های پاک • با غروری، با گذشتی • با وفایی همچو خاک • ای وطن! ای وطن! ای وطن!','ای وطن، تو مانندِ آوازی بلند و رسا هستی که از قله‌های پاک به گوش می‌رسد؛ سربلند و باعزتی، اهلِ گذشت و بخششی و مانندِ خاک، باوفا و همیشگی هستی.','«همچو آوازِ بلندی از بلندی‌های پاک» (۱) — «با غروری» (۱) — «با گذشتی» (۱) — «با وفایی همچو خاک» (۱) — سه بار «ای وطن!» (۳) ← ۷ جمله. ترکیبِ وصفی: آوازِ بلند، بلندی‌های پاک. آرایه: تشبیه (وطن به آوازِ بلند و به خاک)، تشخیص (نسبت دادنِ غرور، گذشت و وفا به وطن)، تکرار (ای وطن).',7]],

L.l7={id:'l7',t:'همه از خاکِ پاکِ ایرانیم',d:'درسِ هفتم (درسِ آزاد)',k:'شعر',icon:'🌄',color:'#d4380d',
 info:[['شاعر','ایرج میرزا'],['قالب','غزل'],['موضوع','میهن‌دوستی']],
 msg:'همه‌ی ما فرزندانِ خاکِ پاکِ ایرانیم؛ با هم برادر و مهربانیم، وطن برای ما مانندِ مادر است و در راهِ آن جان‌فشانی می‌کنیم؛ زیرا دوست داشتنِ وطن نشانه‌ی ایمان است.',
 poem:[
  ['ما که اطفالِ این دبستانیم • همه از خاکِ پاکِ ایرانیم','ما که کودکانِ این دبستان هستیم، همگی فرزندانِ خاکِ پاکِ کشورِ ایرانیم.','جمله‌ی ۱: فعل: ـیم (= هستیم)، نهاد: ما، مسند: اطفال؛ ترکیبِ اضافی: اطفالِ دبستان؛ ترکیبِ وصفی: این دبستان. جمله‌ی ۲: فعل: ـیم (= هستیم)، نهاد: ما (محذوف)، همه: قید، مسند: از خاکِ پاکِ ایران. ترکیبِ وصفی: خاکِ پاک. ترکیبِ اضافی: خاکِ ایران. آرایه: جناس (خاک و پاک).',2],
  ['همه با هم برادرِ وطنیم • مهربان همچو جسم با جانیم','همه‌ی ما در این کشور مانندِ برادر و هم‌وطن هستیم و مانندِ جسم و جان با یکدیگر مهربانیم.','جمله‌ی ۱: فعل: ـیم (= هستیم)، نهاد: ما (محذوف)، همه: قید، مسند: برادر؛ با: حرفِ اضافه، هم: متمم؛ ترکیبِ اضافی: برادرِ وطن. جمله‌ی ۲: فعل: ـیم (= هستیم)، مسند: مهربان؛ همچو: حرفِ اضافه، جسم: متمم؛ با: حرفِ اضافه، جان: متمم. آرایه: تشبیه (مهربانیِ هم‌وطنان به پیوندِ جسم و جان)، تضاد (جسم و جان).',2],
  ['اشرف و انجبِ تمامِ مِلَل • یادگارِ قدیمِ دورانیم','ما شریف‌ترین و نجیب‌ترینِ ملت‌ها هستیم و یادگارِ روزگارانِ کهن و قدیمیم.','جمله‌ی ۱: فعلِ «هستیم» حذف شده، نهاد: ما (محذوف)، مسند: اشرف و انجب؛ ترکیبِ وصفی: تمامِ ملل (تمام: صفتِ مبهم). جمله‌ی ۲: فعل: ـیم (= هستیم)، مسند: یادگار؛ ترکیبِ اضافی: یادگارِ دوران؛ ترکیبِ وصفی: یادگارِ قدیم. آرایه: اغراق.',2],
  ['وطنِ ما به جای مادرِ ماست • مادرِ خویش را نگهبانیم','وطنِ ما مانندِ مادرِ ما برایمان عزیز است و ما نگهبانِ مادرِ خود هستیم.','جمله‌ی ۱: فعل: است، نهاد: وطن (وطنِ ما)، مسند: به جای مادر؛ به جای: حرفِ اضافه، مادر: متمم. جمله‌ی ۲: فعل: ـیم (= هستیم)، نهاد: ما (محذوف)، مسند: نگهبان؛ «را» در اینجا به معنیِ «برای» (حرفِ اضافه) است و «مادرِ خویش» متمم است، نه مفعول (فعلِ اسنادی مفعول نمی‌گیرد). آرایه: تشبیه (وطن به مادر).',2],
  ['شکر داریم کز طفولیت • درسِ حُبُّ‌الوطن همی‌خوانیم','خدا را شکر می‌کنیم که از دورانِ کودکی درسِ عشق و محبت به وطن را می‌آموزیم.','جمله‌ی ۱: فعل: شکر داریم، نهاد: ما (محذوف). جمله‌ی ۲: کز = که + از؛ فعل: همی‌خوانیم (= می‌خوانیم)، نهاد: ما، مفعول: درس؛ از: حرفِ اضافه، طفولیت: متمم. ترکیبِ اضافی: درسِ حُبُّ‌الوطن. آرایه: تلمیح (به حدیثِ «حُبُّ الوَطَنِ مِنَ الایمان»).',2],
  ['چون که حُبِّ وطن ز ایمان است • ما یقیناً ز اهلِ ایمانیم','چون دوست داشتنِ وطن نشانه‌ای از ایمان است، پس ما بی‌گمان از مردمِ باایمان هستیم.','جمله‌ی ۱: چون که: حرفِ ربط، فعل: است، نهاد: حُبِّ وطن، مسند: ز ایمان. جمله‌ی ۲: فعل: ـیم (= هستیم)، نهاد: ما، مسند: ز اهلِ ایمان، یقیناً: قید. ترکیبِ اضافی: حبِّ وطن، اهلِ ایمان. آرایه: تلمیح (به حدیثِ «حُبُّ الوَطَنِ مِنَ الایمان» منسوب به پیامبر (ص)).',2],
  ['گر رسد دشمنی برای وطن • جان و دل رایگان بیفشانیم','اگر دشمنی به وطنِ ما حمله کند، جان و دلِ خود را بی‌چشم‌داشت در راهش فدا می‌کنیم.','جمله‌ی ۱: گر: حرفِ شرط، فعل: رسد، نهاد: دشمنی؛ برای: حرفِ اضافه، وطن: متمم. جمله‌ی ۲: فعل: بیفشانیم، نهاد: ما (محذوف)، مفعول: جان و دل، رایگان: قید. آرایه: کنایه (جان و دل افشاندن = فداکاری)، تناسب (جان و دل).',2]],

 notes:[
  ['درسِ آزاد و زبانِ محلی','درسِ هفتم «درسِ آزاد» است: معادلِ محلیِ واژه‌هایی مانندِ پدر، مادر، برادر، خواهر، پسر و دختر را در گویشِ بومیِ خود بنویسید و با کمکِ خانواده، چند ضرب‌المثل یا اصطلاحِ محلی را با معنیِ آن‌ها گردآوری کنید.'],
  ['تلمیح','«حُبُّ الوَطَنِ مِنَ الایمان» (دوست داشتنِ وطن نشانه‌ی ایمان است)، حدیثی منسوب به پیامبرِ اکرم (ص).'],
  ['«را» به معنیِ «برای»','در «مادرِ خویش را نگهبانیم»، «را» حرفِ اضافه است؛ یعنی «نگهبانِ مادرِ خویش هستیم».'],
  ['فعلِ «ـیم»','در «دبستانیم»، «ایرانیم»، «وطنیم» و…، «ـیم» همان فعلِ «هستیم» است که به کلمه چسبیده است.']],

L.l8={id:'l8',t:'دریاقلی',d:'درسِ هشتم',k:'نثر و شعر',icon:'🌊',color:'#0369a1',
 info:[['شاعرِ شعر','دکتر سید حسن حسینی'],['قالبِ شعر','قطعه'],['موضوع','فداکاریِ شهید دریاقلی سورانی']],
 msg:'دریاقلی سورانی با هوشیاری و فداکاریِ به‌هنگام، مدافعانِ آبادان را از حمله‌ی دشمن آگاه کرد و در راهِ دفاع از میهن جان‌فشانی کرد؛ نامِ او به وسعتِ دریاست.',
 sum:'دریاقلی جوانی ساکنِ حاشیه‌ی آبادان بود. شبی متوجه شد نیروهای دشمن از رودخانه‌ی بهمن‌شیر گذشته‌اند تا شهر را غافلگیر کنند. او با دوچرخه خود را به شهر رساند و مدافعان و مردم را از نفوذِ دشمن آگاه کرد و سرانجام در دفاع از شهر به شهادت رسید.',
 poem:[
  ['دریاقلی! رکاب بزن، یا علی بگو • چشم‌انتظارِ همتِ تو دین و میهن است','ای دریاقلی، با سرعت رکاب بزن و یا علی بگو؛ زیرا دین و میهن چشم‌انتظارِ همت و تلاشِ تو هستند.','جمله‌ی ۱: دریاقلی: منادا (حرفِ ندای «ای» حذف شده). جمله‌ی ۲: فعل: رکاب بزن (امر)، نهاد: تو. جمله‌ی ۳: فعل: بگو، نهاد: تو، مفعول: یا علی («یا علی» منادا نیست، چون کسی مخاطب قرار نگرفته است). جمله‌ی ۴: فعل: است، مسند: چشم‌انتظار، نهاد: دین و میهن. ترکیبِ اضافی: همتِ تو، چشم‌انتظارِ همت. آرایه: تشخیص (چشم‌انتظار بودنِ دین و میهن)، کنایه (یا علی گفتن = آماده شدن برای انجامِ کار؛ رکاب زدن = شتاب کردن).',4],
  ['فردا اگر درنگ کنی، کوچه‌های شهر • میدانِ جنگِ تن‌به‌تن و تانک با تن است','اگر درنگ کنی و فرصت را از دست بدهی، فردا کوچه‌های شهر میدانِ جنگِ تن‌به‌تن و جنگِ تانک‌های دشمن با مردم خواهد شد.','جمله‌ی ۱: اگر: حرفِ شرط، فعل: درنگ کنی، نهاد: تو، فردا: قیدِ زمان. جمله‌ی ۲: فعل: است، مسند: میدان، نهاد: کوچه‌های شهر. ترکیبِ اضافی: کوچه‌های شهر، میدانِ جنگ. ترکیبِ وصفی: جنگِ تن‌به‌تن؛ با: حرفِ اضافه، تن: متمم. آرایه: تشبیه (کوچه‌های شهر به میدانِ جنگ)، تناسب (میدانِ جنگ، جنگِ تن‌به‌تن، تانک)، تکرار (تن).',2],
  ['از راه اگر بمانی و روشن شود هوا • تکلیفِ شهرِ خاطره‌های تو روشن است','اگر در راه بمانی و پیش از روشن شدنِ هوا به مقصد نرسی، سرنوشتِ شهری که از آن خاطره‌ها داری معلوم است (به دستِ دشمن می‌افتد).','جمله‌ی ۱: اگر: حرفِ شرط، فعل: بمانی، نهاد: تو؛ از: حرفِ اضافه، راه: متمم. جمله‌ی ۲: فعل: شود، مسند: روشن، نهاد: هوا. جمله‌ی ۳: فعل: است، مسند: روشن، نهاد: تکلیف. ترکیبِ اضافی: تکلیفِ شهر، شهرِ خاطره‌ها، خاطره‌های تو. آرایه: کنایه (روشن شدنِ تکلیف = معلوم شدنِ سرنوشت)، جناسِ تام (روشن: روشنایی / روشن: معلوم).',3],
  ['دریاقلی! به وسعتِ دریاست نامِ تو • تاریخ در تلفظِ نامِ تو الکن است','ای دریاقلی، نامِ تو به بزرگی و وسعتِ دریاست و تاریخ نیز در بیانِ نام و بزرگیِ تو ناتوان است.','جمله‌ی ۱: دریاقلی: منادا. جمله‌ی ۲: فعل: است (در «دریاست»)، مسند: به وسعتِ دریا، نهاد: نامِ تو. جمله‌ی ۳: فعل: است، مسند: الکن، نهاد: تاریخ؛ در: حرفِ اضافه، تلفظ: متمم. ترکیبِ اضافی: وسعتِ دریا، نامِ تو، تلفظِ نام. آرایه: تشبیه (نام به دریا)، اغراق، تشخیص (الکن بودنِ تاریخ)، جناس (دریا و دریاقلی).',3]],

 notes:[
  ['منادا و «یا علی»','«دریاقلی!» منادا است (حرفِ ندا حذف شده). اما در «یا علی بگو»، «یا علی» منادا نیست؛ چون کسی مخاطب قرار نگرفته و «یا علی» مفعولِ «بگو» است.'],

  ['علائمِ نگارشی (سجاوندی)','نقطه (.): پایانِ جمله‌ی خبری یا امری — ویرگول (،): درنگِ کوتاه و جدا کردنِ اجزا — نقطه‌ویرگول (؛): درنگی بیشتر از ویرگول — دونقطه (:): پیش از نقلِ قول و توضیح — علامتِ تعجب (!): پس از جمله‌های عاطفی و منادا — علامتِ پرسش (؟): پایانِ جمله‌ی پرسشی — گیومه («»): نقلِ عینِ سخنِ دیگران — سه‌نقطه (…): نشانه‌ی حذف یا ناتمام ماندنِ سخن.'],
  ['جناسِ تام','دو کلمه با شکل و تلفظِ یکسان و معنیِ متفاوت: «روشن» (روشنیِ هوا) و «روشن» (معلوم بودنِ تکلیف).']],

 msg:'خوشا به حالِ کسانی که خدا یارشان است؛ شاعر با بذرِ دعا در خاکِ طلب، چشم‌به‌راهِ بارانِ اجابتِ خداوند و ظهورِ امام زمان (عج) است.',
 poem:[
  ['خوشا آنان که الله یارشان بی • به حمد و قل هو الله کارشان بی','خوشا به حالِ کسانی که خدا یارشان است و کارشان یادِ خدا و نماز خواندن است.','(باباطاهر، دوبیتی) جمله‌ی ۱: خوشا آنان: شبه‌جمله (الفِ کثرت: چه بسیار خوش است). جمله‌ی ۲: که: حرفِ ربط، فعل: بی (= باشد/است)، نهاد: الله، مسند: یار؛ ترکیبِ اضافی: یارشان. جمله‌ی ۳: فعل: بی، نهاد: کارشان، مسند: به حمد و قل هو الله. ← ۳ جمله (۲ فعل + ۱ شبه‌جمله). آرایه: تلمیح (به سوره‌های حمد و توحید)، کنایه (قل هو الله گفتن = نماز و دعا خواندن).',3],
  ['خوشا آنان که دایم در نمازند • بهشتِ جاودان بازارشان بی','خوشا به حالِ کسانی که همیشه در حالِ نمازند؛ کسانی که بهشتِ جاودان جایگاه و بازارِ آن‌هاست.','(باباطاهر) جمله‌ی ۱: خوشا آنان: شبه‌جمله. جمله‌ی ۲: فعل: ـَند (= هستند) در «نمازند»، نهاد: ایشان، مسند: در نماز، دایم: قید. جمله‌ی ۳: فعل: بی، نهاد: بهشتِ جاودان، مسند: بازار (بازارشان). ترکیبِ وصفی: بهشتِ جاودان. ← ۳ جمله.',3],
  ['خداوندا به فریادِ دلم رس • کسِ بی‌کس تویی، من مانده بی‌کس','پروردگارا، به فریادِ دلِ من برس؛ زیرا تو یارِ کسانی هستی که یاوری ندارند و من تنها مانده‌ام.','(باباطاهر) جمله‌ی ۱: خداوندا: منادا («ا»: حرفِ ندا). جمله‌ی ۲: فعل: رس (امر)، نهاد: تو (محذوف)؛ به: حرفِ اضافه، فریاد: متمم؛ ترکیبِ اضافی: فریادِ دل، دلم. جمله‌ی ۳: «تویی» = تو هستی؛ نهاد: تو، مسند: کسِ بی‌کس (یارِ بی‌کسان). جمله‌ی ۴: فعل: مانده (= مانده‌ام، فعلِ کوتاه‌شده)، نهاد: من، بی‌کس: قیدِ حالت. ← ۴ جمله. آرایه: کنایه (به فریاد رسیدن = کمک کردن)، تکرار (کس).',4],
  ['همه گویند طاهر کس نداره • خدا یارِ منه، چه حاجتِ کس؟','همه می‌گویند طاهر تنهاست و یاری ندارد؛ اما خدا یارِ من است و به کسی نیازی ندارم.','(باباطاهر) جمله‌ی ۱: فعل: گویند، نهاد: همه. جمله‌ی ۲: فعل: نداره (= ندارد)، نهاد: طاهر، مفعول: کس. جمله‌ی ۳: «منه» = من است؛ نهاد: خدا، مسند: یار (یارِ من). جمله‌ی ۴: فعلِ «است» حذف شده؛ «چه حاجتِ کس؟» یعنی به کسی چه نیازی است؟ ← ۴ جمله. «نداره» و «منه» به گویشِ محلی است. تخلص: طاهر.',4],
  ['در مرحمتِ تو غوطه‌ور روز و شبم • ای نامِ تو روییده به گلدانِ لبم','ای خدایی که نامِ تو همیشه بر لبانِ من است، من شب و روز در دریای لطف و مهربانیِ تو شناورم.','(دکتر سید حسن حسینی، رباعی) جمله‌ی ۱: «ـَم» در «شبم» = هستم؛ نهاد: من، مسند: غوطه‌ور، روز و شب: قید؛ در: حرفِ اضافه، مرحمت: متمم؛ ترکیبِ اضافی: مرحمتِ تو. جمله‌ی ۲: ای: حرفِ ندا، منادا (خدا) حذف شده. جمله‌ی ۳: فعل: روییده (است)، نهاد: نامِ تو؛ به: حرفِ اضافه، گلدان: متمم؛ ترکیبِ اضافی: گلدانِ لب، لبم. ← ۳ جمله. آرایه: تشبیه (لب به گلدان؛ لطفِ خدا به دریا)، تضاد (روز و شب).',3],
  ['در خاکِ طلب بذرِ دعا کاشته‌ام • بارانِ اجابتِ تو را می‌طلبم','دعا را مانندِ دانه‌ای در خاکِ خواستن کاشته‌ام و بارانِ اجابتِ تو را می‌خواهم تا دعایم به ثمر برسد.','جمله‌ی ۱: فعل: کاشته‌ام، نهاد: من، مفعول: بذر (بذرِ دعا)؛ در: حرفِ اضافه، خاک: متمم؛ ترکیبِ اضافی: خاکِ طلب، بذرِ دعا. جمله‌ی ۲: فعل: می‌طلبم، نهاد: من، مفعول: باران (بارانِ اجابت)؛ ترکیبِ اضافی: بارانِ اجابت، اجابتِ تو. آرایه: تشبیه (طلب به خاک، دعا به بذر، اجابت به باران)، تناسب (خاک، بذر، کاشتن، باران).',2],
  ['اگر آن سبزقامت رو نماید • درِ باغِ خدا را می‌گشاید','اگر آن کسی که قامتی سبز دارد (امام زمان عج) ظهور کند، درِ باغِ خدا (بهشت) را به روی ما می‌گشاید.','(مصطفی علیپور، دوبیتی) جمله‌ی ۱: اگر: حرفِ شرط، فعل: نماید، نهاد: آن سبزقامت، مفعول: رو؛ ترکیبِ وصفی: آن سبزقامت. جمله‌ی ۲: فعل: می‌گشاید، نهاد: او (محذوف)، مفعول: در؛ ترکیبِ اضافی: درِ باغ، باغِ خدا. آرایه: تلمیح (به ظهورِ امام زمان (عج))؛ «سبزقامت» استعاره از امام زمان (عج) است.',2],
  ['تنم را فرش کردم تا بتازد • دلم را نذر کردم تا بیاید','تنم را مانندِ فرشی زیرِ پایش پهن کردم تا بتازد و دلم را نذرِ او کردم تا بیاید.','جمله‌ی ۱: فعل: فرش کردم، نهاد: من، مفعول: تن (تنم). جمله‌ی ۲: تا: حرفِ ربط، فعل: بتازد، نهاد: او (محذوف). جمله‌ی ۳: فعل: نذر کردم، نهاد: من، مفعول: دل (دلم). جمله‌ی ۴: فعل: بیاید، نهاد: او (محذوف). آرایه: کنایه (تن را فرش کردن و دل را نذر کردن = آمادگی و اشتیاقِ کامل)، تشبیه (تن به فرش).',4]],

 sum:'دانایی گفت: در هندوستان درختی هست که هرکس از میوه‌اش بخورد، هرگز نمی‌میرد. پادشاه این را شنید و فرستاده‌ای را برای یافتنِ آن درخت روانه کرد. فرستاده سال‌ها گشت و هر کس را پرسید، او را مسخره کرد. سرانجام ناامید نزدِ شیخی دانا رفت؛ شیخ خندید و گفت: آن درخت، درختِ علم است و میوه‌اش زندگیِ جاودانه.',
 poem:[
  ['شیخ خندید و بگفتش ای سلیم • این درختِ علم باشد ای علیم','شیخ خندید و به او گفت: ای انسانِ ساده‌دل، این درختی که می‌گویند، درختِ علم و دانش است.','جمله‌ی ۱: فعل: خندید، نهاد: شیخ. جمله‌ی ۲: فعل: بگفت، نهاد: او (شیخ)؛ «ـَش» در «بگفتش» = به او. جمله‌ی ۳: ای: حرفِ ندا، سلیم: منادا. جمله‌ی ۴: فعل: باشد، نهاد: این، مسند: درخت (درختِ علم). جمله‌ی ۵: ای: حرفِ ندا، علیم: منادا. ترکیبِ اضافی: درختِ علم. آرایه: تشبیه (علم به درخت). «سلیم» کنایه از ساده‌لوح است و «علیم» به طعنه برای کسی گفته شده که معنی را نفهمیده است.',5],
  ['تو به صورت رفته‌ای ای بی‌خبر • زان ز شاخِ معنی‌ای بی بار و بر','ای انسانِ بی‌خبر، تو فقط به ظاهرِ سخن توجه کرده‌ای؛ به همین سبب از شاخه‌ی معنی بهره‌ای نبرده‌ای.','جمله‌ی ۱: فعل: رفته‌ای، نهاد: تو؛ به: حرفِ اضافه، صورت: متمم. جمله‌ی ۲: ای: حرفِ ندا، بی‌خبر: منادا. جمله‌ی ۳: «ـی» در «معنی‌ای» = هستی؛ نهاد: تو (محذوف)، مسند: بی بار و بر؛ زان = از آن سبب؛ ز: حرفِ اضافه، شاخ: متمم؛ ترکیبِ اضافی: شاخِ معنی. آرایه: تشبیه (معنی به شاخه)، تضاد (صورت و معنی)، کنایه (بی بار و بر = بی‌بهره).',3],
  ['گه درختش نام شد گاه آفتاب • گاه بحرش نام شد گاهی سحاب','علم را گاهی درخت، گاهی آفتاب، گاهی دریا و گاهی ابر نامیده‌اند.','جمله‌ی ۱: فعل: شد، نهاد: نام، مسند: درخت، گه: قید. جمله‌ی ۲: فعلِ «شد» حذف شده، مسند: آفتاب، گاه: قید. جمله‌ی ۳: فعل: شد، نهاد: نام، مسند: بحر، گاه: قید. جمله‌ی ۴: فعلِ «شد» حذف شده، مسند: سحاب، گاهی: قید. ترکیبِ اضافی: درختش، بحرش. ← ۴ جمله (۲ فعلِ موجود + ۲ فعلِ محذوف). آرایه: تشبیه (علم به درخت، آفتاب، بحر و سحاب)، تناسب (درخت، آفتاب، بحر، سحاب)، تکرار (گاه).',4],
  ['آن یکی کِش صد هزار آثار خاست • کمترین آثارِ او عمرِ بقاست','علم همان یگانه‌ای است که صدها هزار اثر و فایده از آن پدید آمده و کمترین فایده‌اش زندگیِ جاودانه است.','جمله‌ی ۱: فعل: خاست (= پدید آمد)، نهاد: آثار (صد هزار آثار)؛ «کِش» = که او را / که از او. جمله‌ی ۲: فعل: است (در «بقاست»)، نهاد: کمترین آثارِ او، مسند: عمرِ بقا. ترکیبِ وصفی: صد هزار آثار، کمترین آثار، عمرِ بقا (عمرِ جاودان). ترکیبِ اضافی: آثارِ او. آرایه: اغراق (صد هزار اثر)، تکرار (آثار).',2]],

 msg:'شهیدان مانندِ خورشید نورانی و روشنی‌بخش‌اند؛ مانندِ شقایقِ سرخ، چراغی که می‌سوزد و روشنی می‌بخشد، داستانی پر از زیبایی و نمره‌ی بیستی که همیشه در دفترِ دل می‌ماند.',
 poem:[
  ['ساعتِ انشا بود • و چنین گفت معلم با ما: • «بچه‌ها گوش کنید! • نظرِ ما این است: • شهدا خورشیدند.»','ساعتِ انشا بود. معلم به ما چنین گفت: «بچه‌ها گوش کنید! نظرِ ما این است که شهیدان مانندِ خورشید درخشان و نورانی‌اند.»','جمله‌ی ۱: فعل: بود، نهاد: ساعتِ انشا (ترکیبِ اضافی). جمله‌ی ۲: فعل: گفت، نهاد: معلم، چنین: قیدِ حالت؛ با: حرفِ اضافه، ما: متمم. جمله‌ی ۳: بچه‌ها: منادا. جمله‌ی ۴: فعل: گوش کنید، نهاد: شما (محذوف). جمله‌ی ۵: فعل: است، نهاد: نظرِ ما (نهادِ اصلی: نظر)، مسند: این. جمله‌ی ۶: «ـَند» در «خورشیدند» = هستند؛ نهاد: شهدا، مسند: خورشید. آرایه: تشبیه (مشبه: شهدا، مشبهٌ‌به: خورشید؛ ادات و وجهِ شبه حذف شده؛ وجهِ شبه: نورانی و روشنی‌بخش بودن).',6],
  ['مرتضی گفت: «شهید • چون شقایق سرخ است.»','مرتضی گفت: شهید مانندِ گلِ شقایق سرخ‌رنگ است (در خونِ خود غلتیده است).','جمله‌ی ۱: فعل: گفت، نهاد: مرتضی. جمله‌ی ۲: فعل: است، نهاد: شهید، مسند: سرخ؛ چون: حرفِ اضافه، شقایق: متمم. آرایه: تشبیه (مشبه: شهید، مشبهٌ‌به: شقایق، ادات: چون، وجهِ شبه: سرخ بودن).',2],
  ['دانش‌آموزی گفت: • «چون چراغی است که در خانه‌ی ما می‌سوزد.»','دانش‌آموزِ دیگری گفت: شهید مانندِ چراغی است که در خانه‌ی ما می‌سوزد؛ خودش می‌سوزد و به دیگران روشنی می‌بخشد و راهِ درست را نشان می‌دهد.','جمله‌ی ۱: فعل: گفت، نهاد: دانش‌آموزی. جمله‌ی ۲: فعل: است، نهاد: او (شهید، محذوف)، مسند: چون چراغی. جمله‌ی ۳: که: حرفِ ربط، فعل: می‌سوزد، نهاد: چراغ (محذوف)؛ در: حرفِ اضافه، خانه: متمم؛ ترکیبِ اضافی: خانه‌ی ما. آرایه: تشبیه (شهید به چراغ؛ ادات: چون؛ وجهِ شبه: سوختن و روشنی بخشیدن).',3],
  ['و کسی دیگر گفت: «شهید • داستانی است پر از حادثه و زیبایی.»','دانش‌آموزِ دیگری گفت: شهید مانندِ داستانی است پر از ماجراهای شگفت‌انگیز و زیبا.','جمله‌ی ۱: و: حرفِ ربط، فعل: گفت، نهاد: کسی دیگر (ترکیبِ وصفی). جمله‌ی ۲: فعل: است، نهاد: شهید، مسند: داستان، پر: قیدِ مقدار؛ از: حرفِ اضافه، حادثه و زیبایی: متمم. آرایه: تشبیه (شهید به داستان؛ ادات حذف شده؛ وجهِ شبه: پر از حادثه و زیبایی بودن).',2],
  ['مصطفی گفت: «شهید • مثلِ یک نمره‌ی بیست • داخلِ دفترِ قلبِ من و تو می‌ماند.»','مصطفی گفت: شهید مانندِ نمره‌ی بیست، یاد و خاطره‌اش برای همیشه در دفترِ دلِ ما باقی می‌ماند.','جمله‌ی ۱: فعل: گفت، نهاد: مصطفی. جمله‌ی ۲: فعل: می‌ماند، نهاد: شهید؛ مثلِ: حرفِ اضافه، نمره: متمم؛ داخلِ: حرفِ اضافه، دفتر: متمم. ترکیبِ وصفی: یک نمره. ترکیبِ اضافی: نمره‌ی بیست، دفترِ قلب، قلبِ من و تو. آرایه: تشبیه (شهید به نمره‌ی بیست؛ وجهِ شبه: ماندگاری)، اضافه‌ی تشبیهی (دفترِ قلب: قلب مانندِ دفتر). نکته: «نمره‌ی بیست» ترکیبِ اضافی است؛ چون عدد بعد از اسم آمده و نامِ آن را مشخص می‌کند.',2]],

  ['چه هر کس را دانشی باشد و هر یکی چیزی داند؛ یکی بیشتر و یکی کمتر.','زیرا هر کسی دانشی دارد و چیزی می‌داند؛ یکی بیشتر و یکی کمتر.'],
  ['و یکی دانشی دارد و هرگز به کار نبسته است و نیازموده؛ و یکی همان دانش داند و کار بسته است و آزموده.','بعضی دانشی دارند ولی هرگز آن را به کار نبرده و نیازموده‌اند و بعضی همان دانش را دارند و آن را به کار برده و آزموده‌اند.'],
  ['مَثَلِ این، چنان باشد که یکی باشد که بسیار سفرها کرده باشد و جهان بسیار دیده و سرد و گرم چشیده و در میانِ کارها بوده، با آن کس برابر نتوان کرد که هرگز سفر نکرده باشد و ولایت‌ها ندیده.','مثلاً کسی که سفرهای زیادی کرده، دنیا دیده، سختی و خوشی چشیده و کارهای بسیاری انجام داده است، با کسی که هرگز سفر نکرده و شهرهای دیگر را ندیده، برابر نیست.'],

  ['و نیز یکی را خاطر تیزتر باشد و در کارها زودتر تواند دید و یکی کندفهم باشد.','و همچنین یکی هوشِ بیشتری دارد و نتیجه‌ی کارها را زودتر می‌بیند و دیگری دیرتر می‌فهمد.'],

 msg:'حضرت علی (ع)، شیرِ خدا، با شب انس داشت و شب‌ها با خدا راز و نیاز می‌کرد؛ ناشناس برای یتیمان غذا می‌برد، در شبِ هجرت در بسترِ پیامبر (ص) خوابید و عارفان شیفته‌ی دوستیِ او هستند.',
 poem:[
  ['علی آن شیرِ خدا شاهِ عرب • اُلفتی داشته با این دلِ شب','حضرت علی (ع) که شیرِ خدا و سرورِ عرب بود، با تاریکی و دلِ شب انس و الفت داشته است (شب‌ها به راز و نیاز می‌پرداخت).','فعل: الفت داشته (است)، نهاد: علی؛ با: حرفِ اضافه، «این دلِ شب»: گروهِ متممی (متممِ اصلی: دل). ترکیبِ اضافی: شیرِ خدا، شاهِ عرب، دلِ شب. ترکیبِ وصفی: آن شیر، این دل. آرایه: تشبیه (علی (ع) به شیر؛ ادات و وجهِ شبه حذف شده)، تشخیص (شب مانندِ انسان دل دارد)، کنایه (دلِ شب = نیمه‌شب).',1],
  ['شب ز اسرارِ علی آگاه است • دلِ شب مَحرمِ سِرُّالله است','شب از رازها و مناجات‌های حضرت علی (ع) باخبر است و دلِ شب رازدارِ رازهای او با خداوند است.','جمله‌ی ۱: فعل: است، نهاد: شب، مسند: آگاه؛ ز: حرفِ اضافه، اسرار: متمم؛ ترکیبِ اضافی: اسرارِ علی. جمله‌ی ۲: فعل: است، نهاد: دلِ شب (نهادِ اصلی: دل)، مسند: محرم؛ ترکیبِ اضافی: محرمِ سرالله، دلِ شب. آرایه: تشخیص (آگاه بودن و رازداریِ شب).',2],
  ['شب شنفته است مناجاتِ علی • جوششِ چشمه‌ی عشقِ ازلی','شب، مناجات‌های حضرت علی (ع) و جوششِ عشقِ همیشگیِ او به خدا را که مانندِ چشمه می‌جوشید، شنیده است.','فعل: شنفته است (= شنیده است)، نهاد: شب، مفعول: مناجات (مناجاتِ علی)؛ «جوششِ چشمه‌ی عشقِ ازلی» توضیحِ مناجات است. ترکیبِ اضافی: مناجاتِ علی، جوششِ چشمه، چشمه‌ی عشق. ترکیبِ وصفی: عشقِ ازلی. آرایه: تشخیص (شنیدنِ شب)، تشبیه (مناجات به جوششِ چشمه؛ «چشمه‌ی عشق» اضافه‌ی تشبیهی)، واج‌آرایی (تکرارِ «ش»).',1],
  ['کلماتی چو دُر آویزه‌ی گوش • مسجدِ کوفه هنوزش مدهوش','سخنانِ حضرت علی (ع) مانندِ مروارید آویزه‌ی گوش است و مسجدِ کوفه هنوز از شنیدنِ آن‌ها حیران و مدهوش است.','جمله‌ی ۱: فعلِ «است» حذف شده، نهاد: کلماتی، مسند: آویزه (آویزه‌ی گوش)؛ چو: حرفِ اضافه، دُر: متمم. جمله‌ی ۲: فعلِ «است» حذف شده، نهاد: مسجدِ کوفه، مسند: مدهوش، هنوز: قید. آرایه: تشبیه (کلماتِ علی (ع) به دُر)، کنایه (آویزه‌ی گوش بودن = به خاطر سپردن)، تشخیص (مدهوش شدنِ مسجد).',2],
  ['فجر تا سینه‌ی آفاق شکافت • چشمِ بیدارِ علی خفته نیافت','از زمانی که سپیده‌ی صبح سینه‌ی افق‌ها را شکافت (صبح شد)، چشمِ حضرت علی (ع) را همیشه بیدار دید (او را در حالِ راز و نیاز یافت).','جمله‌ی ۱: تا: حرفِ ربط، فعل: شکافت، نهاد: فجر، مفعول: سینه (سینه‌ی آفاق). جمله‌ی ۲: فعل: نیافت، نهاد: او (فجر)، مفعول: چشم (چشمِ بیدارِ علی)، خفته: قید. ترکیبِ اضافی: سینه‌ی آفاق، چشمِ علی. ترکیبِ وصفی: چشمِ بیدار. آرایه: تشخیص (فجر و آفاق)، تضاد (بیدار و خفته)، کنایه (سینه‌ی آفاق را شکافتن = طلوعِ صبح).',2],
  ['ناشناسی که به تاریکیِ شب • می‌بُرد شامِ یتیمانِ عرب','حضرت علی (ع) همان ناشناسی بود که در تاریکیِ شب برای کودکانِ یتیمِ عرب غذا می‌برد.','فعل: می‌برد، نهاد: ناشناس، مفعول: شام (شامِ یتیمان)؛ به: حرفِ اضافه، تاریکی: متمم. ترکیبِ اضافی: تاریکیِ شب، شامِ یتیمان، یتیمانِ عرب. آرایه: تناسب (شب، شام، تاریکی).',1],
  ['عشق‌بازی که هم‌آغوشِ خطر • خفت در خوابگهِ پیغمبر','حضرت علی (ع) عاشقی بود که با پذیرفتنِ خطرِ مرگ، در بسترِ پیامبر (ص) خوابید.','فعل: خفت، نهاد: عشق‌باز (عشق‌بازی)، هم‌آغوشِ خطر: قید (با پذیرفتنِ خطر)؛ در: حرفِ اضافه، خوابگه: متمم؛ ترکیبِ اضافی: خوابگهِ پیغمبر. آرایه: تلمیح (به «لیلةالمبیت»: شبِ هجرتِ پیامبر (ص) که علی (ع) در بسترِ ایشان خوابید)، تشخیص (خطر آغوش دارد)، تناسب (خفت، خوابگه).',1],
  ['آن دمِ صبحِ قیامت‌تأثیر • حلقه‌ی در شد از او دامن‌گیر','در آن سحرگاهِ شهادت که مانندِ قیامت بود، حلقه‌ی در به دامنِ علی (ع) آویخت و از او خواهش کرد که به مسجد نرود.','فعل: شد، نهاد: حلقه‌ی در، مسند: دامن‌گیر؛ از: حرفِ اضافه، او: متمم؛ «آن دمِ صبحِ قیامت‌تأثیر»: قیدِ زمان. ترکیبِ اضافی: حلقه‌ی در، دمِ صبح. ترکیبِ وصفی: آن دم، صبحِ قیامت‌تأثیر. آرایه: تشخیص (دامن‌گیر شدنِ حلقه‌ی در)، تشبیه (صبحِ شهادت به قیامت)، کنایه (دامن‌گیر شدن = التماس کردن)، تلمیح (به سحرگاهِ نوزدهمِ رمضان و ضربت خوردنِ علی (ع)).',1],
  ['دست در دامنِ مولا زد در • که علی بگذر و از ما مگذر','در، دست به دامنِ مولا علی (ع) زد و گفت: ای علی، از رفتن بگذر و از ما جدا مشو (به مسجد نرو).','جمله‌ی ۱: فعل: زد (دست زد)، نهاد: در، مفعول: دست؛ در: حرفِ اضافه، دامن: متمم؛ ترکیبِ اضافی: دامنِ مولا. جمله‌ی ۲: علی: منادا (= ای علی). جمله‌ی ۳: فعل: بگذر، نهاد: تو. جمله‌ی ۴: فعل: مگذر، نهاد: تو؛ از: حرفِ اضافه، ما: متمم. آرایه: تشخیص (سخن گفتنِ در)، تضاد (بگذر و مگذر)، کنایه (دست در دامنِ کسی زدن = التماس کردن)، جناس (در: حرفِ اضافه / در: دروازه).',4],
  ['شبروان مستِ ولای تو علی • جانِ عالم به فدای تو علی','ای علی، عارفانِ شب‌زنده‌دار شیفته‌ی دوستیِ تو هستند؛ ای علی، جانِ همه‌ی جهانیان فدای تو باد.','جمله‌ی ۱: فعلِ «هستند» حذف شده، نهاد: شبروان، مسند: مست (مستِ ولا)؛ ترکیبِ اضافی: مستِ ولا، ولای تو. جمله‌ی ۲: علی: منادا. جمله‌ی ۳: فعلِ «باد» حذف شده، نهاد: جانِ عالم (نهادِ اصلی: جان)، مسند: به فدای تو. جمله‌ی ۴: علی: منادا. ← ۴ جمله (۲ فعلِ محذوف + ۲ منادا). آرایه: کنایه (شبروان = عارفانِ شب‌زنده‌دار)، تکرار (علی).',4]],
 words:[['الفت','دوستی، انس'],['دلِ شب','نیمه‌شب'],['اسرار','رازها'],['محرم','رازدار'],['سِرّ','راز'],['شنفته','شنیده'],['ازلی','همیشگی، بی‌آغاز'],['آویزه','گوشواره؛ آویزه‌ی گوش: به خاطر سپرده'],['مدهوش','متحیر و حیران'],['فجر','سپیده‌ی صبح'],['آفاق','کرانه‌های آسمان، افق‌ها'],['خفته','خوابیده'],['شام','غذای شب'],['عشق‌باز','عاشق'],['هم‌آغوشِ خطر','کسی که خطر را پذیرفته است'],['خوابگه','جای خواب، بستر'],['قیامت‌تأثیر','دارای تأثیری مانندِ قیامت'],['دامن‌گیر','دامن‌گیرنده، التماس‌کننده'],['مولا','سرور، آقا'],['شبروان','عارفانِ شب‌زنده‌دار'],['ولا','دوستی و محبت']],

 notes:[
  ['تلمیح‌ها','۱) لیلةالمبیت: شبِ هجرتِ پیامبر (ص) از مکه به مدینه که علی (ع) در بسترِ ایشان خوابید. ۲) سحرگاهِ نوزدهمِ رمضان که علی (ع) در مسجدِ کوفه ضربت خورد.'],
  ['کنایه‌ها','دلِ شب: نیمه‌شب — آویزه‌ی گوش بودن: به خاطر سپرده شدن — سینه‌ی آفاق شکافتن: طلوعِ صبح — دامن‌گیر شدن و دست در دامن زدن: التماس کردن — شبروان: عارفانِ شب‌زنده‌دار.'],
  ['تشخیص (جان‌بخشی)','شاعر به شب، مسجدِ کوفه، فجر، خطر و حلقه‌ی در جان بخشیده است.'],
  ['منادا','در بیتِ آخر «علی» دو بار منادا است (ای علی)؛ هر منادا یک جمله به حساب می‌آید.'],
  ['اضافه‌ی تشبیهی','«چشمه‌ی عشق»: عشق مانندِ چشمه است.']],

 hist:[['شهریار','سید محمدحسین بهجت تبریزی (۱۲۸۵ - ۱۳۶۷ هـ.ش)، شاعرِ معاصر. آثار: منظومه‌ی «حیدربابایه سلام» (به ترکی)، شعرِ «علی ای همای رحمت» و غزل‌های فارسی. روزِ درگذشتِ او (۲۷ شهریور) روزِ شعر و ادبِ فارسی است.']],

 msg:'قناعت و زندگی کردن با دسترنجِ خود، همراه با عزتِ نفس، بهتر از ثروتی است که با خواری و خدمتگزاریِ دیگران به دست آید.',
 poem:[
  ['دو برادر، یکی خدمتِ سلطان کردی و دیگری به زورِ بازو نان خوردی.','دو برادر بودند؛ یکی به پادشاه خدمت می‌کرد و دیگری با کار و تلاشِ خود روزی‌اش را به دست می‌آورد.','(نثرِ حکایت) جمله‌ی ۱: «دو برادر (بودند)» ← فعلِ محذوف، نهاد: دو برادر (ترکیبِ وصفی). جمله‌ی ۲: فعل: خدمت کردی (= خدمت می‌کرد)، نهاد: یکی؛ ترکیبِ اضافی: خدمتِ سلطان. جمله‌ی ۳: فعل: خوردی (= می‌خورد)، نهاد: دیگری، مفعول: نان؛ به: حرفِ اضافه، زور: متمم؛ ترکیبِ اضافی: زورِ بازو. آرایه: کنایه (زورِ بازو = کار و تلاشِ خود؛ نان خوردن = امرارِ معاش).',3],
  ['باری، توانگر گفت درویش را که: چرا خدمت نکنی تا از مشقتِ کار کردن بِرَهی؟','یک بار برادرِ ثروتمند به برادرِ فقیر گفت: چرا مانندِ من به پادشاه خدمت نمی‌کنی تا از سختیِ کار کردن رها شوی؟','جمله‌ی ۱: فعل: گفت، نهاد: توانگر، باری (= یک بار): قید؛ «درویش را» یعنی «به درویش» (را: حرفِ اضافه، درویش: متمم). جمله‌ی ۲: فعل: خدمت نکنی، نهاد: تو (محذوف). جمله‌ی ۳: فعل: بِرَهی (= رها شوی)، نهاد: تو؛ از: حرفِ اضافه، مشقت: متمم؛ ترکیبِ اضافی: مشقتِ کار کردن.',3],
  ['گفت: تو چرا کار نکنی تا از مذلتِ خدمت رهایی یابی؟ که خردمندان گفته‌اند: نانِ خود خوردن و نشستن، بِه که کمرِ زرین بستن و به خدمت ایستادن.','برادرِ فقیر پاسخ داد: تو چرا کار نمی‌کنی تا از خواریِ خدمت رها شوی؟ زیرا خردمندان گفته‌اند: از دسترنجِ خود نان خوردن و آسوده نشستن، بهتر از کمربندِ طلایی بستن و به خدمتِ دیگران ایستادن است.','جمله‌ی ۱: فعل: گفت، نهاد: او (محذوف). جمله‌ی ۲: فعل: کار نکنی، نهاد: تو. جمله‌ی ۳: فعل: رهایی یابی، نهاد: تو؛ از: حرفِ اضافه، مذلت: متمم؛ ترکیبِ اضافی: مذلتِ خدمت. جمله‌ی ۴: فعل: گفته‌اند، نهاد: خردمندان. جمله‌ی ۵: فعلِ «است» حذف شده، نهاد: نانِ خود خوردن و نشستن، مسند: بِه؛ «که» به معنیِ «از» (حرفِ اضافه) و «کمرِ زرین بستن و به خدمت ایستادن» متمم است. آرایه: تضاد (نشستن و ایستادن)، کنایه (نانِ خود خوردن = از دسترنجِ خود زندگی کردن؛ کمرِ زرین بستن = آماده‌ی خدمت به ثروتمندان بودن).',5],
  ['به دست آهنِ تفته کردن خمیر • بِه از دست بر سینه پیشِ امیر','آهنِ داغ و گداخته را با دست مانندِ خمیر شکل دادن، بهتر از دست‌به‌سینه در خدمتِ فرمانروا ایستادن است.','فعلِ «است» حذف شده، نهاد: «به دست آهنِ تفته کردن خمیر» (آهنِ داغ را با دست خمیر کردن)، مسند: بِه (بهتر)؛ از: حرفِ اضافه، دست بر سینه: متمم؛ پیشِ: حرفِ اضافه، امیر: متمم. ترکیبِ وصفی: آهنِ تفته. آرایه: کنایه (آهنِ تفته را با دست خمیر کردن = انجامِ کارِ بسیار سخت؛ دست بر سینه بودن = مطیع و خدمتکار بودن).',1],
  ['عمرِ گران‌مایه در این صرف شد • تا چه خورم صیف و چه پوشم شتا','عمرِ باارزشم در این فکر هدر رفت که تابستان چه بخورم و زمستان چه بپوشم.','جمله‌ی ۱: فعل: شد، نهاد: عمرِ گران‌مایه، مسند: صرف؛ در: حرفِ اضافه، این: متمم. جمله‌ی ۲: فعل: خورم، نهاد: من، مفعول: چه، صیف (تابستان): قید. جمله‌ی ۳: فعل: پوشم، نهاد: من، مفعول: چه، شتا (زمستان): قید. ترکیبِ وصفی: عمرِ گران‌مایه. آرایه: تضاد (صیف و شتا).',3],
  ['ای شکمِ خیره به نانی بساز • تا نکنی پشت به خدمت دوتا','ای انسانِ حریص و زیاده‌خواه، با یک تکه نان بساز و قانع باش تا مجبور نشوی برای خدمت به کسی تعظیم کنی.','جمله‌ی ۱: ای: حرفِ ندا، شکم: منادا؛ ترکیبِ وصفی: شکمِ خیره. جمله‌ی ۲: فعل: بساز (= قناعت کن)، نهاد: تو؛ به: حرفِ اضافه، نانی: متمم. جمله‌ی ۳: فعل: دوتا نکنی (= خم نکنی)، نهاد: تو، مفعول: پشت؛ به: حرفِ اضافه، خدمت: متمم. آرایه: تشخیص (سخن گفتن با شکم)، کنایه (پشت دوتا کردن = تعظیم کردن و خود را کوچک کردن)؛ «شکم» استعاره از انسانِ حریص است.',3]],

  ['گل به خنده، گفت: • «زندگی شکفتن است • با زبانِ سبز، راز گفتن است.»','گل با خنده گفت: زندگی مانندِ شکفتنِ گل است؛ یعنی رازِ زندگی را با زبانی شاداب و باطراوت بیان کردن.','جمله‌ی ۱: فعل: گفت، نهاد: گل، «به خنده»: قیدِ حالت (در اینجا «به» حرفِ اضافه به حساب نمی‌آید). جمله‌ی ۲: فعل: است، نهاد: زندگی، مسند: شکفتن. جمله‌ی ۳: فعل: است، نهاد: زندگی (محذوف)، مسند: راز گفتن؛ با: حرفِ اضافه، زبان: متمم؛ ترکیبِ وصفی: زبانِ سبز. آرایه: تشخیص (سخن گفتن و خندیدنِ گل)، کنایه (با زبانِ سبز راز گفتن = بیانِ رازِ زندگی با شادابی)، تناسب (گل، غنچه، شکفتن، سبز). گل نمادِ آدمِ باتجربه است.',3],
  ['گفت‌وگوی غنچه و گل از درونِ باغچه • باز هم به گوش می‌رسد.','گفت‌وگوی غنچه و گل درباره‌ی زندگی، همچنان از باغچه شنیده می‌شود.','فعل: می‌رسد، نهاد: گفت‌وگو (گفت‌وگوی غنچه و گل)، باز هم: قید؛ از درونِ: حرفِ اضافه، باغچه: متمم؛ به: حرفِ اضافه، گوش: متمم. ترکیبِ اضافی: گفت‌وگوی غنچه. آرایه: کنایه (به گوش رسیدن = شنیده شدن)، تشخیص.',1],
  ['تو چه فکر می‌کنی؟ • راستی کدام‌یک درست گفته‌اند؟','(شاعر از خواننده می‌پرسد:) تو چه فکر می‌کنی؟ به‌راستی کدام‌یک درست گفته‌اند؟','جمله‌ی ۱: فعل: فکر می‌کنی، نهاد: تو؛ «چه فکر» ترکیبِ وصفی. جمله‌ی ۲: فعل: گفته‌اند، نهاد: کدام‌یک، راستی و درست: قید.',2],
  ['من که فکر می‌کنم • «گل» به رازِ زندگی اشاره کرده است','من فکر می‌کنم «گل» به رازِ زندگی اشاره کرده است.','جمله‌ی ۱: فعل: فکر می‌کنم، نهاد: من. جمله‌ی ۲: فعل: اشاره کرده است، نهاد: گل؛ به: حرفِ اضافه، راز: متمم؛ ترکیبِ اضافی: رازِ زندگی. آرایه: تشخیص (اشاره کردنِ گل).',2],
  ['هر چه باشد، او گل است • گل یکی‌دو پیرهن بیشتر ز غنچه پاره کرده است.','به هر حال او گلِ شکفته است و تجربه‌اش در زندگی از غنچه‌ی نوجوان و بی‌تجربه بیشتر است.','جمله‌ی ۱: فعل: باشد، نهاد: هر چه. جمله‌ی ۲: فعل: است، نهاد: او، مسند: گل. جمله‌ی ۳: فعل: پاره کرده است، نهاد: گل، مفعول: پیرهن (یکی‌دو پیرهن)، بیشتر: قیدِ مقدار؛ ز: حرفِ اضافه، غنچه: متمم. آرایه: کنایه (پیرهن پاره کردن = تجربه داشتن)، ارسال‌المثل (به کار بردنِ ضرب‌المثلِ «یکی‌دو پیرهن بیشتر پاره کرده» در شعر)، تشخیص.',3]],

L.l15={id:'l15',t:'میوه‌ی هنر',d:'درسِ پانزدهم',k:'شعر',icon:'🍎',color:'#4338ca',

 msg:'میوه‌ی درختِ وجودِ انسان، دانش و حکمت است؛ همان‌طور که درختِ بی‌میوه سزاوارِ سوختن است، انسانِ بی‌دانش و بی‌عمل هم سرانجامِ خوبی ندارد. کارِ نیک از حرفِ بی‌عمل بهتر است.',
 poem:[
  ['آن قصه شنیدید که در باغ یکی روز • از جورِ تبر زار بنالید سپیدار','آیا آن داستان را شنیده‌اید که روزی در باغ، درختِ سپیدار از ستمِ تبر سخت ناله کرد؟','جمله‌ی ۱: فعل: شنیدید، نهاد: شما (محذوف)، مفعول: قصه (آن قصه). جمله‌ی ۲: که: حرفِ ربط، فعل: بنالید، نهاد: سپیدار، زار: قیدِ حالت، یکی روز: قیدِ زمان؛ در: حرفِ اضافه، باغ: متمم؛ از: حرفِ اضافه، جور: متمم. ترکیبِ وصفی: آن قصه. ترکیبِ اضافی: جورِ تبر. آرایه: تشخیص (ستمِ تبر و ناله کردنِ سپیدار).',2],
  ['کز من نه دگر بیخ و بنی ماند و نه شاخی • از تیشه‌ی هیزم‌شکن و ارّه‌ی نجار','که از دستِ تیشه‌ی هیزم‌شکن و ارّه‌ی نجار، دیگر برای من نه ریشه‌ای مانده و نه شاخه‌ای.','جمله‌ی ۱: کز = که + از؛ فعل: ماند، نهاد: بیخ و بن؛ از: حرفِ اضافه، من: متمم؛ «نه» و «دگر»: قید. جمله‌ی ۲: فعلِ «ماند» حذف شده، نهاد: شاخ (شاخی). از: حرفِ اضافه، تیشه و ارّه: متمم. ترکیبِ اضافی: تیشه‌ی هیزم‌شکن، ارّه‌ی نجار. آرایه: تناسب (بیخ، بن، شاخ، تیشه، ارّه، هیزم‌شکن، نجار)، تشخیص.',2],
  ['گفتش تبر آهسته که جرمِ تو همین بس • کاین موسمِ حاصل بُوَد و نیست تو را بار','تبر آهسته به او گفت: گناهِ تو همین بس که اکنون فصلِ میوه دادن است و تو میوه‌ای نداری.','جمله‌ی ۱: فعل: گفت، نهاد: تبر، آهسته: قید؛ «ـَش» در «گفتش» = به او. جمله‌ی ۲: که: حرفِ ربط، فعلِ «است» حذف شده، نهاد: جرمِ تو، مسند: همین بس. جمله‌ی ۳: کاین = که + این؛ فعل: بُوَد، نهاد: این، مسند: موسم (موسمِ حاصل). جمله‌ی ۴: «نیست تو را بار» = بار (میوه) نداری. ترکیبِ اضافی: جرمِ تو، موسمِ حاصل. آرایه: تشخیص (سخن گفتنِ تبر).',4],
  ['تا شام نیفتاد صدای تبر از گوش • شد توده در آن باغ سحر هیمه‌ی بسیار','تا شب صدای تبر قطع نشد و سحرگاه در آن باغ، هیزمِ بسیاری روی هم انباشته شد.','جمله‌ی ۱: فعل: نیفتاد، نهاد: صدا (صدای تبر)؛ تا: حرفِ اضافه، شام: متمم؛ از: حرفِ اضافه، گوش: متمم. جمله‌ی ۲: فعل: شد، نهاد: هیمه (هیمه‌ی بسیار)، مسند: توده، سحر: قیدِ زمان؛ در: حرفِ اضافه، باغ: متمم. ترکیبِ وصفی: هیمه‌ی بسیار، آن باغ. آرایه: کنایه (صدا از گوش نیفتادن = قطع نشدنِ صدا)، تضاد (شام و سحر)، تناسب (تبر، هیمه، باغ).',2],
  ['دهقان چو تنورِ خود از این هیمه برافروخت • بگریست سپیدار و چنین گفت دگربار','وقتی کشاورز تنورِ خود را با این هیزم روشن کرد، سپیدار گریه کرد و دوباره چنین گفت:','جمله‌ی ۱: چو (= هنگامی که): حرفِ ربط، فعل: برافروخت، نهاد: دهقان، مفعول: تنور (تنورِ خود)؛ از: حرفِ اضافه، هیمه: متمم. جمله‌ی ۲: فعل: بگریست، نهاد: سپیدار. جمله‌ی ۳: فعل: گفت، نهاد: سپیدار (محذوف)، چنین: قیدِ حالت، دگربار: قیدِ تکرار. ترکیبِ اضافی: تنورِ خود. ترکیبِ وصفی: این هیمه. آرایه: تشخیص (گریستنِ سپیدار)، تناسب (تنور، هیمه، برافروختن).',3],
  ['آوخ که شدم هیزم و آتشگرِ گیتی • اندامِ مرا سوخت چنین ز آتشِ ادبار','افسوس که هیزم شدم و روزگارِ آتش‌افروز، اندامِ مرا این‌گونه در آتشِ بدبختی سوزاند.','جمله‌ی ۱: آوخ: شبه‌جمله (= افسوس). جمله‌ی ۲: که: حرفِ ربط، فعل: شدم، نهاد: من، مسند: هیزم. جمله‌ی ۳: فعل: سوخت (= سوزاند)، نهاد: آتشگرِ گیتی، مفعول: اندام (اندامِ مرا)، چنین: قیدِ حالت؛ ز: حرفِ اضافه، آتش: متمم. ترکیبِ اضافی: آتشگرِ گیتی، آتشِ ادبار. آرایه: اضافه‌ی تشبیهی (آتشِ ادبار: ادبار مانندِ آتش؛ آتشگرِ گیتی: گیتی مانندِ آتش‌افروز)، تشخیص، تناسب (هیزم، آتش، سوختن).',3],
  ['خندید بر او شعله که از دستِ که نالی؟ • ناچیزیِ تو کرد بدین‌گونه تو را خوار','شعله به او خندید و گفت: از دستِ چه کسی شکایت می‌کنی؟ بی‌ارزشیِ خودت، تو را این‌گونه پست و خوار کرد.','جمله‌ی ۱: فعل: خندید، نهاد: شعله؛ بر: حرفِ اضافه، او: متمم. جمله‌ی ۲: که: حرفِ ربط، فعل: نالی (= می‌نالی)، نهاد: تو؛ از دستِ: حرفِ اضافه، که (چه کسی): متمم. جمله‌ی ۳: فعل: خوار کرد، نهاد: ناچیزی (ناچیزیِ تو)، مفعول: تو، بدین‌گونه: قیدِ حالت؛ «خوار»: تمیز. آرایه: تشخیص (خندیدن و سخن گفتنِ شعله).',3],
  ['آن شاخ که سر برکشد و میوه نیارد • فرجام به‌جز سوختنش نیست سزاوار','شاخه‌ای که رشد کند و بالا برود اما میوه ندهد، سرانجام جز سوختن سزاوارِ چیزی نیست.','جمله‌ی ۱ و ۲: «که سر برکشد و میوه نیارد» ← فعل‌ها: سر برکشد، نیارد (= نیاورد)، نهاد: شاخ (محذوف)، مفعول: میوه. جمله‌ی ۳: فعل: نیست، نهاد: آن شاخ، مسند: سزاوار، فرجام (= سرانجام): قید؛ به‌جز: حرفِ اضافه، سوختن: متمم. ← ۳ جمله (سه فعل). ترکیبِ وصفی: آن شاخ. آرایه: کنایه (سر برکشیدن = رشد کردن)، تمثیل (انسانِ بی‌حاصل مانندِ شاخه‌ی بی‌میوه است).',3],
  ['جز دانش و حکمت نبُوَد میوه‌ی انسان • ای میوه‌فروشِ هنر، این دکه و بازار!','میوه و حاصلِ وجودِ انسان چیزی جز دانش و حکمت نیست؛ ای کسی که هنر و دانش اندوخته‌ای، اینجا دکان و بازار است (اکنون زمانِ نشان دادنِ دانش و هنرِ توست).','جمله‌ی ۱: فعل: نبُوَد (= نیست)، نهاد: میوه (میوه‌ی انسان)؛ جز: حرفِ اضافه، دانش و حکمت: متمم. جمله‌ی ۲: ای: حرفِ ندا، میوه‌فروشِ هنر: منادا. جمله‌ی ۳: «این دکه و بازار (است)» ← فعلِ «است» حذف شده. ترکیبِ اضافی: میوه‌ی انسان، میوه‌فروشِ هنر. آرایه: تشبیه (دانش و حکمت به میوه؛ دنیا به دکه و بازار)، تناسب (میوه، میوه‌فروش، دکه، بازار).',3],
  ['از گفته‌ی ناکرده و بیهوده چه حاصل؟ • کردارِ نکو کن که نه سودی است ز گفتار','از سخنی که به آن عمل نشود و بیهوده باشد، چه فایده‌ای به دست می‌آید؟ کارِ نیک انجام بده؛ زیرا از حرفِ تنها سودی حاصل نمی‌شود.','جمله‌ی ۱: فعلِ «است» حذف شده، نهاد: چه حاصل؛ از: حرفِ اضافه، گفته: متمم؛ ترکیبِ وصفی: گفته‌ی ناکرده، گفته‌ی بیهوده، چه حاصل. جمله‌ی ۲: فعل: کن (امر)، نهاد: تو، مفعول: کردار (کردارِ نکو). جمله‌ی ۳: که: حرفِ ربط، فعل: است، نهاد: سود، «نه»: قیدِ نفی؛ ز: حرفِ اضافه، گفتار: متمم. آرایه: تضاد (کردار و گفتار).',3],
  ['آسان گذرد گر شب و روز و مه و سالت • روزِ عمل و مزد بُوَد کارِ تو دشوار','اگر شب و روز و ماه و سالِ تو به آسانی و بی‌تلاش بگذرد، در روزِ حساب و پاداش (قیامت)، کارِ تو دشوار خواهد بود.','جمله‌ی ۱: گر: حرفِ شرط، فعل: گذرد، نهاد: شب و روز و مه و سال (سالت)، آسان: قیدِ حالت. جمله‌ی ۲: فعل: بُوَد، نهاد: کارِ تو، مسند: دشوار، روزِ عمل و مزد: قیدِ زمان. ترکیبِ اضافی: سالت، روزِ عمل، کارِ تو. آرایه: تضاد (آسان و دشوار؛ شب و روز)، تناسب (شب، روز، مه، سال؛ عمل، مزد، کار)، تلمیح (به روزِ قیامت).',2]],

  ['گویند روزی افلاطون نشسته بود. مردی نزدِ او آمد و نشست و شروع کرد به حرف زدن. در میانه‌ی سخن گفت: «ای حکیم! امروز فلان مرد را دیدم که سخنِ تو می‌گفت و تو را دعا می‌کرد و چنین می‌گفت: افلاطون بزرگ‌مردی است که هرگز کس چون او نبوده است و نباشد. خواستم که شکر و سپاسِ او را به تو رسانم.»','می‌گویند روزی افلاطون نشسته بود. مردی پیشِ او آمد و شروع به حرف زدن کرد و گفت: ای دانا! امروز فلانی را دیدم که از تو تعریف می‌کرد و برایت دعا می‌کرد و می‌گفت: افلاطون بزرگ‌مردی است که هرگز کسی مانندِ او نبوده و نخواهد بود. خواستم تشکر و ستایشِ او را به گوشِ تو برسانم.'],

 msg:'خواندن و شنیدنِ قصه فایده‌های بسیار دارد و قصه‌گویی و شعرخوانی آدابی دارد که باید رعایت شود.',
 prose:[
  ['بدان که قصه خواندن و شنیدن فایده‌ی بسیار دارد: اول آنکه از احوالِ گذشتگان خبردار شود.','آگاه باش که داستان خواندن و شنیدن فایده‌های زیادی دارد: فایده‌ی اول این است که انسان از سرگذشتِ پیشینیان آگاه می‌شود.'],
  ['دویم آنکه چون عجایب بشنود، نظرِ او به قدرتِ الهی گشاده گردد.','فایده‌ی دوم این است که وقتی انسان شگفتی‌های جهان را می‌شنود، شناختش از قدرتِ خداوند بیشتر می‌شود.'],
  ['سیُم، چون محنت و شدتِ گذشتگان شنود، داند که هیچ‌کس از بندِ محنت آزاد نبوده است؛ او را تسلی باشد.','فایده‌ی سوم این است که وقتی از رنج و سختیِ پیشینیان می‌شنود، می‌فهمد که هیچ‌کس بی‌رنج نبوده است و غمش کم می‌شود.'],
  ['چهارم، چون زوالِ مُلک و مالِ سلاطینِ گذشته شنود، دل از مالِ دنیا و دنیا بردارد و داند که با کس وفا نکرده و نخواهد کرد.','فایده‌ی چهارم این است که وقتی از نابودیِ کشور و ثروتِ پادشاهانِ گذشته می‌شنود، به مالِ دنیا دل نمی‌بندد؛ زیرا می‌داند دنیا به هیچ‌کس وفادار نبوده و نخواهد بود.'],
  ['پنجم، عبرتِ بسیار و تجربه‌ی بی‌شمار او را حاصل شود.','فایده‌ی پنجم این است که پند و تجربه‌ی فراوانی به دست می‌آورد.'],
  ['و خدای تعالی با حضرتِ رسول (ص) می‌گوید: «ای محمد، ما از قصه‌های رسولان و خبرهای پیغمبران بر تو می‌خوانیم؛ آنچه بدان دل را ثابت گردانیم و فایده‌های کلی تو را حاصل گردد.» (قرآنِ کریم، سوره‌ی هود، آیه‌ی ۱۲۰)','خداوند به پیامبر (ص) می‌فرماید: ای محمد، ما سرگذشتِ پیامبرانِ پیشین را برای تو بازگو می‌کنیم تا دلت را استوار کنیم و فایده‌های فراوان به تو برسد.'],
  ['اگر پرسند که قصه‌خوانی چند نوع است، بگوی دو نوع: اول حکایت و دویم نظم.','اگر پرسیدند قصه‌گویی چند نوع است، بگو دو نوع: نوعِ اول به صورتِ حکایت (نثر) و نوعِ دوم به صورتِ شعر.'],
  ['اگر پرسند که آدابِ حکایت‌گویان چند است، بگوی: اول آنکه قصه‌ای که ادا خواهد کرد، باید که بر استاد خوانده باشد و با خود تکرار کرده باشد تا فرو نماند. دویم آنکه چست و چالاک به سخن درآید و خام نباشد.','اگر پرسیدند آدابِ حکایت‌گویی چیست، بگو: اول اینکه قصه‌ای را که می‌خواهد بگوید، پیش‌تر نزدِ استاد خوانده و با خود تمرین کرده باشد تا هنگامِ گفتن درنماند. دوم اینکه با چابکی و مهارت سخن بگوید و بی‌تجربه نباشد.'],
  ['سیُم باید که داند که جماعت لایقِ چه نوع سخن است؛ بیشتر از آن گوید که مردم راغبِ آن باشند.','سوم اینکه بداند چه سخنی برای شنوندگان مناسب است و بیشتر از چیزی بگوید که مردم به آن علاقه دارند.'],
  ['چهارم، نثر را وقت‌وقت به نظم آراسته گرداند که بزرگان گفته‌اند: نظم در قصه‌خوانی چون نمک است در دیگ؛ اگر کم باشد طعام بی‌مزه بُوَد و اگر بسیار گردد شور شود؛ پس اعتدال نگاه باید داشت.','چهارم اینکه گاه‌گاه در میانِ قصه شعر هم بیاورد؛ زیرا بزرگان گفته‌اند: شعر در قصه‌گویی مانندِ نمک در غذاست؛ اگر کم باشد غذا بی‌مزه می‌شود و اگر زیاد باشد شور می‌شود؛ پس باید میانه‌روی کرد.'],
  ['پنجم، سخنانِ محال و گزاف نگوید که در چشمِ مردم سبک شود.','پنجم اینکه سخنانِ غیرممکن و بیهوده نگوید، که ارزشش در چشمِ مردم کم می‌شود.'],
  ['اگر پرسند که آدابِ نظم‌خوانی چند است، بگوی: اول آنکه به آهنگ خوانَد. دویم، سخن را در دلِ مردم بنشاند. سیُم، اگر بیتی مشکل پیش آید، شرحِ آن با حاضران بگوید.','اگر پرسیدند آدابِ شعرخوانی چیست، بگو: اول اینکه شعر را با وزن و آهنگ بخواند. دوم اینکه طوری بخواند که بر دلِ مردم اثر کند. سوم اینکه اگر بیتی دشوار بود، معنی‌اش را برای حاضران توضیح دهد.'],
  ['چهارم، چنان نکند که مستمع ملول گردد. پنجم، صاحبِ آن نظم را در اول یا آخر یاد کند و فاتحه و تکبیر گوید.','چهارم اینکه طوری نخواند که شنونده خسته و آزرده شود. پنجم اینکه در آغاز یا پایانِ شعر، نامِ شاعرِ آن را بیاورد و برایش فاتحه و تکبیر بگوید.']],
