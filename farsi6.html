 poem:[
  ['به گیتی بِه از راستی پیشه نیست • ز کژی بَتَر هیچ اندیشه نیست','در جهان هیچ کار و پیشه‌ای بهتر از راستی نیست و هیچ فکر و اندیشه‌ای بدتر از ناراستی و دروغ نیست.','جمله‌ی ۱: فعل: نیست، نهاد: پیشه، مسند: بِه (بهتر)؛ به: حرفِ اضافه، گیتی: متمم؛ از: حرفِ اضافه، راستی: متمم. جمله‌ی ۲: فعل: نیست، نهاد: اندیشه (هیچ اندیشه)، مسند: بتر (بدتر)؛ ز: حرفِ اضافه، کژی: متمم. ترکیبِ وصفی: هیچ اندیشه (هیچ: صفتِ مبهم). آرایه: تضاد (راستی و کژی؛ بِه و بتر).',2],
  ['سخن گفتنِ کژ ز بیچارگی است • به بیچارگان بر بباید گریست','دروغ گفتن و کج‌گویی از بدبختی و درماندگیِ انسان است و باید به حالِ این بیچارگان گریست.','جمله‌ی ۱: فعل: است، نهاد: سخن گفتنِ کژ (نهادِ اصلی: سخن گفتن)، مسند: ز بیچارگی. جمله‌ی ۲: فعل: بباید گریست؛ به … بر: حرفِ اضافه، بیچارگان: متمم. ترکیبِ وصفی: سخن گفتنِ کژ. نکته: «به بیچارگان بر» یعنی «بر بیچارگان» (دو حرفِ اضافه برای یک متمم، به شیوه‌ی کهن).',2],
  ['هر آن کو که گردد به گِردِ دروغ • ستمکاره خوانیمش و بی‌فروغ','هر کسی که به دنبالِ دروغ برود، او را ستمکار و بی‌آبرو (تاریک‌دل) می‌نامیم.','جمله‌ی ۱: فعل: گردد، نهاد: او (کو = که او)؛ به گِردِ: حرفِ اضافه، دروغ: متمم؛ ترکیبِ وصفی: هر آن. جمله‌ی ۲: فعل: خوانیم، نهاد: ما، مفعول: ـَش (او)، ستمکاره: تمیز. جمله‌ی ۳: فعلِ «خوانیم» حذف شده، بی‌فروغ: تمیز. تمیز: کلمه‌ای شبیهِ مسند که با فعل‌های غیراسنادی (خواندن، نامیدن، دانستن) می‌آید. آرایه: جناس (گردد و گِرد).',3],
  ['همه راستی کن که از راستی • نیاید به کار اندرون کاستی','همیشه راستی پیشه کن؛ زیرا از راستی هیچ کم و کاستی در کارها پیش نمی‌آید.','جمله‌ی ۱: فعل: راستی کن (امر)، نهاد: تو (محذوف)، همه: قیدِ تأکید. جمله‌ی ۲: که: حرفِ ربط، فعل: نیاید، نهاد: کاستی؛ از: حرفِ اضافه، راستی: متمم؛ به … اندرون (= در): حرفِ اضافه، کار: متمم. آرایه: تکرار (راستی)، جناس (راستی و کاستی).',2],
  ['هر آن کس که با تو نگوید درست • چنان دان که او دشمنِ جانِ توست','هر کسی که با تو راست نگوید، بدان که او دوستِ تو نیست، بلکه دشمنِ جانِ توست.','جمله‌ی ۱: فعل: نگوید، نهاد: کس (هر آن کس)، درست: قید؛ با: حرفِ اضافه، تو: متمم. جمله‌ی ۲: فعل: دان (امر)، نهاد: تو (محذوف)، چنان: قیدِ حالت. جمله‌ی ۳: که: حرفِ ربط، فعل: است (در «توست»)، نهاد: او، مسند: دشمن (دشمنِ جان). ترکیبِ وصفی: هر آن کس. ترکیبِ اضافی: دشمنِ جان، جانِ تو.',3],
  ['گشاده است بر ما درِ راستی • چه کوبیم خیره درِ کاستی؟','درِ راستی همیشه به روی ما باز است؛ پس چرا بیهوده درِ کاستی و دروغ را بکوبیم؟','جمله‌ی ۱: فعل: است، نهاد: درِ راستی (نهادِ اصلی: در)، مسند: گشاده؛ بر: حرفِ اضافه، ما: متمم. جمله‌ی ۲: فعل: کوبیم، نهاد: ما، مفعول: در (درِ کاستی)، خیره (= بیهوده): قیدِ حالت، چه (= چرا): قیدِ پرسشی. ترکیبِ اضافی: درِ راستی، درِ کاستی. آرایه: اضافه‌ی تشبیهی (راستی و کاستی مانندِ خانه‌ای که در دارد)، تضاد (راستی و کاستی)، پرسشِ انکاری.',2],
  ['مکن دوستی با دروغ‌آزمای • همان نیز با مردِ ناپاک‌رای','با انسانِ دروغگو دوستی نکن و همچنین با کسی که اندیشه‌ی ناپاک دارد (دوستی مکن).','جمله‌ی ۱: فعل: دوستی مکن (نهی)، نهاد: تو (محذوف)؛ با: حرفِ اضافه، دروغ‌آزمای: متمم. جمله‌ی ۲: فعلِ «دوستی مکن» حذف شده؛ «همان نیز»: قیدِ تأکید؛ با: حرفِ اضافه، مرد: متمم. ترکیبِ وصفی: مردِ ناپاک‌رای.',2]],

L.l17={id:'l17',t:'ستاره‌ی روشن',d:'درسِ هفدهم',k:'نثر کهن',icon:'🌟',color:'#7c3aed',
 info:[['نویسنده','ابوالفضل بیهقی'],['کتاب','تاریخِ بیهقی'],['نوع','نثرِ کهن']],
 msg:'بزرگمهرِ حکیم برای دانایان «ستاره‌ی روشن» بود که راهِ راست را نشان می‌داد؛ او وصیت کرد: خدا را به یگانگی بشناسید، نیکوکار و راستگو باشید، از بدی و عیب‌جویی دوری کنید، خوش‌خو باشید و بزرگ‌تران را گرامی بدارید.',
 prose:[
  ['چنان خواندم که چون بزرگمهرِ حکیم، برادران را وصیت کرد که: «در کُتُب خوانده‌ام که آخرالزمان پیغامبری خواهد آمد، نامِ او محمدِ مصطفی (ص). اگر روزگار یابم، نخست کسی من باشم که بدو گِرَوَم؛ شما هم فرزندانِ خود را چنین وصیت کنید تا بهشت یابید.»','در جایی خوانده‌ام که بزرگمهرِ حکیم به برادرانش سفارش کرد: در کتاب‌ها خوانده‌ام که در آخرالزمان پیامبری به نامِ محمدِ مصطفی (ص) خواهد آمد؛ اگر در آن زمان زنده باشم، نخستین کسی خواهم بود که به او ایمان می‌آورد؛ شما هم به فرزندانتان همین را سفارش کنید تا به بهشت بروید.'],
  ['حکما و علما نزدیکِ وی می‌آمدند و می‌گفتند که ما را از علمِ خویش بهره دادی و هیچ چیز دریغ نداشتی تا دانا شدیم؛ ستاره‌ی روشنِ ما بودی که ما را راهِ راست نمودی. ما را یادگاری ده از علمِ خویش.','دانشمندان و عالمان نزدِ او می‌آمدند و می‌گفتند: ما را از دانشِ خود بهره‌مند کردی و چیزی را از ما دریغ نکردی تا دانا شدیم؛ برای ما مانندِ ستاره‌ای روشن بودی که راهِ درست را نشانمان می‌داد؛ از دانشِ خودت یادگاری به ما بده.'],
  ['گفت: وصیت کنم شما را که خدای عزّوجل را به یگانگی شناسید و وی را اطاعت دارید و بدانید که کردارِ زشت و نیکوی شما می‌بیند و آنچه در دل دارید، می‌داند و زندگانیِ شما به فرمانِ اوست.','گفت: به شما سفارش می‌کنم که خداوندِ عزیز و بزرگوار را یگانه بدانید و از فرمانش پیروی کنید و بدانید که کارهای خوب و بدِ شما را می‌بیند و آنچه در دل دارید، می‌داند و زندگیِ شما در دستِ اوست.'],
  ['نیکویی گویید و نیکوکاری کنید که خدای عزّوجل که شما را آفرید، برای نیکی آفرید؛ و زینهار تا بدی نکنید و از بدان دور باشید که بدکننده را زندگانی کوتاه باشد؛ و پارسا باشید و چشم و گوش و دست از حرام و مالِ مردمان دور دارید.','سخنِ خوب بگویید و کارِ خوب کنید؛ زیرا خداوند شما را برای نیکی آفریده است. هوشیار باشید که بدی نکنید و از آدم‌های بد دوری کنید؛ زیرا بدکار عمرِ درازی ندارد. پرهیزگار باشید و چشم و گوش و دستِ خود را از حرام و مالِ مردم دور نگه دارید.'],
  ['راست گفتن پیشه گیرید که روی را روشن دارد و مردمان راستگویان را دوست دارند و راستگوی هلاک نشود؛ و از دروغ گفتن دور باشید که دروغ‌زن ارچه گواهیِ راست دهد، نپذیرند.','راستگو باشید؛ زیرا راستی چهره را روشن و سربلند می‌کند، مردم راستگویان را دوست دارند و راستگو نابود نمی‌شود؛ و از دروغ دوری کنید؛ زیرا دروغگو اگر گواهیِ راست هم بدهد، از او نمی‌پذیرند.'],
  ['و مردمان را عیب مکنید که هیچ‌کس بی‌عیب نیست؛ هر که از عیبِ خود نابینا شد، نادان‌ترِ مردم باشد. و خوی نیک بزرگ‌ترین عطاهای خدای است عزّوجل؛ و از خوی بد دور باشید که بندِ گران است بر دل و بر پای. همیشه بدخو در رنجِ بزرگ باشد و مردمان از وی به رنج؛ و نیکوخوی در هر دو جهان ستوده است. و هر که از شما به زاد بزرگ‌تر باشد، وی را بزرگ‌تر دارید و حرمتِ او نگاه دارید.','از مردم عیب‌جویی نکنید؛ زیرا هیچ‌کس بی‌عیب نیست و هر کس عیبِ خود را نبیند، نادان‌ترین مردم است. اخلاقِ خوب بزرگ‌ترین بخششِ خداوند است؛ از اخلاقِ بد دوری کنید که مانندِ زنجیری سنگین بر دل و پای است. آدمِ بداخلاق همیشه هم خودش در رنج است و هم دیگران از او رنج می‌برند؛ و آدمِ خوش‌اخلاق در دنیا و آخرت ستوده است. هر کس از شما بزرگ‌تر است، او را گرامی‌تر بدارید و احترامش را نگه دارید.']],

 msg:'پادشاهی و خدایی تنها از آنِ خداوند است؛ او پناهِ همه‌ی هستی، آفریننده‌ی هر چیز و روشن‌کننده‌ی چراغِ هدایت است و جهان را بی‌نیاز از یاری آفریده است. از او می‌خواهیم راهی پیشِ پایمان بگذارد که به رستگاری برسیم.',
 poem:[
  ['خدایا جهان‌پادشاهی تو راست • ز ما خدمت آید، خدایی تو راست','خداوندا، پادشاهیِ جهان از آنِ توست و خدایی شایسته‌ی توست؛ از ما فقط بندگی و خدمت برمی‌آید.','جمله‌ی ۱: خدایا: منادا («ا»: حرفِ ندا). جمله‌ی ۲: «تو راست» = تو را است (از آنِ توست)؛ نهاد: جهان‌پادشاهی، مسند: تو را. جمله‌ی ۳: فعل: آید، نهاد: خدمت؛ ز: حرفِ اضافه، ما: متمم. جمله‌ی ۴: نهاد: خدایی، مسند: تو را، فعل: است. آرایه: تلمیح (به آیه‌ی «وَ لِلّهِ مُلکُ السَّماواتِ وَ الأرض»)، تضاد (خدایی و خدمت).',4],
  ['پناهِ بلندی و پستی تویی • همه نیستند، آنچه هستی تویی','تو نگهبان و پناهِ آسمانِ بلند و زمینِ پست هستی؛ همه‌ی موجودات فانی‌اند و آنچه همیشه هست، تنها تویی.','جمله‌ی ۱: «تویی» = تو هستی؛ نهاد: تو، مسند: پناه (پناهِ بلندی و پستی). جمله‌ی ۲: فعل: نیستند، نهاد: همه. جمله‌ی ۳ و ۴: «آنچه هستی، تویی» = آنچه به‌راستی هست، تو هستی؛ فعل‌ها: هستی و ـی (در «تویی»). ← ۴ جمله. ترکیبِ اضافی: پناهِ بلندی. آرایه: تضاد (بلندی و پستی؛ نیستند و هستی).',4],
  ['همه آفریدست بالا و پست • تویی آفریننده‌ی هر چه هست','خداوند همه‌ی بالا و پست (آسمان و زمین) را آفریده است؛ تو آفریننده‌ی هر چیزی هستی که وجود دارد.','جمله‌ی ۱: فعل: آفریدست (= آفریده است)، نهاد: او (محذوف)، مفعول: همه (بالا و پست). جمله‌ی ۲: «تویی» = تو هستی؛ نهاد: تو، مسند: آفریننده. جمله‌ی ۳: فعل: هست، نهاد: هر چه. ← ۳ جمله. ترکیبِ اضافی: آفریننده‌ی هر چه. آرایه: تضاد (بالا و پست).',3],
  ['خرد را تو روشن‌بصر کرده‌ای • چراغِ هدایت تو برکرده‌ای','تو چشمِ عقل و خرد را بینا کرده‌ای و چراغِ هدایت را تو روشن کرده‌ای.','جمله‌ی ۱: فعل: روشن‌بصر کرده‌ای، نهاد: تو، مفعول: خرد. جمله‌ی ۲: فعل: برکرده‌ای (= روشن کرده‌ای)، نهاد: تو، مفعول: چراغ (چراغِ هدایت). آرایه: اضافه‌ی تشبیهی (چراغِ هدایت: هدایت مانندِ چراغ)، تشخیص (خرد مانندِ جانداری که چشم دارد)، تناسب (روشن، بصر، چراغ).',2],
  ['جهانی بدین خوبی آراستی • برون زان که یاریگری خواستی','جهانی به این زیبایی آفریدی و آراستی، بدونِ آنکه از کسی یاری بخواهی.','جمله‌ی ۱: فعل: آراستی، نهاد: تو (محذوف)، مفعول: جهانی، بدین خوبی: قیدِ حالت. جمله‌ی ۲: فعل: خواستی، نهاد: تو، مفعول: یاریگر؛ «برون زان که» = بی‌آنکه. مخفف‌ها: بدین (به این)، برون (بیرون)، زان (از آن).',2],
  ['خداوندِ مایی و ما بنده‌ایم • به نیروی تو یک‌به‌یک زنده‌ایم','تو خداوندِ ما هستی و ما بندگانِ توییم؛ همه‌ی ما یکایک به نیروی تو زنده‌ایم.','جمله‌ی ۱: «ـی» در «مایی» = هستی؛ نهاد: تو (محذوف)، مسند: خداوند (خداوندِ ما). جمله‌ی ۲: «ـیم» = هستیم؛ نهاد: ما، مسند: بنده. جمله‌ی ۳: «ـیم» = هستیم؛ نهاد: ما (محذوف)، مسند: زنده، یک‌به‌یک: قید؛ به: حرفِ اضافه، نیرو: متمم؛ ترکیبِ اضافی: نیروی تو. آرایه: تضاد (خداوند و بنده).',3],
  ['رهی پیشم آور که فرجامِ کار • تو خشنود باشی و ما رستگار','خدایا، راهی پیشِ پایم بگذار که در پایانِ کار، تو از ما خشنود باشی و ما رستگار شویم.','جمله‌ی ۱: فعل: آور (امر)، نهاد: تو (محذوف)، مفعول: رهی (= راهی)؛ «پیشم» = پیشِ من. جمله‌ی ۲: فعل: باشی، نهاد: تو، مسند: خشنود، فرجامِ کار: قیدِ زمان. جمله‌ی ۳: فعلِ «باشیم» حذف شده، نهاد: ما، مسند: رستگار. ترکیبِ اضافی: فرجامِ کار.',3]],

function confetti(){
 var cv=$('#confetti');if(!cv||!cv.getContext)return;
 var ctx=cv.getContext('2d');if(!ctx)return;
 cv.width=innerWidth;cv.height=innerHeight;
 var cols=['#ffd76e','#ff7ab8','#6ee7ff','#9dff8a','#b39bff','#ff9d4d','#fff'];
 var ps=[];for(var i=0;i<130;i++){ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,r:4+Math.random()*6,c:cols[i%cols.length],v:2+Math.random()*3.5,w:Math.random()*6-3,o:1});}
 var t0=Date.now();
 (function fr(){ctx.clearRect(0,0,cv.width,cv.height);var moved=false;
  ps.forEach(function(p){p.y+=p.v;p.x+=Math.sin(p.y*.02+p.w)*1.4;p.w+=p.o*.08;if(p.y<cv.height+30)moved=true;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.w);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();});
  if(moved&&Date.now()-t0<4200&&typeof requestAnimationFrame!=='undefined')requestAnimationFrame(fr);else ctx.clearRect(0,0,cv.width,cv.height);
 })();
}

function kTag(k){return k==='شعر'?'🎵 شعر':k==='حکایت'?'📜 حکایت':k==='نثر کهن'?'🏺 نثرِ کهن':k==='داستان'?'📗 داستان':k==='نثر و شعر'?'📝 نثر و شعر':'📖 نثر';}

function drawFilters(){
 $('#chapfilters').innerHTML='<button class="pill '+(state.chapFilter===-1?'on':'')+'" onclick="state.chapFilter=-1;drawFilters();drawList()">📚 همه</button>'
 +CH.map(function(c,i){return '<button class="pill '+(state.chapFilter===i?'on':'')+'" onclick="state.chapFilter='+i+';drawFilters();drawList()">'+c.icon+' فصلِ '+fa(c.n)+'</button>';}).join('');

function drawList(){
 var chs=state.chapFilter===-1?CH:[CH[state.chapFilter]];
 var html='';
 chs.forEach(function(c){
  html+='<div class="section-title">'+c.icon+' فصلِ '+fa(c.n)+': '+c.title+'</div>';
  html+=c.lessons.map(function(l){
   var nb=(l.words||[]).length,np=(l.poem||[]).length;
   var st=done[l.id]?'✅ ':'';
   var sub=esc(l.d)+(authorOf(l)?' · '+esc(authorOf(l)):'')+' · '+fa(nb)+' واژه'+(np?' · '+fa(np)+' بیت/بند':'');
   return '<div class="lesson" onclick="openLesson(\''+l.id+'\')">'
    +'<div class="num" style="background:linear-gradient(135deg,'+l.color+','+dark(l.color)+')">'+l.icon+'</div>'
    +'<div style="flex:1;min-width:0"><b>'+st+esc(l.t)+'</b><span>'+sub+'</span></div>'
    +'<span class="tag">'+kTag(l.k)+'</span></div>';
  }).join('');
 });
 $('#lessonlist').innerHTML=html;
}

 ents.forEach(function(e,ei){
  var target=normT(e[0]).replace(/\s+/g,'');if(!target)return;
  var matched=false;
  for(var i=pos;i<words.length&&!matched;i++){
   var acc='';

    if(acc.length>=target.length){if(acc===target){for(var t=i;t<=j;t++)used[t]={role:e[1],ei:ei};pos=j+1;matched=true;}break;}
   }
  }

}

/* جورکردن */
function startMatch(ls,lid){
 var pool=[];ls.forEach(function(l){(l.words||[]).forEach(function(w){if(w[1].length<=42&&!/[+…]/.test(w[1]))pool.push({w:w[0],m:w[1]});});});
 var seenW={},seenM={},uniq=[];
 shuffle(pool).forEach(function(p){if(seenW[p.w]||seenM[p.m])return;var bad=uniq.some(function(u){return overlap(u.m,p.m);});if(bad)return;seenW[p.w]=1;seenM[p.m]=1;uniq.push(p);});
 if(uniq.length<5){toast('واژه‌ی کافی نیست');return;}
 var rounds=[];for(var r=0;r<3&&uniq.length>=(r+1)*5;r++)rounds.push(uniq.slice(r*5,r*5+5));
 state.match={rounds:rounds,r:0,sel:null,ok:0,miss:0,t0:Date.now(),lid:lid};
 navTo('match');
}
VIEWS.match=function(){
 var M=state.match,R0=M.rounds[M.r];
 var ws=shuffle(R0.map(function(p,i){return i;})),ms=shuffle(R0.map(function(p,i){return i;}));
 $('#page').innerHTML='<div class="qscene">'
  +'<div class="qtop"><button class="back" onclick="navTo(\'games\')">✕</button><div class="prog"><div class="qinfo"><span>🧩 جورکردن · مرحله‌ی '+fa(M.r+1)+' از '+fa(M.rounds.length)+'</span><span>✅ '+fa(M.ok)+' · ❌ '+fa(M.miss)+'</span></div>'
  +'<div class="pbar"><i style="width:'+Math.round(M.r/M.rounds.length*100)+'%"></i></div></div></div>'
  +'<div class="card"><p class="lead">اول یک واژه را لمس کن، بعد معنیِ آن را.</p><div class="mgrid">'
  +'<div class="mcol">'+ws.map(function(i){return '<button class="mbtn mw" data-i="'+i+'" onclick="mPick(this)">'+esc(R0[i].w)+'</button>';}).join('')+'</div>'
  +'<div class="mcol">'+ms.map(function(i){return '<button class="mbtn mm" data-i="'+i+'" onclick="mPick(this)">'+esc(R0[i].m)+'</button>';}).join('')+'</div>'
  +'</div></div></div>';
};
function mPick(b){
 var M=state.match;if(b.classList.contains('ok'))return;
 var isW=b.classList.contains('mw');
 if(!M.sel||M.sel.classList.contains(isW?'mw':'mm')){
  document.querySelectorAll('.mbtn.sel').forEach(function(x){x.classList.remove('sel');});
  b.classList.add('sel');M.sel=b;beep('tap');return;
 }
 var a=M.sel;M.sel=null;a.classList.remove('sel');
 if(a.dataset.i===b.dataset.i){
  a.classList.add('ok');b.classList.add('ok');M.ok++;beep('ok');addXP(1);
  if(document.querySelectorAll('.mbtn.mw:not(.ok)').length===0){
   TIMERS.push(setTimeout(function(){
    M.r++;if(M.r<M.rounds.length){VIEWS.match();}
    else{var sec=Math.round((Date.now()-M.t0)/1000),total=M.ok+M.miss;
     store('fs6_games',gamesPlayed()+1);var sc=Math.max(0,M.ok*10-M.miss*3);var rec=setBest('match',sc);
     beep('win');confetti();checkBadges();
     state.gres={k:'match',p:Math.round(M.ok/Math.max(1,total)*100),right:sc,n:0,rec:rec,wrong:[],lid:M.lid};
     navTo('gresult');toast('⏱️ زمان: '+fa(sec)+' ثانیه');}
   },550));
  }
 } else {M.miss++;beep('no');[a,b].forEach(function(x){x.classList.add('bad');setTimeout(function(){x.classList.remove('bad');},450);});}
}
/* مسابقه‌ی سرعت */
function startSpeed(ls){
 state.speed={ls:ls,score:0,miss:0,left:60,q:null};
 navTo('speed');
 var t=setInterval(function(){var S=state.speed;if(!S||state.v!=='speed'){clearInterval(t);return;}S.left--;var e=$('#stime');if(e){e.textContent=fa(S.left);$('#sbar').style.width=(S.left/60*100)+'%';}if(S.left<=0){clearInterval(t);endSpeed();}},1000);
 TIMERS.push(t);
}
function speedQ(){var S=state.speed,g=[genMeaning,genOpp,genMeaning,genFam][Math.floor(Math.random()*4)](S.ls,1);if(!g.length)g=genMeaning(lessonsIn(-1),1);S.q=g[0];}
VIEWS.speed=function(){
 var S=state.speed;speedQ();
 $('#page').innerHTML='<div class="qscene"><div class="qtop"><button class="back" onclick="navTo(\'games\')">✕</button><div class="prog"><div class="qinfo"><span>⚡ مسابقه‌ی سرعت · ⏱️ <b id="stime">'+fa(S.left)+'</b> ثانیه</span><span>✅ <b id="sscore">'+fa(S.score)+'</b></span></div><div class="pbar"><i id="sbar" style="width:'+(S.left/60*100)+'%"></i></div></div></div>'
  +'<div class="qcard" id="sq"></div></div>';
 drawSpeedQ();
};
function drawSpeedQ(){var q=state.speed.q;$('#sq').innerHTML='<div class="qq">'+esc(q.q)+'</div><div class="divider"></div>'+q.o.map(function(o,i){return '<button class="opt" onclick="sAnswer('+i+',this)"><span class="l">'+fa(i+1)+'</span><span>'+esc(o)+'</span></button>';}).join('');}
function sAnswer(i,b){
 var S=state.speed;if(S.lock)return;S.lock=true;
 var ok=i===S.q.a;b.classList.add(ok?'right':'wrong');
 if(ok){S.score++;beep('ok');}else{S.miss++;beep('no');document.querySelectorAll('#sq .opt')[S.q.a].classList.add('right');}
 $('#sscore').textContent=fa(S.score);
 TIMERS.push(setTimeout(function(){S.lock=false;if(state.v!=='speed'||S.left<=0)return;speedQ();drawSpeedQ();},ok?350:900));
}
function endSpeed(){
 var S=state.speed;if(!S||state.v!=='speed')return;
 store('fs6_games',gamesPlayed()+1);addXP(S.score*2);var rec=setBest('speed',S.score);
 if(S.score>=10){beep('win');confetti();}
 checkBadges();
 state.gres={k:'speed',p:Math.round(S.score/Math.max(1,S.score+S.miss)*100),right:S.score,n:0,rec:rec,wrong:[]};
 navTo('gresult');
}

function fNext(){state.fcard=(state.fcard+1)%state.flist.length;beep('tap');VIEWS.cards();}
function fPrev(){state.fcard=(state.fcard-1+state.flist.length)%state.flist.length;beep('tap');VIEWS.cards();}
function fShuf(){state.flist=shuffle(state.flist);state.fcard=0;toast('🔀 کارت‌ها بُر خورد!');beep('tap');VIEWS.cards();}
function fKnow(){state.flist.splice(state.fcard,1);state.fknown=(state.fknown||0)+1;addXP(1);countFlip();beep('ok');
 if(!state.flist.length){confetti();beep('win');store('fs6_games',gamesPlayed()+1);checkBadges();toast('🎉 همه‌ی کارت‌ها را بلد بودی!');navTo('games');return;}
 if(state.fcard>=state.flist.length)state.fcard=0;VIEWS.cards();}
function fAgain(){var it=state.flist.splice(state.fcard,1)[0];state.flist.push(it);if(state.fcard>=state.flist.length)state.fcard=0;countFlip();beep('tap');VIEWS.cards();}

function hl(t,q){t=esc(t);if(!q)return t;var k=t.indexOf(esc(q));return k<0?t:t.slice(0,k)+'<mark>'+t.slice(k,k+esc(q).length)+'</mark>'+t.slice(k+esc(q).length);}
function doSearch(){
 var q=($('#sq2')||{value:''}).value.trim();state.sq=q;
 var box=$('#sres');
 if(q.length<2){box.innerHTML='<div class="card mini">دست‌کم دو حرف بنویس. می‌توانی نامِ درس، واژه، معنی، قاعده، آرایه، شاعر یا ضرب‌المثل را جست‌وجو کنی.</div>';return;}
 var out=[];
 allLessons().forEach(function(x){var l=x.l;
  if(l.t.indexOf(q)>=0||authorOf(l).indexOf(q)>=0)out.push('<div class="sr" onclick="openLesson(\''+l.id+'\')"><span class="st">درس</span><b>'+l.icon+' '+hl(l.t,q)+'</b><span>'+esc(l.d)+' · '+esc(authorOf(l))+'</span></div>');
 });
 QA.forEach(function(a,i){var txt=JSON.stringify(a.p).replace(/<[^>]+>/g,'');if(a.t.indexOf(q)>=0||txt.indexOf(q)>=0)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'qa\',topen:'+i+'})"><span class="st">قاعده</span><b>'+a.ic+' '+hl(a.t,q)+'</b></div>');});
 ARTS.forEach(function(a,i){if(a.n.indexOf(q)>=0||a.d.indexOf(q)>=0)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'arts\',topen:'+i+'})"><span class="st">آرایه</span><b>'+a.ic+' '+hl(a.n,q)+'</b><span>'+esc(a.d)+'</span></div>');});
 FORMS.forEach(function(f){if(f.n.indexOf(q)>=0)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'forms\'})"><span class="st">قالب</span><b>📐 '+hl(f.n,q)+'</b></div>');});
 var wc=0;allLessons().forEach(function(x){(x.l.words||[]).forEach(function(w){if(wc<60&&(w[0].indexOf(q)>=0||w[1].indexOf(q)>=0)){wc++;out.push('<div class="sr" onclick="openLesson(\''+x.l.id+'\')"><span class="st">واژه</span><b>'+hl(w[0],q)+'</b><span>'+hl(w[1],q)+' · '+esc(x.l.t)+'</span></div>');}});});
 PROV.forEach(function(p){if(p[0].indexOf(q)>=0||p[1].indexOf(q)>=0)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'prov\'})"><span class="st">مَثَل</span><b>'+hl(p[0],q)+'</b><span>'+esc(p[1])+'</span></div>');});
 SYN.forEach(function(s){if(s[0]===q)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'vocab\'})"><span class="st">هم‌معنی</span><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>');});
 HAMAVA.forEach(function(h){if(h[0]===q||h[2]===q)out.push('<div class="sr" onclick="navTo(\'tsec\',{tk:\'vocab\'})"><span class="st">هم‌آوا</span><b>'+esc(h[0])+' / '+esc(h[2])+'</b><span>'+esc(h[1])+' / '+esc(h[3])+'</span></div>');});
 box.innerHTML=out.length?'<div class="dcount">'+fa(out.length)+' نتیجه</div>'+out.join(''):'<div class="card mini">چیزی پیدا نشد؛ شکلِ دیگری از واژه را امتحان کن.</div>';
}

 'چون و چو اگر به معنیِ «مانندِ» باشند حرفِ اضافه‌اند؛ اگر معنیِ «وقتی که» بدهند، حرفِ ربط‌اند.'];

 document.querySelector('.bottomnav').innerHTML='<div class="in">'+tabs.map(function(t){return '<button data-v="'+t[0]+'" onclick="navTo(\''+t[0]+'\')"><span class="bi">'+t[1]+'</span>'+t[2]+'</button>';}).join('')+'</div>';
 var sb=$('#soundbtn');

 var root=document.body;

<div class="fa-view" role="toolbar" aria-label="اندازهٔ نمایش"><button type="button" class="fa-proj-btn" aria-pressed="false" title="حالت پروژکتور (کلید P)">🖥️ پروژکتور</button><button type="button" class="fa-zo" title="کوچک‌تر (کلید −)" aria-label="کوچک‌تر">A−</button><button type="button" class="fa-zv" title="اندازهٔ پیش‌فرض (کلید 0)">۱۰۰٪</button><button type="button" class="fa-zi" title="بزرگ‌تر (کلید +)" aria-label="بزرگ‌تر">A+</button><button type="button" class="fa-fs" title="تمام‌صفحه (کلید F)" aria-label="تمام‌صفحه">⛶</button></div>
<script>
/* ===== حالت پروژکتور و بزرگ‌نمایی داخلی =====
   بزرگ‌نمایی با ویژگی zoom روی کل نرم‌افزار انجام می‌شود؛ درس‌ها، بازی‌ها و
   آزمون‌ها دست نمی‌خورند. هنگام تغییر اندازه، همان قسمتی که وسط صفحه بود
   سرِ جایش می‌ماند. نوار ابزار بیرون از نرم‌افزار است تا همیشه یک اندازه بماند. */
(function(){
  var root=document.getElementById('fa6root'), bar=document.querySelector('.fa-view');
  if(!root||!bar) return;
  var KEY='fa6_view', MIN=0.7, MAX=3;
  var v={proj:false,z:1,pz:0};
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'{}'); if(sv&&typeof sv==='object'){v.proj=!!sv.proj; v.z=+sv.z||1; v.pz=+sv.pz||0;}}catch(e){}
  var faNum=function(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
  var clamp=function(z){return Math.min(MAX,Math.max(MIN,Math.round(z*10)/10))};
  /* اندازهٔ خودکار پروژکتور: عرضِ مؤثر حدود ۸۵۰ پیکسل → متن درشت و خوانا */
  var autoZ=function(){return clamp(Math.min(2.6,Math.max(1.2,window.innerWidth/850)))};
  var cur=function(){return v.proj?(v.pz||autoZ()):v.z};
  var save=function(){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
  var anchor=function(){
    var el=document.elementFromPoint(window.innerWidth/2,window.innerHeight/2);
    if(!el||!root.contains(el)) return null;
    return {el:el,top:el.getBoundingClientRect().top};
  };
  var apply=function(keep){
    var a=keep?anchor():null, z=cur();
    root.classList.toggle('fa-proj',v.proj);
    root.style.setProperty('--fz',z);
    bar.querySelector('.fa-zv').textContent=faNum(Math.round(z*100))+'٪';
    bar.querySelector('.fa-proj-btn').setAttribute('aria-pressed',v.proj?'true':'false');
    if(a&&a.el.isConnected) window.scrollBy(0,a.el.getBoundingClientRect().top-a.top);
  };
  var setZ=function(z){z=clamp(z); if(v.proj) v.pz=z; else v.z=z; save(); apply(true)};
  var step=function(d){setZ(cur()+d)};
  var reset=function(){ if(v.proj) v.pz=0; else v.z=1; save(); apply(true)};
  var toggleProj=function(){v.proj=!v.proj; save(); apply(true)};
  var fs=function(){
    var d=document;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{var el=d.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen; if(f){try{var r=f.call(el); if(r&&r.catch) r.catch(function(){})}catch(e){}}}
  };
  bar.querySelector('.fa-zi').onclick=function(){step(0.1)};
  bar.querySelector('.fa-zo').onclick=function(){step(-0.1)};
  bar.querySelector('.fa-zv').onclick=reset;
  bar.querySelector('.fa-proj-btn').onclick=toggleProj;
  bar.querySelector('.fa-fs').onclick=fs;
  /* میان‌بر صفحه‌کلید (وقتی داخل جعبهٔ جست‌وجو یا پاسخ تایپ نمی‌کنید) */
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var t=e.target, tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
    var k=e.key;
    if(k==='+'||k==='=') step(0.1);
    else if(k==='-'||k==='_') step(-0.1);
    else if(k==='0') reset();
    else if(k==='p'||k==='P'||k==='ح') toggleProj();
    else if(k==='f'||k==='F'||k==='ب') fs();
    else return;
    e.preventDefault();
  });
  var rt; window.addEventListener('resize',function(){ if(!v.proj||v.pz) return; clearTimeout(rt); rt=setTimeout(function(){apply(true)},150); });
  apply(false);
})();
</script>
